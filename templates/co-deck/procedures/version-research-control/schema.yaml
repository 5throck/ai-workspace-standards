schema_version: "1.0"
procedure_id: co-deck-version-research-control
variant: co-deck
version: "1.0.0"
title: Version Research Control
phase: 1
status: active
owner_agent: version
purpose: >
  Track source and research package revisions so storyline decisions cite the
  correct evidence set.
inputs:
  - research_pack
preconditions:
  - "Research artifacts are being assembled for the deck."
steps:
  - id: 1
    agent_key: version
    skill_key: version
    output_type: version_record
    description: >
      Record research pack revision, source snapshot, and handoff checkpoint.
outputs:
  - type: version_record
relations:
  - type: follows
    target: procedure.co-deck.source-research
  - type: enables
    target: procedure.co-deck.storyline-development
quality_gates:
  - "Storyline work references a named research revision."
evidence: []
failure_modes:
  - "Research inputs change without a version note; re-baseline before storyline work."
