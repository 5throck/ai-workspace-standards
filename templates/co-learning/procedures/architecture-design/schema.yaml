# co-learning roster: dev-slot agents are PM-dispatched generic specialists per AGENTS.md §3.5 (no named architect/code-writer/test-runner roster) — steps route through pm.
schema_version: "1.0"
procedure_id: co-learning-architecture-design
variant: co-learning
version: "1.0.0"
title: Architecture Design
phase: 2
status: active
owner_agent: pm
purpose: >
  Produce the approved implementation plan and module architecture for the
  feature work.
inputs:
  - technical_findings
preconditions:
  - "Technical planning findings reviewed."
steps:
  - id: 1
    agent_key: pm
    skill_key: code-review
    output_type: approved_implementation_plan
    description: >
      Design the module architecture and author the implementation plan for
      the phase 2 approval gate.
outputs:
  - type: approved_implementation_plan
relations:
  - type: follows
    target: procedure.co-learning.technical-planning
  - type: enables
    target: procedure.co-learning.feature-implementation
quality_gates:
  - "Implementation plan approved at the design gate."
evidence: []
failure_modes:
  - "Plan rejected at the gate - iterate the design rather than implementing an unapproved plan."
