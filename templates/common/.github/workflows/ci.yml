name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  # Manual runs: a one-click full CI pass on any ref. Added 2026-10-31 for fleet
  # parity with co-price's deliberate 2026-10-30 addition (design:
  # Projects/co-price/docs/designs/2026-10-30-ci-migration-drift-gate-design.md §3.1;
  # workspace design: docs/designs/2026-10-31-ci-workflow-dispatch-design.md).
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull-request runs are cancelled; pushes to main are never cancelled
# (fleet test baseline design 2026-11-24 §4.9).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Documentation Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the VERSION_MANIFEST gate derives per-file dates from
          # `git log` — a depth-1 clone collapses every date to the checkout
          # commit and makes the gate fail on any manifest generated elsewhere.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned to 1.4 minor line — `latest` can resolve to a Bun that cannot
          # parse lockfileVersion 2 written by the current toolchain. Bumped deliberately.
          bun-version: "1.4.x"

      # Dependency posture (U-20261028-020): this step installs only a ROOT
      # package.json. Projects with a scripts/-scoped package.json (no root
      # manifest) intentionally skip it — scripts/audit.ts is deliberately
      # dependency-free, so no job in this workflow relies on Bun's implicit
      # auto-install; the subpackage's own flow installs its dependencies.
      - name: Install dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: bun install --frozen-lockfile

      - name: Run audit
        run: bun scripts/audit.ts

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned to 1.4 minor line — `latest` can resolve to a Bun that cannot
          # parse lockfileVersion 2 written by the current toolchain. Bumped deliberately.
          bun-version: "1.4.x"

      - name: Install dependencies
        if: ${{ hashFiles('bun.lock') != '' }}
        run: bun install --frozen-lockfile

      - name: Security audit - dependency vulnerabilities
        shell: bash
        # Fleet dependency-vulnerability gate (2026-10-01 fleet assessment FW-1),
        # waiver-aware since T-20261003-011. Threshold: fail on high or critical;
        # low/moderate findings are reported only. The script keeps the old
        # fail-closed behavior (empty/unparseable audit output = loud infra
        # failure) and adds a REVIEWED advisory-waiver channel:
        # .github/dependency-waivers.toml suppresses specific no-fix advisories.
        # The channel itself fails closed: a malformed file, an expired
        # revisit-by date, or a stale waiver (advisory no longer in the audit
        # output, or version drift vs the installed tree) fails the job, so a
        # waiver can never decay into a silent ignore-all.
        run: bun scripts/dependency-audit.ts

      - name: External-dependency manifest gate
        # External-deps standard §5.4 E4 (design
        # docs/designs/2026-11-07-external-deps-standard-design.md,
        # DEC-20261107-02): offline `verify --manifest-only` over the project's
        # external-deps.json — strict schema parse, license policy (deny-class
        # and license-undeclared entries fail), R3 external/<id> convention,
        # .gitignore coverage, adapter presence, excluded components. No
        # network, no clone. Skipped when the project has no manifest or no CLI.
        if: ${{ hashFiles('external-deps.json') != '' && hashFiles('scripts/external-deps.ts') != '' }}
        run: bun scripts/external-deps.ts verify --manifest-only


  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Run the gitleaks binary directly rather than gitleaks/gitleaks-action.
      # The action requires a GITLEAKS_LICENSE for private repositories and needs
      # pull-requests:read to annotate PRs — neither is warranted here, since all
      # this job needs is a pass/fail scan. Config comes from .gitleaks.toml.
      - name: Run gitleaks
        # Digest = ghcr.io/gitleaks/gitleaks:v8.28.0 multi-arch index
        # (fetched 2026-10-01 via the ghcr registry API, anonymous pull token).
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
        with:
          args: detect --source=/github/workspace --config=/github/workspace/.gitleaks.toml --redact --verbose --no-banner

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    # Release 2 (T-20260930-026, ADR-0094): default-on. Set the repository
    # variable CI_SKIP_DEFAULT_UNIT_TESTS to "true" to opt out. (Release 1 used
    # the inverse opt-in CI_ENABLE_DEFAULT_UNIT_TESTS and was verified live on
    # co-newbiz: green run, job correctly skipped without the variable.)
    # The variable is an emergency switch only — the sanctioned opt-out is the
    # recorded `optOut` block in test-suites.json (fleet test baseline design
    # 2026-11-24 §4.3, ADR-0106).
    if: ${{ vars.CI_SKIP_DEFAULT_UNIT_TESTS != 'true' }}
    timeout-minutes: 15
    outputs:
      # `--plan-os` prints the non-linux platforms with a declared OS-specific
      # target, e.g. ["win32"]. `unit-tests-os` exists only when this is not [].
      os-legs: ${{ steps.plan-os.outputs.os-legs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Depth 1 is enough for tests; full history is only needed by the
          # VERSION_MANIFEST gate in the audit job above.
          fetch-depth: 1
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned minor line — `latest` is intentionally avoided here; bump this
          # deliberately so unit tests track a known Bun release.
          bun-version: "1.4.x"

      - name: Install dependencies
        shell: bash
        # Root install when a root manifest exists, then every nested directory
        # that carries its own bun.lock — projects commonly host an app or
        # service workspace (e.g. app/web-next, services/assessment-service)
        # outside the root lockfile, and tests import from those packages
        # (U-20261002-001). A `for` loop (not `while read` in a pipe) so a failed
        # nested install fails the step. The shell test also covers a
        # scripts/-scoped manifest (co-safety has no root package.json).
        run: |
          if [ -f package.json ]; then bun install --frozen-lockfile; fi
          for lock in $(find . -mindepth 2 -maxdepth 4 \( -name 'bun.lock' -o -name 'bun.lockb' \) -not -path '*/node_modules/*'); do
            (cd "$(dirname "$lock")" && bun install --frozen-lockfile)
          done

      # The single fleet entry point (fleet test baseline design 2026-11-24
      # §4.5-4.7, ADR-0106): baseline, unit when present, declared include,
      # declared suites, OS selection by the running platform. It fails closed
      # when no test is discovered, so a job can never pass with zero tests.
      - name: Run tests
        run: bun scripts/test-runner.ts all

      - name: Plan OS legs
        id: plan-os
        run: echo "os-legs=$(bun scripts/test-runner.ts all --plan-os)" >> "$GITHUB_OUTPUT"

  # The declared-only OS matrix leg (fleet test baseline design 2026-11-24
  # §4.9). An OS leg costs nothing unless the repository declares an
  # OS-specific test (a `.<os>.test.ts` file or a suite `os` key), because the
  # job-level `if` is evaluated before a runner starts. The ubuntu leg above
  # already ran the OS-independent part, so each leg runs only its own
  # platform's tagged files.
  unit-tests-os:
    name: Unit Tests (os)
    needs: unit-tests
    if: ${{ needs.unit-tests.outputs.os-legs != '[]' && vars.CI_SKIP_DEFAULT_UNIT_TESTS != 'true' }}
    runs-on: ${{ matrix.os == 'win32' && 'windows-latest' || 'macos-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.unit-tests.outputs.os-legs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.x"

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package.json ]; then bun install --frozen-lockfile; fi
          for lock in $(find . -mindepth 2 -maxdepth 4 \( -name 'bun.lock' -o -name 'bun.lockb' \) -not -path '*/node_modules/*'); do
            (cd "$(dirname "$lock")" && bun install --frozen-lockfile)
          done

      - name: Run OS-specific tests
        shell: bash
        # --os-scope specific keeps the files tagged for this platform only and
        # is exempt from the baseline rules; it exits 0 with result=no-tests
        # when nothing applies, so a stale matrix entry cannot fail the run.
        run: bun scripts/test-runner.ts all --os-scope specific

  # PROJECT-JOBS-BEGIN
  # Project-local jobs go here. upgrade-project preserves this region; it is validated, not trusted.
  # Project-owned test jobs for other stacks (Python/pytest, setup-python, etc.) belong here too.
  # PROJECT-JOBS-END
