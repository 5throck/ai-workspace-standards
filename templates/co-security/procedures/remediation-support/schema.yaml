schema_version: "1.0"
procedure_id: co-security-remediation-support
variant: co-security
version: "1.0.0"
title: Remediation Support
phase: 4
status: active
owner_agent: patch-engineer
purpose: >
  Support the client through patching and verification of validated findings.
inputs:
  - validated_findings
preconditions:
  - "Findings delivered and remediation window agreed."
steps:
  - id: 1
    agent_key: patch-engineer
    skill_key: finding-reconciliation
    output_type: remediation_plan
    description: >
      Plan patches or mitigations per finding with priority and effort.
  - id: 2
    agent_key: patch-engineer
    skill_key: spdx-sbom
    output_type: sbom_update
    description: >
      Update the SBOM to reflect changed components after patching.
outputs:
  - type: remediation_plan
relations:
  - type: follows
    target: procedure.co-security.threat-model-and-report
quality_gates:
  - "Every remediated finding re-verified against the original evidence."
evidence: []
failure_modes:
  - "Patch breaks functionality - record risk acceptance rather than shipping a broken fix."
