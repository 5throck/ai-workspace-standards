schema_version: "1.0"
procedure_id: co-price-release-assurance
variant: co-price
version: "1.0.0"
title: Release Assurance
phase: 4
status: active
owner_agent: qa-tester
purpose: >
  Assure the built pricing engine across finance, audit, localization, and
  operations before client release.
inputs:
  - engine_build
preconditions:
  - "Engine build complete with waterfall checks passing."
steps:
  - id: 1
    agent_key: qa-tester
    skill_key: harness-verification
    output_type: test_summary
    description: >
      Run the verification harness across pricing scenarios.
  - id: 2
    agent_key: cpa-auditor
    skill_key: double-entry-reconciliation
    output_type: audit_reconciliation
    description: >
      Reconcile engine outputs against accounting entries.
  - id: 3
    agent_key: l10n-auditor
    skill_key: i18n-audit
    output_type: localization_report
    description: >
      Audit localization coverage for target markets.
  - id: 4
    agent_key: cost-asset-mgmt
    skill_key: cost-shock-analysis
    output_type: cost_assurance_notes
    description: >
      Confirm cost data integrity in the release candidate.
  - id: 5
    agent_key: devops-admin
    skill_key: harness-verification
    output_type: deployment_readiness
    description: >
      Verify deployment pipeline and rollback readiness.
  - id: 6
    agent_key: finance-strategy-lead
    skill_key: financial-statement-prep
    output_type: finance_signoff
    description: >
      Grant finance sign-off on the release candidate.
  - id: 7
    agent_key: engagement-director
    skill_key: pricing-playbook
    output_type: release_decision
    description: >
      Make the client-facing release go/no-go decision.
outputs:
  - type: release_decision
relations:
  - type: follows
    target: procedure.co-price.engine-implementation
  - type: enables
    target: procedure.co-price.engagement-review
quality_gates:
  - "All assurance dimensions signed off before release."
evidence: []
failure_modes:
  - "Any assurance dimension unsigned - no release; return to engine implementation."
