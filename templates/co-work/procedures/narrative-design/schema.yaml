schema_version: "1.0"
procedure_id: co-work-narrative-design
variant: co-work
version: "1.0.0"
title: Narrative Design
phase: 2
status: active
owner_agent: storyteller
purpose: >
  Choose and structure the narrative for the deliverable before drafting.
inputs:
  - evidence_pack
preconditions:
  - "Intake analysis complete with verified evidence."
steps:
  - id: 1
    agent_key: storyteller
    skill_key: decision-record
    output_type: narrative_outline
    description: >
      Select the angle and structure the document outline with rationale.
outputs:
  - type: narrative_outline
relations:
  - type: follows
    target: procedure.co-work.project-intake-analysis
quality_gates:
  - "Outline covers every evidence item or records why it is excluded."
evidence: []
failure_modes:
  - "Outline leaves key evidence out - revisit the angle with the analyst."
