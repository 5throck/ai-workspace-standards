source_verification:
  method: manual-curation
  checked_at: "2026-08-26"
# Legal & Regulatory Glossary — Safety OS
# Single source of truth: Korean statute proper noun → English gloss + abbreviation + article citations.
# Consumed by: validate-md-language.ts (Korean allowlist via `statutes` keys), authors (citation consistency).
# Korean statute names are preserved per CLAUDE.md §4 — never translated.
# This file is structured reference data (legitimate bilingual mapping), not prose.
#
# Provenance: All entries and article numbers are mined from actual codebase usage
# (agents/*.md Section A Legal Basis blocks, workflows/**/schema.yaml legal_basis fields,
# regulations/KR/*.yaml). Articles NOT referenced anywhere in the codebase are omitted;
# accuracy over completeness. Unverified entries are explicitly commented.
version: 1.0.8
last_updated: 2026-08-24

# =============================================================================
# KOREAN STATUTES (validator allowlist — keys are the exact Korean strings used
# in codebase citations). NOTE: citation forms vary (제NN조 vs Article NN);
# the `articles[].number` field uses the Korean 제NN조 form as canonical.
# =============================================================================
statutes:
  항만안전특별법:
    english: Port Safety Special Act
    abbreviation: PSSA
    regulator: MOF (해양수산부)
    statute_file: Port-Safety-Special-Act.yaml
    note: |
      Full 17-article structure (Arts 1-17) VERIFIED via legalize_kr.parse_law_structure
      (MST 283835, lawIdCode 014131, last amended 2026-03-10 via law #21443).
      CRITICAL (Phase 0 correction): Art 4 (다른 법률과의 관계) is PROCEDURAL —
      it only declares PSSA's priority over other statutes (except OSHA-KR) and
      is NOT a substantive safety-obligation basis. The SUBSTANTIVE port-safety
      obligation article is Art 6 (항만운송 참여자의 안전확보 의무). Logistics
      workflows must cite Art 6 (not Art 4) for the safety-obligation legal_basis.
      "DSSMA Art 20" citations for dangerous-goods transport refer to
      위험물안전관리법 (DSSMA), NOT PSSA — PSSA stops at Art 17.
    articles:
      - { number: "제4조", topic_en: "PROCEDURAL — Relationship to other laws (다른 법률과의 관계); PSSA priority-of-application clause only. NOT a substantive safety obligation — do not cite as workflow safety-obligation basis (use Art 6)." }
      - { number: "제4조의2", topic_en: "Port Safety Basic Plan establishment and implementation (항만안전기본계획 등 수립·시행) — 신설 2026.3.10" }
      - { number: "제4조의3", topic_en: "Port disaster and safety fact-finding survey (항만재해 및 항만안전 실태조사) — 신설 2026.3.10" }
      - { number: "제5조", topic_en: "Port transport participants' basic obligations — 3 accident-prevention principles (항만운송 참여자의 기본 의무)" }
      - { number: "제6조", topic_en: "SUBSTANTIVE — Port transport participants' safety assurance obligations (항만운송 참여자의 안전확보 의무 등): safe working environment, state/Local cooperation, MOF-MOEL 중대재해 cooperation" }
      - { number: "제7조", topic_en: "Port Safety Council establishment and operation (항만안전협의체의 구성·운영)" }
      - { number: "제8조", topic_en: "Safety education for port transport workers (안전교육)" }
      - { number: "제9조", topic_en: "Self-safety management plan establishment and approval (자체안전관리계획의 수립·승인 등)" }
      - { number: "제12조", topic_en: "Business suspension / registration cancellation — SAPA cross-reference (사업정지 등; violates SAPA Art 4/5 causing 항만안전사고, or SAPA Art 6 벌금형 확정)" }
      - { number: "제15조", topic_en: "Penalty — up to 1yr imprisonment or 10M KRW fine (자체안전관리계획 위반 벌칙)" }
      - { number: "제16조", topic_en: "Dual liability (양벌규정)" }
      - { number: "제17조", topic_en: "Administrative fine — up to 3M KRW (과태료; 안전교육 미실시, 검사 거부 등)" }
  철도안전법:
    english: Rail Safety Act
    abbreviation: RSA
    regulator: MOLIT (국토교통부)
    articles:
      - { number: "제45조", topic_en: "Restrictions on acts within railway protection zones (철도보호지구)" }
      - { number: "제48조", topic_en: "Prohibited acts for railway protection and order maintenance" }
  하수도법:
    english: Sewerage Act
    abbreviation: SA
    regulator: ME (환경부)
    articles:
      - { number: "제19조", topic_en: "Public sewerage operation/maintenance; damage prohibition" }
      - { number: "제20조", topic_en: "Technical diagnosis and inspection of sewerage facilities" }
  총포·도검·화약류 등의 안전관리에 관한 법률:
    english: Act on the Safety Management of Firearms, Swords, Explosives, etc.
    abbreviation: FSESA
    regulator: NPA (경찰청)
    articles:
      - { number: "제9조",  topic_en: "Permission for import/export of firearms/swords/explosives" }
      - { number: "제23조", topic_en: "Reporting on discovery/pickup of regulated items" }
  방위사업법:
    english: Defense Acquisition Act
    abbreviation: DAA
    regulator: DAPA (방위사업청)
    note: "Article 18 (전문연구기관 및 방위산업체 지정) was deleted on 2020.3.31. REMEDIATED 2026-08-06: codebase references migrated to active Art.28 (품질보증) and Art.53 (군용 화약류 제조 특례)."
    articles:
      - { number: "제28조", topic_en: "Quality assurance for munitions (replaced deleted Art.18)" }
      - { number: "제53조", topic_en: "Special provisions for manufacture of military firearms/explosives" }
  산업안전보건법:
    english: Occupational Safety and Health Act
    abbreviation: OSHA-KR
    regulator: MOEL (고용노동부)
    articles:
      - { number: "제13조",  topic_en: "Technical and work-environment standards issued/guided by MOEL (기술 또는 작업환경에 관한 표준) — NOT first-aid/emergency education" }
      - { number: "제14조",  topic_en: "Annual safety/health plan — board report & approval (안전·보건 계획 이사회 보고·승인); SHM regulations are Arts 25-26" }
      - { number: "제15조",  topic_en: "Safety and Health Management Supervisor (안전보건관리책임자) duties" }
      - { number: "제16조",  topic_en: "Management Supervisor (관리감독자) duties" }
      - { number: "제17조",  topic_en: "Safety Manager appointment" }
      - { number: "제24조",  topic_en: "Occupational Safety and Health Committee" }
      - { number: "제29조",  topic_en: "Worker safety and health education (근로자 안전보건교육); special education for hazardous work = Art 29(3) + OSHSR §26" }
      - { number: "제31조",  topic_en: "Construction-industry basic safety and health education for day laborers (건설업 기초안전보건교육) — NOT special education" }
      - { number: "제32조",  topic_en: "Job-related education for safety/health management supervisors, safety/health managers, officers (안전보건관리책임자 등 직무교육; 관리감독자 excluded)" }
      - { number: "제36조",  topic_en: "Risk assessment (위험성평가 실시)" }
      - { number: "제38조",  topic_en: "Safety measures (안전조치) — general basis for fall/collapse/electrical hazard prevention; technical detail in OSHSR" }
      - { number: "제39조",  topic_en: "Health measures (보건조치)" }
      - { number: "제42조",  topic_en: "Preparation/submission of hazard-prevention plans for construction (유해위험방지계획서의 작성·제출)" }
      - { number: "제44조",  topic_en: "Process Safety Management (PSM) for covered processes" }
      - { number: "제51조",  topic_en: "Suspension of Work by Employer" }
      - { number: "제52조",  topic_en: "Suspension of Work by Workers" }
      - { number: "제54조",  topic_en: "Action upon Serious Accidents (stop work, evacuate, prevent recurrence)" }
      - { number: "제57조",  topic_en: "Incident Recording & Reporting (retain 3 years)" }
      - { number: "제61조",  topic_en: "Safety and Health Measures in Contracted Projects" }
      - { number: "제62조",  topic_en: "Safety/health cooperation obligations" }
      - { number: "제63조",  topic_en: "Ordering party's safety and health measures (도급인의 안전보건조치)" }
      - { number: "제89조",  topic_en: "Voluntary safety confirmation — declaration (자율안전확인의 신고; Arts 89-92)" }
      - { number: "제93조",  topic_en: "Safety inspection (안전검사)" }
      - { number: "제98조",  topic_en: "Safety inspection under voluntary inspection programs (자율검사프로그램에 따른 안전검사) — NOT permit-to-work" }
      - { number: "제99조",  topic_en: "Revocation of voluntary-inspection-program recognition (자율검사프로그램 인정의 취소 등) — NOT fall prevention" }
      - { number: "제100조", topic_en: "Voluntary safety inspection institutions (자율안전검사기관) — NOT collapse prevention" }
      - { number: "제101조", topic_en: "Performance tests, etc. (성능시험 등) — NOT electrical hazard prevention" }
      - { number: "제103조", topic_en: "Comprehensive management of machinery safety information (유해·위험기계등 안전 정보 종합관리) — NOT SHM plan" }
      - { number: "제104조", topic_en: "Hazard-factor classification criteria (유해인자의 분류기준) — statutory GHS anchor, delegated detail in 산업안전보건법 시행규칙 별표 18" }
      - { number: "제108조", topic_en: "Hazard investigation of new chemical substances (신규화학물질의 유해성·위험성 조사); voluntary safety confirmation is Arts 89-92" }
      - { number: "제110조", topic_en: "MSDS preparation & submission to MOEL (물질안전보건자료의 작성·제출); posting/keeping = Art 114" }
      - { number: "제111조", topic_en: "MSDS provision duty to transferees/recipients (물질안전보건자료의 제공)" }
      - { number: "제112조", topic_en: "Partial non-disclosure approval for trade secrets (일부 비공개 승인 등); MSDS format/content = OSHSR §156" }
      - { number: "제113조", topic_en: "Information submission by agents appointed by overseas manufacturers (국외제조자 선임 대리인 정보제출); substance bans/permits = Arts 117-118" }
      - { number: "제114조", topic_en: "MSDS posting & worker education (물질안전보건자료의 게시 및 교육); warning labels = Art 115" }
      - { number: "제115조", topic_en: "Warning labels on containers of MSDS-subject substances (용기 등의 경고표시)" }
      - { number: "제117조", topic_en: "Prohibition of manufacture/import etc. of hazardous/dangerous substances (유해·위험물질의 제조 등 금지)" }
      - { number: "제118조", topic_en: "Permission for manufacture/import etc. of hazardous/dangerous substances (유해·위험물질의 제조 등 허가)" }
      - { number: "제125조", topic_en: "Work Environment Measurement" }
      - { number: "제129조", topic_en: "Worker Health Examination — General" }
      - { number: "제130조", topic_en: "Worker Health Examination — Special" }
      - { number: "제155조", topic_en: "MOEL workplace inspection authority" }
    note: "KOSHA GUIDE Z-40-2022 (Lockout/Tagout — 자물쇠와 표지판 작업) supplements OSHA-KR equipment safety provisions. 2026-08-24 SGM arbitration: legacy pre-2008-numbering drift corrected — 제13조 (was first-aid), 제31조 (was special education), 제32조 (was supervisor education), 제98-103 (were fall/collapse/electrical/PTW/SHM-plan), 제110-114 (MSDS topic off-by-one), 제243 removed (non-existent; statute ends at Art 175). GHS anchor = Art 104 + 시행규칙 별표18; MSDS procedures = 시행규칙 §156-169."

  중대재해처벌법:
    english: Serious Accidents Punishment Act
    abbreviation: SAPA
    regulator: MOEL (고용노동부)
    note: "Full 16-article structure: Ch.1 General (Art 1-2), Ch.2 Serious Industrial Accidents (Art 3-9), Ch.3 Serious Civic Disasters (Art 10-11), Ch.4 Supplementary (Art 12-16). Verified via kr_safety MCP (MST=228817)."
    articles:
      - { number: "제3조",  topic_en: "Scope — application to business owners and management responsible persons (경영책임자등의 범위)" }
      - { number: "제4조",  topic_en: "Safety and health assurance obligation — management system establishment (사업주와 경영책임자등의 안전 및 보건 확보의무)" }
      - { number: "제5조",  topic_en: "Obligations for Contract, Lease, and Outsourcing (도급·용역·위탁 등 관계에서의 안전·보건 확보의무)" }
      - { number: "제6조",  topic_en: "Punishment for serious industrial accidents (중대산업재해 사업주와 경영책임자등의 처벌)" }
      - { number: "제7조",  topic_en: "Dual liability for serious industrial accidents — corporate penalty (중대산업재해의 양벌규정)" }
      - { number: "제8조",  topic_en: "Mandatory safety and health education attendance (안전보건교육의 수강)" }
      - { number: "제9조",  topic_en: "Safety and health assurance obligation for civic disasters (중대시민재해 사업주와 경영책임자등의 안전 및 보건 확보의무)" }
      - { number: "제10조", topic_en: "Punishment for serious civic disasters (중대시민재해 사업주와 경영책임자등의 처벌)" }
      - { number: "제11조", topic_en: "Dual liability for serious civic disasters — corporate penalty (중대시민재해의 양벌규정)" }
      - { number: "제12조", topic_en: "Notification of final conviction (형 확정 사실의 통보)" }
      - { number: "제13조", topic_en: "Public disclosure of serious industrial accident occurrence (중대산업재해 발생사실 공표)" }
      - { number: "제14조", topic_en: "Special procedural rules for trials (심리절차에 관한 특례)" }
      - { number: "제15조", topic_en: "Damages liability (손해배상의 책임)" }
      - { number: "제16조", topic_en: "Government support and reporting requirements (정부의 사업주 등에 대한 지원 및 보고)" }

  안전보건기준에관한규칙:
    english: Occupational Safety and Health Standards Rules
    abbreviation: OSHA-KR-Rules
    regulator: MOEL (고용노동부)
    note: "MOEL administrative rule (고용노동부령) under OSHA-KR. Also cited in codebase as '산업안전보건기준에 관한 규칙' — same rule, formal spaced-key variant; see subordinate_rules for cross-reference."
    articles:
      - { number: "제92조", topic_en: "Stopping operation during maintenance etc. — Lockout/Tagout (정비 등의 작업 시의 운전정지 등)" }
      - { number: "제618조", topic_en: "Confined space — definitions (밀폐공간, 유해가스, 적정공기, 산소결핍)" }
      - { number: "제623조", topic_en: "Confined space — watcher/monitor assignment (감시인의 배치 등)" }

