# ---------------------------------------------------------------------------
# Gaps for SGM/PM triage
# ---------------------------------------------------------------------------
gaps:
  - industry: logistics
    issue: No dedicated regulations/KR yaml file for 항만안전특별법 (PSSA)
    impact: |
      PSSA is the primary port-safety statute and was VERIFIED LIVE via
      legalize_kr this session. Article numbers (Art 4/5/6/8/9) are reliable.
      But there is no Port-Safety-Special-Act.yaml in regulations/KR/, so the
      scaffold generator cannot reference a statute-file by filename.
    recommendation: |
      Register a new statute file regulations/KR/Port-Safety-Special-Act.yaml
      (Phantom Statute precedent — commit 5bbc6b4). The anchor data is already
      verified in this file's `industries.logistics.primary_statute` block.

  - industry: shipbuilding
    issue: No dedicated statute file; OSHA-KR is the de facto primary
    impact: |
      Shipbuilding has no single dedicated safety statute in Korea. The
      composite anchor (OSHA-KR + DSSMA + HPGSCA) is sufficient for the >=3
      legal_sources invariant, but a Shipbuilding-Safety.yaml convenience file
      could group the shipyard-specific OSHA-KR articles (Art 38 + OSHSR Ch.6) and
      document the block-erection, dry-dock, and painting hazards.
    recommendation: Optional — no action required for Phase 0. Consider in Phase 2 if shipbuilding-domain workflows need a unified reference.

  - industry: steelmaking
    issue: No dedicated statute file; OSHA-KR is the de facto primary
    impact: Similar to shipbuilding.
    recommendation: Optional — same as shipbuilding.

  - industry: semicon
    issue: No dedicated statute file; composite CCA + HPGSCA + DSSMA
    impact: Similar to shipbuilding.
    recommendation: Optional — same as shipbuilding.

  - industry: datacenter
    issue: No dedicated statute file; composite ESCA + DSSMA + BFS
    impact: Similar to shipbuilding.
    recommendation: Optional — same as shipbuilding.

  - industry: battery
    issue: No dedicated statute file; composite DSSMA + CCA + ESCA
    impact: Similar to shipbuilding.
    recommendation: Optional — same as shipbuilding.

  - statute: HPGSCA (고압가스 안전관리 및 사업법)
    issue: RESOLVED for shipbuilding/steelmaking/semicon (2026-08-07)
    impact: |
      Prior session flag was "not indexed in legalize_kr" — STALE as of 2026-08-07.
      legalize_kr.get_law_metadata("고압가스안전관리법") succeeds (MST 283919, lawIdCode 001850),
      and parse_law_structure full-text revealed that Art 14 (deleted 1999.2.8), Art 17 (용기등의
      검사), and Art 28 (한국가스안전공사의 설립) were ALL mis-cited in the prior anchor data.
      Affects semicon, shipbuilding, steelmaking, battery — HPGSCA is cited in 4 industries.
    resolution: |
      2026-08-07 (Group C-1b remediation): shipbuilding + steelmaking anchor blocks now cite
      the verified-current article set Art 11/13/15/24/26; High-Pressure-Gas-Safety.yaml and
      legal-glossary.yaml HPGSCA entries reconciled to the same set. See
      memory/findings/compliance-2026-08-07-phase2-group-c-anchors.md §3.1-3.2.
      2026-08-07 (semicon follow-up remediation): semicon anchor block + 4 semicon workflow
      schemas + 2 silane READMEs remediated to the same Art 11/13/15/24/26 set. See
      memory/findings/compliance-2026-08-07-semicon-hpgsca-remediation.md.
    open_followup: |
      battery industry does NOT cite HPGSCA in its anchor (uses DSSMA + CCA + ESCA) — no
      HPGSCA remediation needed for battery. All 3 HPGSCA-citing industries (shipbuilding,
      steelmaking, semicon) now use the verified Art 11/13/15/24/26 set.

  - statute: Bioethics Act (생명윤리 및 안전에 관한 법률)
    issue: Not indexed in legalize_kr under the formal name
    impact: |
      BSA Art 13 (IRB) and Art 16 (informed consent) sourced from
      Bioethics-and-Safety-Act.yaml but could not be re-verified live. Affects
      biotech industry only.
    recommendation: Same as HPGSCA — re-verify when legalize_kr index expands.

  - statute: LMO Act (유전자변형생물체의 국가간 이동 등에 관한 법률)
    issue: Not indexed in legalize_kr under any name variant tried
    impact: |
      LMO-Act Art 22 (containment) and Art 24 (labeling) sourced from
      LMO-Transboundary-Movement.yaml but could not be re-verified live.
      Affects biotech industry only.
    recommendation: Same as HPGSCA — re-verify when legalize_kr index expands.

  - glossary: ESCA (전기안전관리법) article-number discrepancy
    issue: |
      regulations/KR/legal-glossary.yaml cites ESCA Art 29 for "전기안전관리자
      선임" (safety manager appointment), but live law shows Art 29 =
      "전기안전관리업무에 대한 실태조사 등" (fact-finding survey). The actual
      safety-manager article is Art 22.
    impact: |
      Affects datacenter and battery industry anchors (and any other domain
      that consumes the ESCA glossary entry). This anchor file uses the
      VERIFIED-correct articles (Art 16 + Art 22), but the glossary remains
      wrong and will continue to mislead other consumers.
    recommendation: |
      SGM/PM should reconcile legal-glossary.yaml ESCA entry to match the
      live law. Out of scope for this task (A-03 — anchor table only).

  - glossary: CCA (화학물질관리법) article-number imprecision
    issue: |
      Glossary cites CCA Art 20/23, but live law shows Art 20 = import
      notification (not safety management). The real chemical-safety anchors
      are Art 23 (화학사고예방관리계획서) and Art 24 (취급시설 기준).
    impact: Affects battery, semicon, waste industry anchors.
    recommendation: SGM/PM should reconcile legal-glossary.yaml CCA entry. Out of scope for this task.

  - glossary: DSSMA (위험물안전관리법) article-number incompleteness
    issue: |
      Glossary cites DSSMA Art 5/27 but omits Art 15 (위험물안전관리자 — the
      actual safety-manager appointment article) and Art 17 (예방규정).
    impact: Affects battery, datacenter, semicon, shipbuilding, steelmaking, waste.
    recommendation: SGM/PM should add Art 15 and Art 17 to legal-glossary.yaml DSSMA entry. Out of scope for this task.

last_updated: "2026-08-24"

