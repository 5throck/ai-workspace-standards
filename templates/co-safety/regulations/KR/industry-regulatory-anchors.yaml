      unverified:
        - "BSA Art 13, Art 16 [UNVERIFIED-via-legalize-kr] — legalize_kr.parse_law_structure returned [] under formal name '생명윤리 및 안전에 관한 법률'; articles sourced from Bioethics-and-Safety-Act.yaml (originally from mcp-kr-legislation). Recommend re-verify when statute is indexed."
        - "LMO-Act Art 22, Art 24 [UNVERIFIED-via-legalize-kr] — legalize_kr returned [] under '유전자변형생물체의 국가간 이동 등에 관한 법률'; sourced from LMO-Transboundary-Movement.yaml. Recommend re-verify."

