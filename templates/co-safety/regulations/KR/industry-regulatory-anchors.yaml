  battery:
    display_name: Battery (Lithium-ion secondary cells)
    has_dedicated_statute_file: false
    primary_statute:
      name_ko: 위험물안전관리법
      abbreviation: DSSMA
      statute_file: Hazardous-Materials-Safety-Control.yaml
      key_articles:
        - article: "5"
          topic_ko: 위험물의 저장 및 취급 제한 + 기술기준
          topic_en: Dangerous-goods storage/handling restrictions and technical standards
        - article: "15"
          topic_ko: 위험물안전관리자 선임
          topic_en: Dangerous-goods Safety Manager appointment
        - article: "27"
          topic_ko: 응급조치·통보 및 조치명령 (유출/화재/폭발 대응)
          topic_en: Emergency response, notification, and corrective orders
    adjacent_laws:
      - name_ko: 화학물질의 등록 및 평가 등에 관한 법률 (화학물질관리법)
        abbreviation: CCA
        statute_file: CCA-Chemical-Control.yaml
        key_articles:
          - article: "23"
            topic_ko: 화학사고예방관리계획서 작성·제출
            topic_en: Chemical Accident Prevention Management Plan
          - article: "24"
            topic_ko: 취급시설의 배치·설치 및 관리 기준
            topic_en: Handling-facility layout, installation, and management standards
      - name_ko: 전기안전관리법
        abbreviation: ESCA
        statute_file: Electrical-Safety-Act.yaml
        key_articles:
          - article: "16"
            topic_ko: 전기재해 예방을 위한 안전조치
            topic_en: Electrical-disaster prevention safety measures
          - article: "22"
            topic_ko: 전기안전관리자 선임 등
            topic_en: Electrical Safety Manager appointment
    sapa:
      ref: universal_anchors.sapa
      note: Battery manufacturing involves significant contractor/subcontractor activity — SAPA Art 5 (outsourcing) is highly relevant.
    osha_kr_anchor:
      ref: universal_anchors.osha_kr
    notes: |
      Lithium-ion battery manufacturing is not governed by a single dedicated
      statute. The composite anchor is DSSMA (flammable electrolyte solvents),
      CCA (chemical accident prevention), and ESCA (high-voltage formation,
      charging, testing). Also strongly relevant: OSHA-KR Art 38 (site safety
      measures; fall/electrical detail in OSHSR Ch.6 — 추락 §42, 감전 §301-323)
      for cell-stack assembly.
    verification:
      verified_via:
        - legalize-kr  # DSSMA, CCA, ESCA Arts confirmed via parse_law_structure
      unverified: []

  # =========================================================================
  biotech:
    display_name: Biotech (Life-science R&D and biomanufacturing)
    has_dedicated_statute_file: true
    primary_statute:
      name_ko: 생명윤리 및 안전에 관한 법률
      abbreviation: BSA (Bioethics and Safety Act)
      statute_file: Bioethics-and-Safety-Act.yaml
      key_articles:
        - article: "13"
