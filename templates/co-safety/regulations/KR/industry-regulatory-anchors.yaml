# Industry Regulatory Anchor Table (Action Item A-03, Phase 0)
###############################################################################
source_verification:
  method: manual-curation
  checked_at: "2026-08-26"
jurisdiction: KR
regulator: MOEL (고용노동부) / ME (환경부) / NFDS (소방청) / industry-specific
framework: Industry-Regulatory-Anchors
title_ko: 산업별 규제 앵커 표 (Industry Regulatory Anchor Table)
title_en: Industry Regulatory Anchor Table
description: |
  Composite anchor table mapping each of the 12 Tier-1 industries to its
  primary regulatory statute(s), adjacent laws, SAPA anchor, and OSHA-KR
  anchor. Consumed by the scaffold generator (Task A-01) to auto-fill
  `legal_basis` arrays for new industry domains.
# Purpose:
#   Per-industry regulatory anchor table for the 12 Tier-1 industries in the
#   industry-maturity program. Each anchor provides >=3 legal sources
#   (primary industry statute + adjacent/relevant law + SAPA) so the scaffold
#   generator (Task A-01) can auto-fill `legal_basis` templates for new domains.
#
# Verification protocol (this file):
#   - Article numbers were VERIFY-LIVE via the kr_safety and legalize_kr MCP
#     tools wherever the statute was indexed. This project has a documented
#     history of mis-citations (see memory/findings/compliance-gap-2026-07-05),
#     so memory-based citations are NOT acceptable.
#   - Each industry's `verification` block records HOW each article was
#     verified: `legalize-kr` (parse_law_structure full text),
#     `kr-safety-catalog` (search_osha_regulations catalog match),
#     or `statute-file-only` (regulations/KR/<statute>.yaml sourced from
#     mcp-kr-legislation in a prior pass but NOT re-verifiable via legalize_kr
#     this session because the statute is not indexed under the queried name).
#   - Articles that could NOT be verified live are marked `[UNVERIFIED]` in
#     the topic text and listed under the industry's `unverified` array.
#
# Universal anchors (apply to every industry):
#   osha_kr_anchor  : 산업안전보건법 (OSHA-KR) Art 36 + Art 57
#   sapa            : 중대재해처벌법 (SAPA) Art 4 + Art 5
# SAPA is industry-agnostic: the same 16-article structure (Arts 1-16) applies
# to every industry. Art 4 = universal safety-assurance obligation; Art 5 =
# outsourcing/contract safety obligation (most relevant for logistics,
# shipbuilding, construction-style industries with heavy subcontracting).
#
# Glossary discrepancies discovered during verification:
#   - ESCA (전기안전관리법): glossary says Art 16/29, but live law shows
#     Art 16 = 전기재해 예방을 위한 안전조치, Art 22 = 전기안전관리자 선임,
#     Art 29 = 전기안전관리업무 실태조사. The glossary's "Art 29 safety
#     manager" topic is WRONG; the correct article is Art 22. Flagged for
#     glossary reconciliation. This file cites the VERIFIED-correct articles.
#   - CCA (화학물질관리법): glossary cites Art 20/23, but live law shows
#     Art 20 = 인체급성유해성물질 수입신고 (import notification, NOT safety
#     management), Art 23 = 화학사고예방관리계획서 (Chemical Accident
#     Prevention Plan), Art 24 = 취급시설 배치/설치/관리 기준. This file
#     cites Art 23 + Art 24 as the chemical-safety anchors (not Art 20).
#   - DSSMA (위험물안전관리법): glossary cites Art 5/27 — both correct
#     (storage restrictions + emergency response), but the primary
#     safety-manager article is Art 15 (위험물안전관리자). This file adds
#     Art 15 + Art 17 (예방규정) alongside the glossary articles.
#
# Consume (Task A-01 scaffold generator):
#   For each industry domain scaffold, copy `primary_statute.key_articles`,
#   every `adjacent_laws[].key_articles`, plus `sapa` and `osha_kr_anchor`
#   into the domain's `legal_basis` array. This guarantees the DEFAULT_MIN
#   LEGAL_BASIS = 3 invariant (scripts/domain-config.ts) is satisfied.
###############################################################################

metadata:
  file: regulations/KR/industry-regulatory-anchors.yaml
  task: A-03-phase0
  generated_for: industry-maturity-program
  tier_1_industries: 12
  last_verified: "2026-08-07"
  verification_tools:
    - kr_safety.search_osha_regulations
    - legalize_kr.parse_law_structure
    - legalize_kr.compare_versions
  min_legal_basis: 3  # scripts/domain-config.ts DEFAULT_MIN_LEGAL_BASIS

# ---------------------------------------------------------------------------
# Universal anchors (referenced by every industry below via YAML alias)
# ---------------------------------------------------------------------------
universal_anchors:
  osha_kr:
    statute_file: OSHA-KR.yaml
    name_ko: 산업안전보건법
    abbreviation: OSHA-KR
    key_articles:
      - article: "36"
        topic_ko: 위험성평가 (risk assessment — mandatory for all workplaces)
        topic_en: Risk assessment
      - article: "57"
        topic_ko: 산업재해 조사·기록 (incident investigation and recording)
        topic_en: Incident investigation and recording
    verification:
      verified_via: legalize-kr
      note: Full OSHA-KR structure (Arts 13-243) verified in prior session; stable.

  sapa:
    statute_file: SAPA.yaml
    name_ko: 중대재해처벌법
    abbreviation: SAPA
    key_articles:
      - article: "4"
        topic_ko: 사업주의 안전보건 확보 의무 (universal safety-assurance obligation)
        topic_en: Universal safety-assurance obligation
      - article: "5"
        topic_ko: 도급·하도급 사업주의 안전보건 확보 의무 (outsourcing/contract safety)
        topic_en: Outsourcing and contract safety obligation
      - article: "6"
        topic_ko: 벌칙 (punishment — imprisonment for serious injury/death)
        topic_en: Punishment
      - article: "7"
        topic_ko: 법인 등의 벌금 (dual liability — corporate fine)
        topic_en: Corporate dual liability fine
    verification:
      verified_via: legalize-kr
      note: |
        SAPA structure verified stable via compare_versions (0 changes since
        2024-01-01). Industry-agnostic — same 16-article structure applies to
        all industries. Art 4 is the universal anchor for every industry.

