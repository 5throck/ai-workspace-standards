name: Weekly Health Check

# Implements CONSTITUTION.md §9 Weekly Health Check (PM, every Friday):
# lifecycle audits + deprecated-item review. Runs on a schedule and can also
# be triggered manually for on-demand verification.
on:
  schedule:
    - cron: '0 0 * * 5' # Every Friday at 00:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned to match test.yml and the locally verified Bun version.
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Agent lifecycle audit
        run: bun run agent-lifecycle-audit

      - name: Skill lifecycle audit
        run: bun run skill-lifecycle-audit

      - name: Skill dependency analysis (full health report)
        run: bun scripts/skill-dependency-analysis.ts --report

      - name: CI failure triage owner
        run: echo "Weekly health-check failures are triaged by PM within 1 business day; issues are labeled ci-failure when issue creation succeeds."

      - name: Verify scripts registry
        run: bun run verify-scripts

      - name: Validate templates (variant manifests + country profiles)
        run: bun run validate-templates

      - name: Secret scanning - gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Secret scanning - full history deep audit (no path allowlists)
        # T-20260912-021: the gitleaks-action step above runs with the root
        # .gitleaks.toml, whose path allowlists (CHANGELOG, test-file patterns,
        # local-only paths) exist to keep per-PR scanning fast and quiet. That
        # also means a secret landing in an allowlisted tracked path is invisible
        # to every PR scan. This weekly deep audit applies the SAME default rule
        # set WITHOUT the path allowlists (.github/gitleaks-full.toml — verified
        # false positives only in ITS allowlist) across the FULL git history
        # (fetch-depth: 0 in the checkout step). Pinned install mirrors the
        # hook-secret-gates job in test.yml.
        shell: bash
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version
          gitleaks detect --config .github/gitleaks-full.toml --redact --verbose

      - name: Secret scanning - Projects/ working tree (local hygiene report)
        # Projects/ is intentionally untracked (user engagement repos — outside
        # this repo's audit scope per .gitleaks.toml), so hosted runners never
        # have it and the full-history gate above cannot see it. When it IS
        # present (local/self-hosted runs), surface its findings loudly but do
        # NOT gate: engagement repos are out of audit scope by policy, and
        # pre-existing engagement-local findings must neither silently flip this
        # workflow red nor be blanket-allowlisted (verified false positives only
        # — see .github/gitleaks-full.toml).
        shell: bash
        run: |
          if [ ! -d "Projects" ]; then
            echo "Projects/ not present (untracked local dir) — hygiene report skipped."
            exit 0
          fi
          GITLEAKS_VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          set -o pipefail
          LOG=$(mktemp)
          if gitleaks detect --no-git --source Projects --config .github/gitleaks-full.toml --redact --verbose 2>&1 | tee "$LOG"; then
            echo "Projects/ working tree: no secret-shaped findings."
          else
            echo "----------------------------------------------------------------"
            echo "⚠️  Projects/ working tree carries secret-shaped findings (list above)."
            echo "    Out of repo audit scope by policy (.gitleaks.toml): triage LOCALLY in the"
            echo "    engagement repos. Do NOT blanket-allowlist them here —"
            echo "    .github/gitleaks-full.toml admits verified false positives only."
            echo "----------------------------------------------------------------"
          fi

      - name: Security audit - dependency vulnerabilities
        shell: bash
        run: |
          # No `|| true` here: a bun audit command-level failure (network/registry
          # outage) must fail the step loudly, not silently pass the gate.
          if ! audit_output=$(bun audit 2>&1); then
            echo "$audit_output"
            echo "ERROR: bun audit command failed (infrastructure/registry error)."
            exit 1
          fi
          echo "$audit_output"
          if echo "$audit_output" | grep -qE '[1-9][0-9]* (high|critical)'; then
            echo "WARNING: High or critical vulnerabilities found. See audit output above."
            exit 1
          fi
          echo "Security check passed (no high/critical vulnerabilities)."

      # A silently failing scheduled health check defeats its purpose — surface
      # failures as a GitHub issue so they are visible without checking Actions.
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          created=$(gh issue create \
            --title "Weekly Health Check failed — $(date -u +%Y-%m-%d)" \
            --body "Owner: PM. The scheduled weekly health check run failed and requires triage within 1 business day. See the full log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "ci-failure" 2>&1) || created=""
          if [ -z "$created" ]; then
            echo "Issue creation returned nothing (label may not exist) — retrying without label"
            gh issue create \
              --title "Weekly Health Check failed — $(date -u +%Y-%m-%d)" \
              --body "Owner: PM. The scheduled weekly health check run failed and requires triage within 1 business day. See the full log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
          else
            echo "Issue created: $created"
          fi
