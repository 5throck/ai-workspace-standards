name: Weekly Health Check

# Implements CONSTITUTION.md §9 Weekly Health Check (PM, every Friday):
# lifecycle audits + deprecated-item review. Runs on a schedule and can also
# be triggered manually for on-demand verification.
on:
  schedule:
    - cron: '0 0 * * 5' # Every Friday at 00:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned to match test.yml and the locally verified Bun version.
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install

      - name: Agent lifecycle audit
        run: bun run agent-lifecycle-audit

      - name: Skill lifecycle audit
        run: bun run skill-lifecycle-audit

      - name: Skill dependency analysis (full health report)
        run: bun scripts/skill-dependency-analysis.ts --report

      - name: Verify scripts registry
        run: bun run verify-scripts

      - name: Validate templates (variant manifests + country profiles)
        run: bun run validate-templates

      - name: Secret scanning - gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Security audit - dependency vulnerabilities
        shell: bash
        run: |
          audit_output=$(bun audit 2>&1) || true
          echo "$audit_output"
          if echo "$audit_output" | grep -qE '[1-9][0-9]* (high|critical)'; then
            echo "WARNING: High or critical vulnerabilities found. See audit output above."
            exit 1
          fi
          echo "Security check passed (no high/critical vulnerabilities)."
