name: Edu Sync

# Weekly: detect changes in this workspace since the last synced commit and
# update the two public education repositories with relevant content via PRs.
# Baseline (last synced SHA) lives in a rolling "Edu Sync — baseline" issue —
# no commits to this repo are needed for state.
#
# Requires repository secret EDU_SYNC_PAT: a fine-grained PAT with
# Contents: read/write on 5throck/intro-to-ai-harness and
# 5throck/multi-agent-harness-handbook. Without it the agent step skips.

on:
  schedule:
    - cron: "0 19 * * 5" # Saturday 04:00 KST (Friday 19:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: edu-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Resolve baseline SHA
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          gh label create "edu-sync-baseline" -R "$REPO" \
            --description "Edu Sync last-synced SHA baseline" --color 0E8A16 2>/dev/null || true
          ISSUE=$(gh issue list -R "$REPO" --label "edu-sync-baseline" \
            --state all --limit 1 --json number --jq '.[0].number // ""')
          if [ -z "$ISSUE" ]; then
            SHA=$(git rev-parse HEAD)
            gh issue create -R "$REPO" --label "edu-sync-baseline" \
              --title "Edu Sync — baseline" \
              --body "Last synced SHA: $SHA"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          else
            SHA=$(gh issue view "$ISSUE" -R "$REPO" --json body --jq '.body' \
              | grep -oE '[0-9a-f]{40}' | head -1)
            [ -z "$SHA" ] && SHA=$(git rev-parse HEAD)
            echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          fi
          echo "baseline=$SHA"

      - name: Collect upstream changes
        id: changes
        run: |
          BASE="${{ steps.baseline.outputs.sha }}"
          git log --oneline "$BASE..HEAD" > /tmp/commits.txt || true
          git diff --stat "$BASE..HEAD" > /tmp/diffstat.txt || true
          git diff "$BASE..HEAD" -- docs/ skills/ AGENTS.md CONSTITUTION.md CHANGELOG.md scripts/SCRIPTS.md > /tmp/relevant.diff || true
          wc -l /tmp/commits.txt /tmp/relevant.diff
          lines=$(wc -l < /tmp/relevant.diff)
          echo "lines=$lines" >> "$GITHUB_OUTPUT"

      - name: Guard — nothing to do
        if: steps.changes.outputs.lines == '0'
        run: echo "No upstream changes since last sync."; exit 0

      - name: Check EDU_SYNC_PAT
        id: pat
        env:
          EDU_SYNC_PAT: ${{ secrets.EDU_SYNC_PAT }}
        run: |
          if [ -n "$EDU_SYNC_PAT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "EDU_SYNC_PAT secret not set — skipping education updates"
          fi

      - name: Clone education repositories
        if: steps.changes.outputs.lines != '0' && steps.pat.outputs.present == 'true'
        env:
          EDU_SYNC_PAT: ${{ secrets.EDU_SYNC_PAT }}
        run: |
          # Clone with CLEAN URLs — the PAT must never appear in a clone URL,
          # because `git clone https://x-access-token:<PAT>@...` persists the
          # token in the cloned repo's .git/config, where the sync agent (which
          # has Bash) could read it. Authentication instead goes through a
          # global credential helper that resolves the token from the
          # EDU_SYNC_PAT environment variable at each git invocation, so no
          # secret is written to any config file or to disk.
          git config --global credential.helper \
            '!f() { printf "username=x-access-token\npassword=%s\n" "$EDU_SYNC_PAT"; }; f'
          git clone --depth 1 https://github.com/5throck/intro-to-ai-harness.git /tmp/intro-to-ai-harness
          git clone --depth 1 https://github.com/5throck/multi-agent-harness-handbook.git /tmp/multi-agent-harness-handbook
          # Fail loudly if a token ever leaks into a cloned repo's config.
          if grep -r "x-access-token" /tmp/intro-to-ai-harness/.git/config /tmp/multi-agent-harness-handbook/.git/config; then
            echo "ERROR: credential material found in cloned repo config"
            exit 1
          fi

      - name: Revoke credentials for agent phase
        if: steps.changes.outputs.lines != '0' && steps.pat.outputs.present == 'true'
        run: |
          # T-20260912-026: strip the global credential helper the clone step
          # installed, so the AI agent phase provably has no route to the
          # education repos. The publisher step re-installs it.
          git config --global --unset credential.helper 2>/dev/null || true
          echo "credential.helper: $(git config --global credential.helper || echo '(none)')"

      - name: Update education content (patch generation only — unprivileged)
        id: edu
        if: steps.changes.outputs.lines != '0' && steps.pat.outputs.present == 'true'
        env:
          # T-20260912-026: the agent is deliberately run WITHOUT the PAT and
          # WITHOUT any GitHub write token. It edits local clones, commits to
          # local branches, and exports format-patch bundles — it cannot push
          # or open PRs. A separate deterministic step does the privileged
          # publish (see "Publish patches").
          ANTHROPIC_API_KEY: ${{ secrets.ZAI_API_KEY || secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_API_KEY || '' }}
          ANTHROPIC_BASE_URL: ${{ vars.NIGHTLY_TICKETS_BASE_URL || 'https://api.z.ai/api/anthropic' }}
          ANTHROPIC_MODEL: ${{ vars.NIGHTLY_TICKETS_MODEL || '' }}
          API_TIMEOUT_MS: "3000000"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model ${{ vars.NIGHTLY_TICKETS_MODEL || 'glm-5.3' }}
            --allowed-tools "Bash,Read,Edit,Write,Glob,Grep"
          prompt: |
            You are the weekly education-content sync agent. This checkout is the
            ai-workspace-standards workspace (upstream). The two education
            repositories are cloned at /tmp/intro-to-ai-harness and
            /tmp/multi-agent-harness-handbook. Upstream changes since the last
            sync: /tmp/commits.txt (messages), /tmp/diffstat.txt (stats),
            /tmp/relevant.diff (patch of docs/skills/governance changes).

            TASK
            1. Read the upstream change list and identify changes RELEVANT to the
               educational narrative of each repo:
               - intro-to-ai-harness: practical guide to AI agents, Claude Code,
                 workspace standards (chapters under docs/ch01..ch12)
               - multi-agent-harness-handbook: multi-agent harness concepts
                 (docs/concepts, docs/guardrails, docs/enterprise, docs/faq,
                 docs/glossary, docs/capstone, docs/lecture-guide)
               Educationally relevant = concepts, workflows, validators,
               governance rules, new skills/agents, breaking changes that the
               books teach. NOT relevant: internal bookkeeping (memory logs,
               ticket bookkeeping, CI plumbing, version bumps without behavior).
            2. For each repo with relevant changes: make focused edits to the
               affected chapters/sections — keep each repo's existing tone,
               structure, and bilingual conventions (EN files primary; if a
               chapter has a _ko sibling, update it in kind; do not create new
               locales). Add a short "What's new (2026-09)" callout only where
               it fits naturally.
            3. For each repo you edited: create a branch
               edu-sync/<YYYY-MM-DD>, commit with a conventional message, then
               EXPORT your work as patch bundles — this run has NO push or PR
               credentials by design:
                 mkdir -p /tmp/edu-patches/<repo-name>
                 git format-patch <default-branch>..HEAD -o /tmp/edu-patches/<repo-name>/
               (e.g. <repo-name> is intro-to-ai-harness or
               multi-agent-harness-handbook). Do NOT push. Do NOT run gh. Do
               NOT attempt authentication — this environment has none for the
               education repos, and attempts are treated as violations.
            4. If a repo has no relevant changes, do not touch it.

            CONSTRAINTS: only files under docs/ may be modified (anything
            outside docs/ will cause the patch bundle to be REJECTED
            downstream); preserve each repo's LICENSE, CI, and i18n structure;
            no AI-generated filler text; quote real commands/paths from the
            upstream diff; keep edits minimal and accurate.

            MANDATORY REPORT (never skip): before finishing, write
            /tmp/edu-sync-report.md containing, per repo: (a) your relevance
            decision and reasoning, (b) files changed (or "none"), (c) patch
            bundle path and commit count (or exactly why no patches were
            exported). Any edits you make MUST be committed AND exported as
            patches — edited-but-unexported trees are treated as failures.

      - name: Publish patches (trusted, deterministic — no AI)
        id: publish
        if: steps.edu.outcome == 'success'
        env:
          EDU_SYNC_PAT: ${{ secrets.EDU_SYNC_PAT }}
          GH_TOKEN: ${{ secrets.EDU_SYNC_PAT }}
        run: |
          # T-20260912-026: the only step holding the PAT is this deterministic
          # shell (no AI agent runs here). It validates the agent's patch
          # bundles (docs/ paths only), applies them with `git am`, pushes the
          # branch, and opens the PR.
          set -e
          git config --global credential.helper \
            '!f() { printf "username=x-access-token\npassword=%s\n" "$EDU_SYNC_PAT"; }; f'
          shopt -s nullglob
          declare -A REPOS=(
            [intro-to-ai-harness]="/tmp/intro-to-ai-harness"
            [multi-agent-harness-handbook]="/tmp/multi-agent-harness-handbook"
          )
          DATE=$(date +%Y-%m-%d)
          any_published=0
          for name in intro-to-ai-harness multi-agent-harness-handbook; do
            dir="${REPOS[$name]}"
            patches=(/tmp/edu-patches/${name}/*.patch)
            if [ ${#patches[@]} -eq 0 ]; then
              echo "[$name] no patch bundle — nothing to publish"
              continue
            fi
            echo "[$name] ${#patches[@]} patch(es) to publish"
            cd "$dir"
            base=$(git rev-parse HEAD)
            branch="edu-sync/$DATE"
            git checkout -B "$branch"
            for p in "${patches[@]}"; do
              # Deterministic path allowlist: only docs/** may be touched.
              bad=$(git apply --numstat "$p" | awk '{print $3}' | grep -vE '^docs/' || true)
              if [ -n "$bad" ]; then
                echo "[$name] REJECTED: $p touches non-docs path(s): $bad"
                exit 1
              fi
              git am --keep-non-patch "$p"
            done
            # Belt-and-suspenders: re-verify the whole branch diff post-apply.
            bad=$(git diff --name-only "$base..HEAD" | grep -vE '^docs/' || true)
            if [ -n "$bad" ]; then
              echo "[$name] REJECTED post-apply: non-docs path(s): $bad"
              exit 1
            fi
            git push origin "$branch"
            subject=$(git log --format=%s -1)
            gh pr create -R "5throck/$name" --head "$branch" \
              --title "Edu sync $DATE: $subject" \
              --body "Automated education-content sync from ai-workspace-standards. Patch bundle: /tmp/edu-patches/$name (${#patches[@]} commit(s)). Applied deterministically by the trusted publisher step — the AI agent ran without credentials. Per-change mapping in /tmp/edu-sync-report.md (attached as run artifact)."
            echo "[$name] published branch $branch + PR"
            any_published=1
            cd "$RUNNER_WORKSPACE_DIRECTORY" 2>/dev/null || cd -
          done
          [ "$any_published" = "0" ] && echo "No patches published (agent reported no relevant changes)."
          exit 0

      - name: Upload sync forensics
        if: always()
        run: |
          {
            echo "=== intro-to-ai-harness: last commits ==="
            git -C /tmp/intro-to-ai-harness log --oneline -5 2>/dev/null || echo "(no clone)"
            echo "=== intro-to-ai-harness: status ==="
            git -C /tmp/intro-to-ai-harness status --short 2>/dev/null || true
            echo "=== multi-agent-harness-handbook: last commits ==="
            git -C /tmp/multi-agent-harness-handbook log --oneline -5 2>/dev/null || echo "(no clone)"
            echo "=== multi-agent-harness-handbook: status ==="
            git -C /tmp/multi-agent-harness-handbook status --short 2>/dev/null || true
            echo "=== report ==="
            cat /tmp/edu-sync-report.md 2>/dev/null > edu-sync-report.md || echo "(agent did not write the mandatory report)" > edu-sync-report.md
            cat edu-sync-report.md
            echo "=== relevant.diff (first 200 lines) ==="
            head -200 /tmp/relevant.diff 2>/dev/null
          } > edu-forensics.txt
          cat edu-forensics.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: edu-sync-forensics
          path: edu-forensics.txt

      - name: Update baseline
        # Advance the baseline only when the sync actually succeeded — a failed
        # agent run must re-process the same range next week. The publisher
        # step must also succeed: if patch application/publish fails, the same
        # range is re-processed (and re-generated) next week.
        if: steps.edu.outcome == 'success' && steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          ISSUE="${{ steps.baseline.outputs.issue }}"
          SHA=$(git rev-parse HEAD)
          if [ -n "$ISSUE" ]; then
            BODY=$(gh issue view "$ISSUE" -R "$REPO" --json body --jq '.body' | sed -E "s/[0-9a-f]{40}/$SHA/")
            gh issue edit "$ISSUE" -R "$REPO" --body "$BODY"
          else
            gh issue create -R "$REPO" --label "edu-sync-baseline" \
              --title "Edu Sync — baseline" --body "Last synced SHA: $SHA"
          fi
