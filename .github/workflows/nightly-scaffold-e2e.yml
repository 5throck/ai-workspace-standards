name: Nightly Scaffold E2E (all variants)

# T-20260921-018 (review M-21, validator-hardening): the PR CI (test.yml) runs the
# new-project E2E harness against a single variant (co-develop) only — country
# flows (`--country`, region-neutral prune, ACTIVE.md), variant overlays, and
# platform profiles are exercised only when a human passes --all-variants. This
# nightly job runs the full per-variant loop so per-variant scaffold regressions
# are caught within a day instead of at the next manual smoke test.
on:
  schedule:
    - cron: '30 1 * * *' # Every day at 01:30 UTC (independent schedule — the GitHub nightly ticket batch is retired, ADR-0082; see nightly-tickets.yml)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scaffold-e2e-all-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned to match test.yml and the locally verified Bun version.
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run new-project E2E across every variant (single-variant harness loop)
        run: bun scripts/test-new-project.ts nightly-all-variants --all-variants --yes

      - name: Validate template integrity after scaffold runs
        run: bun scripts/validate-templates.ts
