name: Test Suite

on:
  push:
    branches: [ main, 'pr/**' ]
  pull_request:
    branches: [ main, 'pr/**' ]
  workflow_dispatch:

permissions:
  contents: read

# Collapse redundant 3-OS matrix runs on rapid successive pushes to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Kept despite no setup-node step: the matrix value is part of the job
        # name and must match the branch-protection required check contexts
        # (`test (ubuntu-latest, 18.x)` etc.). Removing it silently blocks all
        # PR merges. See docs/designs/2026-08-30-project-review-remediation-design.md.
        node-version: [18.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks-action diffs the head commit against its immediate parent;
          # the default shallow (depth-1) clone has no parent to diff against,
          # which fails with "ambiguous argument ...^..." on pull_request events.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned to the version verified locally; `latest` risks silent breakage
          # on upstream Bun releases.
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Security audit - dependency vulnerabilities
        shell: bash
        run: |
          # No `|| true` here: a bun audit command-level failure (network/registry
          # outage) must fail the step loudly, not silently pass the gate.
          if ! audit_output=$(bun audit 2>&1); then
            echo "$audit_output"
            echo "ERROR: bun audit command failed (infrastructure/registry error)."
            exit 1
          fi
          echo "$audit_output"
          if echo "$audit_output" | grep -qE '[1-9][0-9]* (high|critical)'; then
            echo "ERROR: High or critical vulnerabilities found. See audit output above."
            exit 1
          fi
          echo "Security check passed (no high/critical vulnerabilities)."

      - name: Secret scanning - gitleaks
        # Docker-container action — Linux runners only, hence the ubuntu-only
        # condition below (this job's matrix also includes windows/macos).
        # PR-diff scan only (the action's default mode compares against the PR's
        # base ref); full-history secret scanning is a separate, heavier security
        # audit and is not covered here.
        if: matrix.os == 'ubuntu-latest'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard tracked .env
        # gitleaks' git-mode scans honor the .gitleaks.toml path allowlist,
        # which excludes \.env$ — a committed .env would be invisible to
        # secret scanning (T-20260910-015). Fail if any tracked file is a
        # bare .env; .env.sample / .env.example templates are allowed.
        shell: bash
        run: |
          if git ls-files -- '*.env' '**/.env' | grep -E '(^|/)\.env$'; then
            echo "ERROR: tracked .env file(s) found above. Untrack: git rm --cached <file>"
            exit 1
          fi
          echo "No tracked .env files."

      - name: Validate templates
        run: bun run validate-templates

      - name: Validate docs links
        # T-20260912-018: dev-sync.ts runs validate-docs-links.ts as a blocking
        # /sync pre-flight, but CI never did — a PR with broken links could pass
        # required CI then block the next /sync. Mirror the exact invocation
        # dev-sync uses (docs/ root-level scan; no network — http(s) links are
        # skipped, only relative file links + anchors are verified). Ubuntu-only:
        # a pure markdown scan gains nothing from 3 OSes.
        if: matrix.os == 'ubuntu-latest'
        run: bun scripts/validate-docs-links.ts

      - name: Workspace audit
        if: matrix.os == 'ubuntu-latest'
        run: bun scripts/audit.ts

      - name: TypeScript typecheck (regression gate vs baseline)
        # T-20260910-012 (infrastructure only): ~2137 pre-existing errors are
        # absorbed by scripts/helpers/typecheck-baseline.json; this step fails
        # only on regression. Not yet in the dev-sync battery (post-triage).
        if: matrix.os == 'ubuntu-latest'
        run: bun scripts/typecheck.ts

      - name: Run integration tests
        # Full-suite gate lives here since T-20260910-025 scoped the local
        # pre-push hook down to changed-path tests only.
        run: bun run test

      - name: Hook reliability tests
        run: bun test tests/unit/hook-gateguard.test.ts tests/unit/hook-post-write-lifecycle.test.ts

      - name: Run E2E scenario tests
        shell: bash
        run: |
          if [ -d "tests/scenarios" ] && [ "$(ls tests/scenarios/ 2>/dev/null)" ]; then
            bun run test:e2e
          else
            echo "::notice::E2E scenario tests skipped — no tests/scenarios/ directory or directory is empty"
          fi

      # T-20260912-008: these four audits previously ran sequentially inside ONE
      # pwsh step. PSNativeCommandUseErrorActionPreference defaults to false in
      # pwsh 7.4, so the step's exit code was only the LAST command's — up to 3
      # of 4 audits could fail while the step (and CI) went green. Split into
      # independent steps (mirrors weekly-health-check.yml) so each audit's
      # non-zero exit fails the job on its own. Default shell per OS: bash -e
      # on linux/macos; pwsh on windows, where GitHub appends a
      # `exit $LASTEXITCODE` epilogue — both propagate a single command's
      # failure correctly.
      - name: Tier 3 Auditor - Agent lifecycle audit
        run: bun run agent-lifecycle-audit

      - name: Tier 3 Auditor - Skill lifecycle audit
        run: bun run skill-lifecycle-audit

      - name: Tier 3 Auditor - README lifecycle audit
        run: bun run readme-lifecycle-audit

      - name: Tier 3 Auditor - Verify scripts registry
        run: bun run verify-scripts

      - name: L0→L1 drift check (propagation-map integrity)
        shell: bash
        run: |
          # Machine drift contract (T-20260912-016 follow-on): --check-drift
          # --json has stable exit codes — 0 = clean, 1 = only tolerated
          # gemini-settings drift, 2 = unexpected drift. This replaces the old
          # fragile prose matching ("differ|missing|extra") on human output.
          # gemini-settings has known intentional L2 variant overrides
          # (PostToolUse lifecycle hooks) that will always differ from L1;
          # exactly that domain and nothing broader is tolerated.
          set -o pipefail
          DRIFT_EXIT=0
          DRIFT_OUTPUT=$(bun scripts/propagate-to-templates.ts --check-drift --json 2>&1) || DRIFT_EXIT=$?
          echo "$DRIFT_OUTPUT"

          # Human-readable annotation parsed from the JSON summary (bun is
          # guaranteed by setup-bun; jq is not preinstalled on all runners).
          # Read from stdin — no temp-file paths, safe on the windows runner's
          # Git Bash too. Exit code: 0 = valid contract with no unexpected
          # drift, 1 = valid contract WITH unexpected drift, 2 = output is not
          # the machine contract (e.g. a hard crash / error stack).
          CONTRACT=0
          printf '%s' "$DRIFT_OUTPUT" | bun -e '
            const chunks = [];
            process.stdin.on("data", (d) => chunks.push(d));
            process.stdin.on("end", () => {
              const raw = Buffer.concat(chunks).toString("utf8");
              const start = raw.indexOf("{");
              try {
                const summary = JSON.parse(raw.slice(start)).summary;
                if (!summary || typeof summary.unexpectedDrift !== "number") throw new Error("no summary");
                console.log(`Drift summary: total=${summary.total} inSync=${summary.inSync} tolerated-gemini-settings=${summary.toleratedDrift} unexpected=${summary.unexpectedDrift}`);
                process.exit(summary.unexpectedDrift === 0 ? 0 : 1);
              } catch {
                process.exit(2);
              }
            });
          ' || CONTRACT=$?

          if [ "$DRIFT_EXIT" -eq 0 ]; then
            echo "L0→L1 propagation map is clean."
            exit 0
          fi
          if [ "$DRIFT_EXIT" -eq 1 ] && [ "$CONTRACT" -eq 0 ]; then
            # Tolerated drift: the contract check verified unexpectedDrift == 0,
            # i.e. gemini-settings only. A hard crash (e.g. malformed
            # propagation-map.json) also surfaces as Bun-runtime exit 1, but
            # then the output is a stack trace, fails the CONTRACT check
            # (exit 2), and is handled by the error branches below instead.
            echo "Only tolerated gemini-settings drift — passing per policy."
            exit 0
          fi
          if [ "$DRIFT_EXIT" -eq 1 ]; then
            echo "ERROR: --check-drift exited 1 without a verified tolerated-only (gemini-settings) JSON report — hard failure or unexpected drift masquerading as exit 1."
            exit 1
          fi
          echo "ERROR: unexpected L0→L1 drift in a non-gemini-settings domain, or hard failure (exit $DRIFT_EXIT)."
          exit "$DRIFT_EXIT"

  # T-20260910-020: the local secret gates (.githooks/pre-push,
  # .githooks/pre-rebase) silently degrade when gitleaks is not installed —
  # regex fallback / skip — so a broken gate ships unnoticed (the pre-push
  # --log-opts bug did). This job installs a pinned gitleaks binary and
  # exercises both hooks end-to-end in throwaway repos: a clean commit must
  # pass, a commit with a fake AWS key must be blocked. Hermetic (temp dir,
  # no network beyond the gitleaks download).
  hook-secret-gates:
    name: Hook secret gates (gitleaks smoke test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Keep in sync with the test job above.
          bun-version: 1.4.0

      - name: Install gitleaks (pinned)
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Smoke test pre-push hook
        shell: bash
        run: |
          set -euo pipefail
          SMOKE=$(mktemp -d)
          git init -q --bare "$SMOKE/origin.git"
          git clone -q "$SMOKE/origin.git" "$SMOKE/work"
          cd "$SMOKE/work"
          git config user.email ci@example.com
          git config user.name "CI Hook Smoke Test"
          # SYNC_ACTIVE=1 is the only sanctioned push path (the /sync
          # pipeline): pre-push.ts then skips the dev-sync audit/tests and
          # this smoke test isolates the gitleaks gate.
          export SYNC_ACTIVE=1

          # Make both commits BEFORE wiring core.hooksPath — the workspace
          # pre-commit gate is exercised elsewhere; this job tests only the
          # push gate.
          git checkout -q -b feature/clean
          echo "clean" > clean.txt
          git add clean.txt
          git commit -qm "clean commit"
          git checkout -q -b feature/leak
          # Dummy AWS key in the AKIA + [0-9A-Z]{16} format. Deliberately NOT
          # the canonical AWS docs example key — scanner allowlists commonly
          # exclude that exact string. The literal is split
          # across two shell words and concatenated at runtime so this workflow
          # file itself carries no key-shaped string (workspace regex scanner
          # has no inline-allowlist mechanism).
          FAKE_KEY_PARTS='AKIA UY8J3KM2Q9XZLT4R'
          echo "aws_access_key_id = $(echo "$FAKE_KEY_PARTS" | tr -d ' ')" > leak.txt
          git add leak.txt
          git commit -qm "add credentials"

          # .githooks/pre-push runs `bun run scripts/hooks/pre-push.ts`
          # relative to the pushed repo, so expose the checkout's scripts/
          # at that path (symlink keeps the throwaway repo hermetic).
          ln -s "$GITHUB_WORKSPACE/scripts" scripts
          git config core.hooksPath "$GITHUB_WORKSPACE/.githooks"

          git checkout -q feature/clean
          git push -q origin feature/clean
          echo "pre-push: clean commit passed (gitleaks installed)"

          git checkout -q feature/leak
          if git push origin feature/leak >"$SMOKE/push.log" 2>&1; then
            echo "ERROR: pre-push hook did not block a commit containing a fake AWS key"
            exit 1
          fi
          grep -q "Secret scan failed" "$SMOKE/push.log"
          echo "pre-push: fake-secret commit blocked"

      - name: Smoke test pre-rebase hook
        shell: bash
        run: |
          set -euo pipefail
          SMOKE=$(mktemp -d)
          git init -q -b main "$SMOKE/repo"
          cd "$SMOKE/repo"
          git config user.email ci@example.com
          git config user.name "CI Hook Smoke Test"
          echo "base" > base.txt
          git add base.txt
          git commit -qm "base commit"

          # Make both commits BEFORE wiring core.hooksPath — the workspace
          # pre-commit gate is exercised elsewhere; this job tests only the
          # rebase gate.
          git checkout -q -b feature/clean
          echo "clean" > clean.txt
          git add clean.txt
          git commit -qm "clean commit"
          git checkout -q main
          git checkout -q -b feature/leak
          FAKE_KEY_PARTS='AKIA UY8J3KM2Q9XZLT4R'
          echo "aws_access_key_id = $(echo "$FAKE_KEY_PARTS" | tr -d ' ')" > leak.txt
          git add leak.txt
          git commit -qm "add credentials"
          # Advance main so a rebase actually has commits to replay — when the
          # branch is strictly ahead of upstream, `git rebase` is a no-op
          # ("Current branch is up to date") and the pre-rebase hook never
          # fires.
          git checkout -q main
          git commit -q --allow-empty -m "advance main"

          git config core.hooksPath "$GITHUB_WORKSPACE/.githooks"

          # Clean branch: rebase must pass (hook exits 0)
          git checkout -q feature/clean
          git rebase main
          echo "pre-rebase: clean rebase passed (gitleaks installed)"

          # Fake-secret branch: rebase must be blocked (hook exits non-zero)
          git checkout -q feature/leak
          if git rebase main >"$SMOKE/rebase.log" 2>&1; then
            echo "ERROR: pre-rebase hook did not block a commit containing a fake AWS key"
            exit 1
          fi
          grep -qi "secret" "$SMOKE/rebase.log"
          echo "pre-rebase: fake-secret rebase blocked"
