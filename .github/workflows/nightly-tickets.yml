name: Nightly Governance Tickets

# Ticket-driven nightly batch runner (project-resync / §3.7.5 companion).
# Picks ready `kind: manual` governance tickets, implements the mechanically
# actionable ones, and opens PRs — never merges. Human review happens on the
# opened PRs the next morning.
#
# Credential auto-detection (step "Resolve credentials"):
#   1. ANTHROPIC_API_KEY  — direct Anthropic API
#   2. ZAI_API_KEY        — z.ai GLM via the Anthropic-compatible endpoint
#                           (ANTHROPIC_BASE_URL=https://api.z.ai/api/anthropic)
# If neither secret is set, the Claude step is skipped cleanly.

on:
  schedule:
    - cron: "30 17 * * *" # 02:30 KST — staggered after the local ZCode runner (02:00 KST); --ready excludes tickets it already moved out of backlog/waiting
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-tickets
  cancel-in-progress: false

jobs:
  # Diagnostic: probe the z.ai Anthropic-compatible endpoint directly (no agent
  # layer) to isolate auth/model/endpoint issues from claude-code-action hangs.
  # Runs only on manual dispatch.
  api-probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe z.ai endpoint with candidate models
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          BASE="${{ vars.NIGHTLY_TICKETS_BASE_URL || 'https://api.z.ai/api/anthropic' }}"
          for model in glm-5.3 glm-5.3-flash glm-4.7 "$NIGHTLY_TICKETS_MODEL"; do
            [ -z "$model" ] && continue
            code=$(curl -s --max-time 60 -o /tmp/resp.json -w "%{http_code}" \
              "$BASE/v1/messages" \
              -H "x-api-key: $ZAI_API_KEY" \
              -H "anthropic-version: 2023-06-01" \
              -H "content-type: application/json" \
              -d "{\"model\":\"$model\",\"max_tokens\":8,\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}")
            echo "model=$model http=$code body=$(head -c 200 /tmp/resp.json)"
          done
          # Also test Bearer auth style (ANTHROPIC_AUTH_TOKEN equivalent)
          code=$(curl -s --max-time 60 -o /tmp/resp2.json -w "%{http_code}" \
            "$BASE/v1/messages" \
            -H "Authorization: Bearer $ZAI_API_KEY" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d '{"model":"glm-5.3","max_tokens":8,"messages":[{"role":"user","content":"hi"}]}')
          echo "bearer-auth glm-5.3 http=$code body=$(head -c 200 /tmp/resp2.json)"

  tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    permissions:
      contents: write # push the pr/* branch (dev-sync)
      pull-requests: write # open the PR
      issues: read # read ticket refs (issues are not modified)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: List ready governance tickets
        id: ready
        run: |
          bun scripts/ticket.ts list --ready --kind manual | tee ready-tickets.txt
          count=$(grep -c 'T-' ready-tickets.txt || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Resolve credentials (Anthropic direct or z.ai GLM)
        id: creds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "provider=anthropic" >> "$GITHUB_OUTPUT"
            echo "using provider: anthropic (direct)"
          elif [ -n "$ZAI_API_KEY" ]; then
            echo "provider=zai" >> "$GITHUB_OUTPUT"
            echo "using provider: z.ai GLM (Anthropic-compatible endpoint)"
          else
            echo "provider=none" >> "$GITHUB_OUTPUT"
            echo "no ANTHROPIC_API_KEY / ZAI_API_KEY secret set — skipping ticket processing"
          fi

      - name: Process tickets (PR-only batch)
        if: steps.ready.outputs.count != '0' && steps.creds.outputs.provider != 'none'
        uses: anthropics/claude-code-action@5ccc3a35a6367cdb8e6fbd0728287467540ecfe2 # v1.0.219
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Anthropic-direct mode: x-api-key auth. z.ai mode: Bearer auth via
          # ANTHROPIC_AUTH_TOKEN + the Anthropic-compatible base URL (the key is
          # also set as ANTHROPIC_API_KEY so the CLI preflight sees a credential).
          ANTHROPIC_API_KEY: ${{ steps.creds.outputs.provider == 'zai' && secrets.ZAI_API_KEY || secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ steps.creds.outputs.provider == 'zai' && secrets.ZAI_API_KEY || '' }}
          ANTHROPIC_BASE_URL: ${{ vars.NIGHTLY_TICKETS_BASE_URL || 'https://api.z.ai/api/anthropic' }}
          ANTHROPIC_MODEL: ${{ vars.NIGHTLY_TICKETS_MODEL || '' }}
          API_TIMEOUT_MS: "3000000"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # claude-code-action v1 inputs: prompt (direct run), claude_args for
          # CLI passthrough. timeout is bounded by the job-level timeout-minutes.
          claude_args: >-
            --model ${{ vars.NIGHTLY_TICKETS_MODEL }}
            --allowed-tools "Bash(bun:*)" "Bash(git:*)" "Bash(gh pr:*)" "Bash(gh api:*)" "Bash(ls:*)" "Bash(cat:*)" "Bash(diff:*)" "Bash(grep:*)" "Bash(cp:*)" "Bash(mkdir:*)" "Read" "Edit" "Write" "Glob" "Grep"
          prompt: |
            You are the nightly governance-ticket batch runner for this workspace
            (single-repo checkout of ai-workspace-standards on ubuntu-latest).
            Process up to 10 ready governance tickets this run. The ready list is in
            ready-tickets.txt (from: bun scripts/ticket.ts list --ready --kind manual).

            SELECT (priority high first), only mechanically actionable tickets WITHOUT
            human judgment: documentation/record fixes, registry or manifest updates,
            adding validator checks, stale-link or stale-version repairs, dependency
            alignment, small scripted refactors. SKIP (leave in queue): anything needing
            a design decision, variant promotion, anything under Projects/, prune-removed
            operations, CI workflow permission changes, or secrets. If a ticket exceeds
            ~30 minutes of mechanical work, return it to the queue
            (bun scripts/ticket.ts move <id> waiting) and move on.

            Before executing each ticket, RE-CHECK its status is still backlog or waiting
            (bun scripts/ticket.ts list --ready --kind manual); skip if it moved.
            Then: bun scripts/ticket.ts move <id> waiting && bun scripts/ticket.ts move <id> running.

            IMPLEMENT following AGENTS.md governance. Batch related small tickets into
            ONE PR when they touch the same domain; reference every ticket ID in the PR body.

            VALIDATE before landing (all must pass):
              bun scripts/audit.ts
              bun scripts/validate-templates.ts
              bun scripts/verify-scripts.ts --verify
              bun test            (root tests only)

            LAND with the workspace pipeline (opens the PR; do NOT merge):
              bun scripts/dev-sync.ts --body-file <body-file> "<english conventional message>"
            On success: bun scripts/ticket.ts move <id> review for every ticket in the PR.
            On failure: bun scripts/ticket.ts move <id> failed --error "<short error>"
            then bun scripts/ticket.ts move <id> waiting; retry once at most, then move on.

            STOP after: 2 unexpected gate failures, 10 tickets, or ~2.5 hours.
            FINISH by writing a run summary to memory/<today>.md (tickets attempted,
            PR URLs, validation results, skipped-and-why) — English.

            Safety rules (non-negotiable): never bypass a sync/audit gate, never
            --no-verify, never touch .github/workflows or CI permissions, never push
            engagement/Projects/ content, never modify tickets/governance/*.yaml by hand
            outside ticket.ts, never merge PRs, never force-push.

      - name: Run summary
        if: always()
        run: |
          echo "ready tickets at start: $(grep -c 'T-' ready-tickets.txt 2>/dev/null || echo 0)"
          gh pr list --state open --limit 20 || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
