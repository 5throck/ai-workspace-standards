# gitleaks FULL-SCAN configuration — periodic deep audit only (weekly-health-check.yml)
#
# NOT the repo's default secret-scan config: `gitleaks detect` without --config
# picks up the root .gitleaks.toml, whose path allowlists exclude CHANGELOG and
# Projects/ (plus test-file patterns) for fast per-PR scanning. This config exists
# to bypass those path allowlists for the scheduled full-history audit, so a secret
# that crept into an allowlisted path is still caught periodically.
#
# Semantics:
#   * Default gitleaks rules apply ([extend] useDefault) — same rule set as the
#     root config, ONLY the path allowlists are dropped.
#   * Explicit allowlist entries below are limited to verified false positives,
#     each with a rationale. Do NOT add path-based blanket excludes here — that
#     would silently recreate the blind spot this scan exists to close.
#   * [[allowlists]] (plural) is REQUIRED: gitleaks ≥8.30 rejects mixing the
#     deprecated singular [allowlist] with [[allowlists]], and separate entries
#     keep each entry's conditions independent (never cross-combined).
#   * Used by: .github/workflows/weekly-health-check.yml ("Secret scanning -
#     full history (deep audit)" and the conditional "Projects/ working tree"
#     hygiene report) via --config. Local equivalent:
#     `gitleaks detect --config .github/gitleaks-full.toml --redact --verbose`

title = "ai-workspace-standards gitleaks FULL-SCAN config (no path allowlists)"

[extend]
useDefault = true

[[allowlists]]
description = "Verified false positives only — rationale required for every entry (see per-entry descriptions below)"
# 1. Historical security-validator unit-test fixture (commit 3845d1a6; file
#    deleted from HEAD since): obvious dummy values ('sk-1234567890',
#    'my-secret-value', truncated JWT header 'eyJhbGciOiJIUzI1NiIs...') used as
#    negative-test inputs for the validator's own secret-detection tests, in
#    both the L0 and the L1 mirror copy. Not real credentials. Commit-scoped
#    (not path-scoped) so a FUTURE commit reintroducing secret-shaped strings
#    in that path is still reported.
commits = [
  '3845d1a6393732fadac268c7f3a4b59a327c0dd8',
]

[[allowlists]]
description = "Historical CHANGELOG false positive from gitleaks triage prose (commit 3aca7460; generic-api-key captured an obviously fake test fixture password mentioned as documentation, not a credential). Commit-scoped so future CHANGELOG secret-shaped text still reports."
commits = [
  '3aca7460e244705b0ce7d517951db8dae9ebd353',
]

[[allowlists]]
description = "Placeholder value shapes used by .env.sample templates and documentation examples (same patterns as the root .gitleaks.toml — value-shape exclusions, not path exclusions)"
regexes = [
  '''your[_-]?(api[_-]?)?key[_-]?here''',
  '''your[_-]?secret[_-]?here''',
  '''replace[_-]?with[_-]?actual''',
  '''example[_\-.]com''',
  '''YOUR_API_KEY''',
  '''YOUR_TOKEN''',
  '''YOUR_SECRET''',
  # gitleaks:allow inline suppression marker
  '''gitleaks:allow''',
]

# ——— 2026-09-12 Projects/ working-tree triage (100 findings → 90 verified FPs).
# Real credentials in local project .env files deliberately REMAIN reported
# (10 findings) so local hygiene stays visible. ———

[[allowlists]]
description = "co-price UI navigation metadata values (generic-api-key captures the VALUE after groupKey/labelKey/descriptionKey — UI i18n grouping words of the shapes stage<number>_<name>, nav_<name>, scenario_<name>_desc) — verified 2026-09-12. Anchored to the exact value shapes so a real secret merely CONTAINING these substrings is still reported"
regexes = [
  '''^stage\d_[a-z_]+$''',
  '''^nav_[a-z_]+$''',
  '''^scenario_[a-z0-9_]+_desc$''',
]

[[allowlists]]
description = "ABAP structure-field reference in co-abap CHANGELOG history text (generic-api-key captures the VALUE ls_dm02l-entid after `iv_key =`; ls_ = ABAP local-structure prefix) — verified 2026-09-12. Anchored"
regexes = [
  '''^ls_[a-z0-9]+-[a-z0-9-]+$''',
]

[[allowlists]]
description = "ABAP source dumps under co-abap scratch/ (abapGit standalone exports) — hits are code identifiers (iv_key parameters, key1 field assignments), the file class is third-party source code — verified 2026-09-12"
paths = [
  '''Projects/co-abap/scratch/.*\.prog\.abap$''',
]

[[allowlists]]
description = "Project test fixtures — parity with the root .gitleaks.toml test-file exclusions (verified dummy password fixtures with obviously fake values). Accepted residual risk (same trade-off as the root config): a REAL secret committed under a test path is not flagged by this deep audit — verified 2026-09-12"
paths = [
  '''Projects/[^/]+/tests/.*$''',
  '''Projects/[^/]+/.*\.test\.(ts|tsx|js|mjs)$''',
]

[[allowlists]]
description = "Next.js build artifacts (.next/ at any project depth, incl. app/<app>/.next and turbopack caches) — previewModeId / server-action encryption ids regenerate per build, never hand-authored — verified 2026-09-12"
paths = [
  '''Projects/[^/]+/.*\.next/''',
]
