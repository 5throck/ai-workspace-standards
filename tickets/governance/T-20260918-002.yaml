result: >-
  Implemented per ADR-0081 Decision 2 /
  docs/designs/2026-09-18-delivery-pipeline-hardening-design.md §3.2.
  dev-sync.ts 1.14.1 → 1.15.0: (1) pre-flight main-drift detection after the
  language gate — best-effort fetch of origin/main, merge-base compare, loud
  warning naming the diverged CONSTITUTION §3.3 shared pipeline files when
  origin/main advanced past the branch's merge-base; --require-current-main
  escalates to abort; offline/no-remote skips silently. (2) --conclude-merge:
  the MERGE_HEAD fail-closed gate is satisfied only with the flag AND a fully
  resolved tree (zero --diff-filter=U entries via the new
  parseUnresolvedConflicts); the standard gate battery then runs and
  git commit -m produces the two-parent merge commit. Without the flag the
  gate is byte-identical to v1.14.1. Shared-file taxonomy + parsing live in
  the new import-safe scripts/helpers/merge-state.ts 1.0.0 (6 unit tests in
  tests/unit/merge-state.test.ts — pipeline itself is not import-safe).
  Workflow recovery note added to docs/constitution/03-pr-workflow.md §3.3.
  SCRIPTS.md L0/L1 rows + footers updated.
