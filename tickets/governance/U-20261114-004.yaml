  symptom: >-
    The two content-density disciplines for zen disagree, so decks authored to
    the creation-time rules fail the render-time gate. zen theme.json
    content_rules (read by the storyline agent at Stage 2) permits ~5 bullets
    per slide, while the merged pdf_layout_spec.json content_constraints for zen
    standard slides enforce max_bullets=4 / max_title_chars=28 /
    max_body_chars=100 (checked by scripts/co-deck/estimate-layout.ts --lint). A
    58-slide deck authored with <=5-bullet discipline (per storyline guidance)
    produced 76 layout-gate FAILs (bullets 5>4; body up to 458 chars > 100); the
    2026-11-consumer-goods-market-shift precedent deck also fails (2 violations)
    despite being delivered. Result: a deck can pass Stage 2 authoring and still
    be blocked at the render-time gate, forcing content cuts after the fact. One
    bound should win: either theme.json content_rules must match the
    pdf_layout_spec constraints, or the gate must consume theme.json's values.
