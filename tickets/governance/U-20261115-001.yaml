  local_workaround_diff: 'None applied yet — deck unaffected because the zen template''s native VideoSlide consumes videoLocal directly. Correct shape: if slideEntry.videoLocal exists, resolve it relative to the DECK directory (join(deckDir, videoLocal)) and prefer it over the assetsDir/<id> guess; only fall back to assets-dir/<id> resolution when videoLocal is absent.'
  repro: '1. Deck slidedata.json carries deck-relative local bindings: "videoLocal": "../assets/videos/yt-<id>.mp4" (the asset-pool convention since the presentations→deliverables consolidation). 2. Run bun scripts/co-deck/inject-video-players.ts <deck.html> with default --assets-dir (join(deckDir,''..'',''assets'',''videos'')). 3. The injector joins slideEntry.videoLocal onto assetsDir (double-join) and reports "0 local, rest YouTube fallback" while staging YouTube-iframe fallbacks — the local-first triple-fallback contract (ADR-documented) silently degrades to network mode. 4. Symptom is masked on zen decks: the template''s native VideoSlide consumes videoLocal directly and plays local mp4, so only the injector''s report and non-native themes are wrong.'
