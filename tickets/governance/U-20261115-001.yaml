  symptom: 'inject-video-players.ts mis-resolves deck-relative local video bindings. slidedata.json entries carry "videoLocal": "../assets/videos/yt-<id>.mp4" (deck-relative, per the asset-pool convention), but the injector resolves locals by joining that value onto its own --assets-dir (default join(deckDir,''..'',''assets'',''videos'')), producing a double-joined non-existent path; its per-slide local-binding check then misses every local mp4 and stages YouTube-iframe/new-tab fallbacks instead ("0 local, rest YouTube fallback" observed on the 2026-11-ai-era-business-survival deck today, which has 3 local mp4s that DO exist and DO play via the theme''s native video slide). Impact today is limited to the injector''s own staging correctness on non-native-video themes and misleading reports; on any theme without a native VideoSlide component the local-first fallback contract breaks entirely (network-dependent playback).'
