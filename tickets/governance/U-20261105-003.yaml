  symptom: 'Silent parser asymmetry between estimate-layout.ts and gen-slides-pdf.ts for layout_overrides in lecture-profile.md. estimate-layout.ts supports flat/dotted keys (e.g. `colors.card_dark: [248,246,241]`, `content_constraints.standard.max_body_chars: 140`) via its dotted-key parser + deepMerge. gen-slides-pdf.ts''s parseLayoutOverrides key regex is single-segment `[\w_-]+` (L185), so dotted keys are silently skipped — no error, no warning. Consequence observed 2026-11-05: a `colors.card_dark` dotted override passed the layout gate (exit 0) but never reached the PDF renderer, producing navy cards with illegible SVG ink labels (≈1.12:1) on 14 slides of a zen+classic deck; remediation required a mixed-form profile (dotted line for the gate parser + nested colors: block for the render parser), documented in the profile comment. Expected: both parsers accept the same key dialect, or gen-slides-pdf warns on unrecognized dotted keys. Repro: put a dotted `colors.<key>: <rgb>` override in a project lecture-profile.md, run the lint (passes) and then gen-slides-pdf (override absent).'
