    and then a PM synthesis, but its agent-meeting form predates the
    responsive-round committee design. It lacks (1) a round 2+ response contract
    — each participant addresses at least two named peers (agree/rebut/ask),
    answers questions addressed to them last round, states a stance-change line,
    and stays on agenda issues; (2) a facilitator agenda pass after round 1 that
    proposes 2-5 agenda issues from criteria/recommendation spread for the
    remaining rounds; (3) the ADR-0196 §2.4 minutes section order as the
    transcript template — agenda issues, discussion by issue with attributed
    exchanges, agreements, preserved dissent VERBATIM (never summarized), open
    questions, action items, and a proposed recommendation explicitly labelled a
    proposal (never a PASS/approval stamp). The skill already requires a dissent
    seat and proposal-only output, so this aligns it with the app committee form
    rather than changing its contract. Requested change: update the skill text
    (version bump) and the /meeting command template in the same direction;
    co-newbiz will pick up the upgraded skill on its next upgrade delivery.
