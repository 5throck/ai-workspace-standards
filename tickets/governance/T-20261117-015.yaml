title: >-
  dev-sync scoped staging is path-granular — hunk-level adjudicated staging
  cannot survive the pipeline. Evidence (2026-11-17, three separate sync runs
  needed hunk-level workarounds today): PM/auditor adjudications repeatedly
  required staging a PARTIAL registry.json (one spec entry in, sibling batch
  entries out — machinery PR-1, co-deck PR-4, audit-external-scan fix). The
  audit-fix landing's hunk-1-only index staging was SILENTLY CLOBBERED by
  dev-sync step 6's path-level git add: commit initially carried the forbidden
  sync-auto-detection hunk as a dangling reference (its entry JSON not in the
  commit); caught at push-time review, repaired via a pipeline re-run with the
  parallel entry JSON temporarily shelved (b1c7c6a37). Cost today: three
  manual hunk-edit stagings + one landing incident + a shelved-unshelved
  dance around untracked parallel files. Expected: dev-sync gains a
  hunk-adjudicated staging surface — e.g. a staged-index-preserving mode
  (honor an explicit pre-staged index for designated paths instead of
  path-level re-add), or an adjudicated-hunks manifest file the staging step
  consumes. Needs its own Design Gate (dev-sync is L1-owned core-standardized;
  blast radius covers every variant). Related verification gap: no gate
  detects a dangling registry reference at commit time (the bad commit passed
  all pre-commit gates; only push-time review caught it). Design: record in
  memory/2026-11-17.md (landed via PR #2073) is the primary evidence;
  upstream_request channel could not carry it (v1 limited to co-* projects,
  workspace root rejected).
