  symptom: >-
    The template runtime renders slides that carry `slideData[i].videoId`
    exactly like standard content slides: a white bubble card (`.slide-content`)
    with title and bullets. There is no video-slide branch in the template's
    renderSlide/buildSlideChildren path, so every deck that uses videos
    hand-rolls a post-build injector to overlay a player, and the standard
    bubble must then be suppressed per-project. This is a recurring defect class
    — the white bubble shows through under/near the injected player when
    suppression is missed. Observed in presentations
    2026-10-ai-industry-research and 2026-10-ai-era-business-majors. Expected:
    slides with a videoId render chrome-free (full-bleed thumbnail + play
    affordance + plain caption) natively from the template, so no per-project
    bubble suppression is needed.
