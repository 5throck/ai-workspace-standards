  section 3.6 note, docs/constitution/05-multi-agent-architecture.md,
  docs/governance/agents/execution-plan-templates.md. Scope: L0 = those 3 files.
  L1/L2 = 16 template files (14 variant AGENTS.md + templates/common/AGENTS.md +
  templates/common/docs/governance/agents/execution-plan-templates.md,
  COMMON-AGENTS propagated). L3 = 33 files across 16 delivered Projects/co-*
  (AGENTS.md + docs/governance/agents/execution-plan-templates.md copies) -
  converge via upgrade visits per the TIER NORMALIZED precedent, never
  hand-edit. Design-gate decisions needed: (a) whether high applies uniformly to
  high/medium/low tiers or per-tier levels; (b) whether to add machine
  enforcement (e.g. a validate arm or dispatch-gate check) or keep advisory
  prose; (c) session-hosted PM reasoning level remains owner-selected - floor
  semantics (tier_semantics: floor) unaffected. Historical records
  (CHANGELOG.md, docs/designs/2026-10-23-zai-tier-floor-support-design.md,
  docs/decisions/DEC-20261023-01.md) carry the old phrase - do not retro-edit.
  Gates: bun scripts/validate-templates.ts (COMMON-AGENTS parity), repo grep for
  the updated phrase. Related: T-20261031-005 (GPT-6.x registry rebase) touches
  the same section 3.6 note surface - consider one shared design cycle.
