title: >-
  Make the scaffold/upgrade pipeline populate docs/context.md and
  docs/project.md identity fields (name, description, type) instead of leaving
  placeholder text that audit flags
priority: normal
description: >-
  Root-cause fix for pipeline-maintained scaffold placeholders (from the co-newbiz
  2026-09-30 project review; user-approved). Affected files: docs/context.md and
  docs/project.md, whose header says "pipeline-maintained, no hand edits", yet
  writeContextMd in scripts/helpers/pm-md-parser.ts emits scaffold placeholders
  ([Project Name], TODO/TBD description/type) and nothing populates real values at
  new-project or template-sync/upgrade time — so audit.ts's live-context placeholder
  WARN (v2.41.0/v2.42.0 check family) returns on every upgrade in every variant
  project. Reference stopgap: co-newbiz PR #426 hand-filled the fields, which the
  next template sync will overwrite. Design question to settle before dispatch:
  should the scaffold/upgrade pipeline accept --description/--type inputs at
  new-project time, derive them from existing project docs on upgrade, or both?
