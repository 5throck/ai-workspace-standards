  usage doc-comment (line 13, 'const slideData = [...];') precedes the real
  runtime array (line 106), and the v1.2.0 primary matcher's first-match regex
  extracted the '[...]' placeholder, failing strict-JSON parse with 0 slides
  extracted. Root fix in templates/co-deck extract_slidedata.mjs v1.3.0: try
