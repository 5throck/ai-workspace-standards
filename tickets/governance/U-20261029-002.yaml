  (candidate count + excerpt). Proven: lecture_v1.html now extracts 113 slides;
  regression deck lecture_ai-business-agent_v3.html unchanged at 49. Project
  copy synced + landed via co-deck PR #186 (SCRIPTS.md 1.3.0 both sides).
