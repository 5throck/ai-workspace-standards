  symptom: 'In templates/co-deck/scripts/co-deck/tests/gen-slides-pdf-render.test.ts (1.9.1), the test "U-005(1+2): /W covers shaped (calt) gids of : and -, entries are integers" fails on its final assertion `expect(Number.isInteger(w)).toBe(true)` whenever the renderer uses Pretendard. Observed: 14,499 of 14,716 /W entries are fractional (e.g. 250.9765625, 645.5078125). Expected by the test header: integers per PDF 32000-1 §9.7.4.3. Root cause: gen-slides-pdf.ts (U-20261105-005 patch) replaces CustomFontEmbedder.computeWidths with `advanceWidth * this.scale`, scale = 1000/unitsPerEm; Pretendard has unitsPerEm 2048, so every width is a non-integer real. The same form is pdf-lib''s own default, and fractional /W entries are valid, so the renderer is correct and the expectation is wrong. The gids-presence assertions (13205, 13252) pass. The co-deck project copy is byte-identical to the template and fails the same way, so the template suite fails on any machine that carries the Pretendard font pair.'
