result: >-
  Implemented the variant-override mechanism (owner-decision batch design
  docs/designs/2026-10-29-owner-decision-batch-design.md, PR #1729): a validated
  designLint block in variant.json overrides the workspace-schema block whole
  (order variant.json > schema; invalid block FAILs naming the violation;
  enabled:false = explicit SKIP naming the winning source) — audit v2.60.0 +
  design-lint-roots v1.1.0 (pure validateDesignLintOverride) + design-lint
  v2.5.0 --allow flag (so override allowlists are enforceable end-to-end: L3
  projects have no workspace-schema.json for the engine to read) +
  validate-templates Check 2 variant-designlint shape check. Documented in
  templates/common/docs/context.md. co-abap adoption is the variant's own call —
  its SKIP is now explicit and harmless, and the mechanism unblocks any variant
  that wants the gate.
