  symptom: >-
    docs/workspace-schema.json ships designLint.scanRoots =
    ["templates/co-design/playground/src"] as the delivered value. In delivered
    variants without that path (for example a non-UI ABAP variant) the
    design-lint gate can never find its configured root and permanently reports
    SKIP. audit.ts v2.56.0 added an explicit conventional-root fallback
    (helpers/design-lint-roots.ts) so the skip is explicit rather than silent,
    but the configured value itself is not variant-overridable, so non-UI
    variants can neither point the gate at their own UI sources nor cleanly
    disable the gate for their project. Expected: designLint configuration
    overridable per variant (or cleanly disabled per variant).
