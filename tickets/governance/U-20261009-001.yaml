  trust: untrusted
  suspected_layer: L1
  symptom: >-
    The graft tool (an external repo-indexing CLI) installs a generated skill at
    .claude/skills/graft/SKILL.md that has no `version:` frontmatter field.
    scripts/audit.ts then fails with "[FAIL] .claude/skills/graft/SKILL.md
    missing version: field", and the platform lifecycle check
    (verify-platform-lifecycle.ts) fails with it. That blocks every /sync commit
    in projects where graft is installed. The file is untracked, so CI never
    sees it; the failure is local-only. Expected: third-party, tool-generated
    skill directories that are not part of the project's skill registry (here
    .claude/skills/graft/, and its mirrors under .agents/, .codex/, .gemini/ and
    .hermes/ skills dirs if present) are excluded from the skill version and
    lifecycle checks, ideally through a configurable ignore list.
  affected_paths:
    - scripts/audit.ts
    - scripts/verify-platform-lifecycle.ts
    - .claude/skills/graft/SKILL.md
  identity_source: client_roots
  repro: >-
    1. Install graft (npm i -g @nanonets/graft) in a scaffolded project and let
    it wire agents; it creates .claude/skills/graft/SKILL.md with no version
    field. 2. Run bun scripts/audit.ts: it reports the missing version field and
    the platform lifecycle failure. 3. Run /sync: the commit is blocked. The
    workaround is to move the directory out temporarily before every sync.
