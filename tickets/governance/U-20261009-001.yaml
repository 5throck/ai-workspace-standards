result: >-
  Confirmed; root cause deeper than reported — the T-20261002-001
  self-managed-surfaces exemption registry is L0-only (docs domain disabled per
  ADR-0069), so fresh scaffolds loaded an empty set and graft's unversioned
  generated SKILL.md kept re-blocking /sync in projects. Fixed:
  scripts/lib/self-managed-tools.ts 1.1.0 ships built-in
  DEFAULT_SELF_MANAGED_PATHS (graft across all 5 platform mirrors +
  skills/graft/) applied with or without the registry; registry entries and
  SELF_MANAGED_SURFACES_EXCL env can only add (fail-safe);
  verify-platform-lifecycle 1.6.1 documents it; audit's Fail hint names the
  escape hatches. 5-case unit test.
