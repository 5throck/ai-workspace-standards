  symptom: >-
    co-deck styles declare font stacks starting with 'Pretendard' / 'Noto Serif
    KR' but ship no @font-face rule and no bundled font files in the render
    chain. On any machine without Pretendard installed, Korean text falls back
    to a serif Myungjo face (AppleMyungjo on macOS was observed via CDP in a
    Playwright render), silently breaking the sans-serif typography of every
    deck. The shared pool presentations/assets/fonts/ does contain Pretendard
    TTFs, but nothing in the build copies them into the project or injects
    @font-face. The engagement deck required a per-deck fix: copy Pretendard
    Regular/Bold into assets/fonts/, add deck-level @font-face (font-display:
    swap) and extend the fallback chain ('Apple SD Gothic Neo','Malgun
    Gothic','Noto Sans KR').
