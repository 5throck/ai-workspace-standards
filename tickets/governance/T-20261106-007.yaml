  the blocks at memory/archive/<file> as repaired (the archive is the documented
  end-state for aged logs), OR the memory-archive step must skip files named in
  active union-verify findings. Repro: restore memory/2026-10-29.md from
  e73b51057^1 (preserved at /tmp/ours-1029.md), run any root /sync — archive
  step moves it, 3.88 blocks. Side observation: the overnight session's git
  commits are FUTURE-dated (e73b51057 committed '2026-11-06T03:55+09:00' vs real
  time 2026-11-05T02:50 KST — ~25h clock skew in that session's environment);
  union-verify treats the future-dated merge as post-activation blocking, and
  the skew explains the 11-06-dated branch/PR naming
