    templates/common/.gemini/settings.json ships terminal.executionPolicy "Auto"
    with a 10-entry denylist (rm -rf, git push --force, reboot, etc.). A
    denylist-only guard fails open: curl, wget, osascript, security, ssh,
    non-force git push, bun add of a typosquat, and bash script.sh all execute
    without confirmation under the user's privileges. The co-abap instance ships
    a hardened profile (executionPolicy "Off" plus a 78-entry deny list covering
    .env reads, node -e/bun -e/python -c eval, and self-modification of
    settings/.mcp.json) that the common template could adopt, at minimum
    switching "Auto" to "Manual" and expanding the denylist. Affects 15 of 16
    variant instances.
