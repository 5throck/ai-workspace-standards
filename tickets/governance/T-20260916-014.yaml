title: >-
  hooks: pre-push runs the full audit battery on ref-DELETION pushes and blocks
  them (found deleting merged pr/* branches across Projects/co-* — every git
  push origin --delete was rejected by the project pre-push hook; deletion
  pushes carry no commits to audit). Fix: pre-push should no-op (or scan-only)
  when all pushed refs are deletions (all-zero local SHAs on stdin), in both the
  TS hook and the .githooks shell wrapper — keeping commit pushes fully gated.
  Note .githooks/pre-push is a hand-maintained L0+L1 parity pair
  (lifecycle-sync-audit Check G)
