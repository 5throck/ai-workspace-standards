  symptom: >-
    Two defects found while landing ADR-0102 tier delivery into 9 projects via
    upgrade-project + dev-sync (2026-10-27, observed in Projects/co-consult as
    reference). (1) dev-sync Step 3.9 auto-E5 upgrade-delivery attribution fails
    on every upgrade landing whose scripts-snapshot.json content changed:
    isDeliveredDiff() (scripts/lib/upgrade-policy.ts, PIPELINE_ARTIFACT_PATHS)
    does not whitelist scripts-snapshot.json or .claude/last-upgrade-pr-body.md,
    both regenerated by upgrade-project after last-upgrade-delivery.json is
    written, so they can never appear in manifest.files — the gate blocks with
    "spec-check FAILED" and the operator must pass --spec-exempt=E5 manually
    (observed on co-consult, co-export, co-game). (2) Scaffold-resolved
    agents/i18n-specialist.md in projects carries a duplicate `lifecycle:`
    frontmatter key (two blocks; stale second one), which makes the frontmatter
    unparseable for agent-lifecycle-audit's tier resolver and produces a false
    "Missing tier field in frontmatter (ADR-0102 scalar form)" error even though
    a valid legacy tier block is present (observed in co-consult, co-export,
    co-game; templates are clean — the duplication is introduced at
    scaffold/resolve time). Workaround applied per project: remove the stale
    duplicate lifecycle block; agent-lifecycle-audit then accepts the legacy
    tier via its documented transition fallback.
  affected_paths:
    - scripts/lib/upgrade-policy.ts
    - agents/i18n-specialist.md
    - scripts/dev-sync.ts
  identity_source: self_declared
  repro: >-
    1) bun scripts/upgrade-project.ts Projects/<p> --prune-removed (clean tree),
    2) cd project; git add -A, 3) bun scripts/dev-sync.ts --body-file
    .claude/last-upgrade-pr-body.md "chore: ..." — Step 3.9 fails spec-check
    with exit 1 even though the diff is fully upgrade-delivery + pipeline
