  symptom: >-
    download-videos.ts cannot find QuickDL after a standard external-deps
    install. Its default QuickDL directory is ~/git/project/QuickDL, not the
    manifest install_dir external/quickdl. Also, `external-deps install` clones
    the repo but does not create the .venv the adapter requires
    (.venv/bin/python + cli.py), so the video download fails ("QuickDL not
    found") and decks fall back to YouTube-only (no offline playback). Expected:
    adapter defaults to external/quickdl from external-deps.json, and install
    (or the adapter) provisions the venv or prints an actionable setup command.
  affected_paths:
    - scripts/co-deck/download-videos.ts
    - external-deps.json
    - scripts/external-deps.ts
  identity_source: self_declared
  repro: >-
    In co-deck: `bun scripts/co-deck/download-videos.ts --project
    deliverables/<deck-with-video>` → "QuickDL not found at
    ~/git/project/QuickDL". external/quickdl exists (v1.0.1) but has no .venv.
    Workaround: `python3.13 -m venv external/quickdl/.venv &&
    external/quickdl/.venv/bin/pip install -r
    external/quickdl/requirements.txt`, then `--quickdl-dir external/quickdl`.
    (python3.12 venv failed at ensurepip on this machine.)
