kind: manual
title: >-
  Launcher-side prompt integrity gate (meeting 2026-11-12, auditor PRESERVED
  DISSENT S2): automation prompt files live OUTSIDE the repo, so in-repo
  protected-path diff gates cannot see the runner (or anything with filesystem
  access) editing its own next-night prompt at 03:00 — cross-run authority
  escalation invisible to every in-repo gate. Required mechanism:
  prompts.manifest.json checked into the root repo carrying SHA256 of every
  automation prompt file; the automation LAUNCHER (out-of-process, before fire)
  verifies hashes — mismatch = no fire + morning alert. Effect: any prompt
  change must transit a repo commit, which is human-visible. PLATFORM-DEPENDENT:
  requires launcher support from the automation host (ZCode) — file upstream
  request if the host exposes no pre-fire hook. Auditor position verbatim: 'the
  launcher hash-manifest gate ... is a required addition, not an option'.
