  symptom: 'Template-upgrade waves rewrite delivered agent and skill files without refreshing their frontmatter dates, so the lifecycle audits re-flag the same staleness class after every upgrade. Observed in co-safety after the 2026-10-27 v0.22.0 upgrade: agent-lifecycle-audit reports 8 warnings (frontmatter last_updated older than the last git content commit of 2026-10-27) and skill-lifecycle-audit reports 21 warnings (last_reviewed older than the content commit) — all caused by upgrade delivery modifying file content while leaving last_updated/last_reviewed untouched. The validators detect the class; nothing in the delivery path repairs it, so each upgrade wave re-adds ~29 warnings fleet-wide. Expected: content-rewriting delivery also refreshes the affected frontmatter dates, or the lifecycle audits tolerate dates equal to the recorded template-version upgrade date. Reproduction: run agent-lifecycle-audit and skill-lifecycle-audit in any project right after an upgrade wave — staleness warnings match the upgrade commit timestamp.'
