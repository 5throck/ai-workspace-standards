  symptom: >-
    scripts/helpers/security-validator.ts (~line 119) initializes workspace_root
    from options.workspace_root || process.cwd(). In a variant project, variant
    agents legally extend workspace-root agents via relative paths like extends:
    ../../../agents/pm.md (agents/pm.md:2, agents/docs-writer.md:2 — documented
    as the intended upgrade contract in agents/docs-writer.md). The targets
    exist at the workspace root. But running any tool that calls
    safeValidateExtends() (imported by scripts/helpers/merge-frontmatter.ts,
    used by scripts/resolve-variants.ts and scripts/validate-templates.ts) with
    the project root as cwd exits 1 with security_violation: "Path traversal
    attempt detected - attempting to escape workspace boundaries", because the
    validator treats the project directory as the whole workspace while the
    3-tier model defines the workspace as the parent ai_workspace/ directory.
    Expected: the workspace root should be detected by walking upward for a
    workspace marker (or threaded explicitly) so legitimate cross-tier extends
    within ai_workspace/ validate, while genuine outside-of-workspace traversal
    still fails. Reproduction: from a variant project root, run bun
    scripts/helpers/extends-validator.ts agents/pm.md → exit 1,
    security_violation.
