result: >-
  Fixed in PR #1848 (merged): security-validator v1.2.1 — workspace root is now
  detected by walking upward from cwd for an L0-only marker (CONSTITUTION.md or
  templates/common, verified absent from every delivered Projects/co-*
  checkout); explicit options.workspace_root still wins; fail-closed fallback to
  cwd when no marker exists. Hardening: boundary comparison
  symlink-canonicalized (macOS /var→/private/var) and separator-aware
  (sibling-prefix dirs fail). Legitimate 3-tier extends (agents/pm.md:2
  ../../../agents/pm.md) now validates from a project cwd while
  ../../../../etc/passwd still fails closed — 7 negative-control cases pinned in
  tests/unit/security-validator-workspace-root.test.ts. Windows CI separation
  bug in the first cut (hardcoded '/' prefix) fixed to path.sep.
