    Gate 2 (content approval) has no audience-fit review, so structural content
    problems reach a finished deck and are only caught by the end user. Found in
    one Korean keynote (audience: Korean startups + mid/large companies): (1)
    Case selection ignored audience locality/scale — PART 02 was almost all
    global mega-deals (Microsoft–OpenAI, NVIDIA, Isomorphic, Waymo, nuclear
    PPAs); the only domestic cases were internal AI adoption, none were
    startup×corporate collaborations. Research adjusts search LANGUAGES to the
    target market but nothing governs case relevance. (2) Narrative order fought
    the deck's own message: PART 01 gave the answer (OI definition) before the
    problem and cause; PART 02 ended on a meta coverage matrix instead of
    tension; PART 03's slides did not follow its own 사람·기술·미래 axes. (3) The
    punchline slide sat behind the references slide. (4) Diagram emphasis
    pointed at the wrong thing: the coverage matrix highlighted the one field
    the deck explicitly does NOT cover (양자 '명시적 미커버'). Expected: a Gate 2
    checklist (storyline/PM) that checks case mix vs audience,
    problem→cause→answer order and part-ending tension, punchline placement, and
    that diagram accents mark the key message, not excluded items.
