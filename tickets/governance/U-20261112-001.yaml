  symptom: >-
    scripts/validate-templates.ts exits with code 1 and "[ERROR] templates/
    directory not found" when run in a variant (L3) project that has no
    templates/ directory. The script's own changelog (line ~267) states v1.50.2
    added: "When templates/common is absent (variant or project context), main()
    returns 0 and reports 'not applicable'". But a module-level guard at lines
    ~635-640 checks existsSync(TEMPLATES_DIR) and calls process.exit(1) BEFORE
    main() (line ~6804) runs, so the documented L3 guard never executes. Repro:
    cd into any L3 variant project without templates/ and run `bun
    scripts/validate-templates.ts` → exit 1. The script row is pre-allowlisted
    for agents (e.g. .claude/settings.json permissions.allow "Bash(bun
    scripts/validate-templates.ts *)"), so every agent invocation in variant
    projects produces a false failure. Expected: exit 0 with "not applicable"
    report per the v1.50.2 changelog contract, or a registry/allowlist
    reclassification if L0-only by design.
