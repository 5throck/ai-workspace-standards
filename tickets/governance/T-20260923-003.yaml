  project-local scripts get deleted on every --prune-removed run. Instance
  (2026-09-23 fleet resync): co-newbiz scripts/deploy-web.ts (owner co-newbiz,
  L3-only, active, design 2026-09-21-docker-prod-cicd) was git rm-ed by the
  v1.43.0 upgrade prune; restored manually and the manifest regenerated. Fix:
  prune scripts/ candidates must survive when registered in the project
  SCRIPTS.md (and reconcileScriptRegistry should drop pruned rows only when the
  prune was legitimate); add a regression test with a registered
  project-local script + --prune-removed
