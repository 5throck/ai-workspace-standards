  symptom: >-
    In variant/project layouts, scripts/audit.ts §27 correctly resolves and runs
    the variant's audit-variant hook declared in variant.json
    script_manifest.local (PASS). But the subsequent §28 standing regression
    check (approx lines 3296-3338) sweeps only templates/co-*/variant.json. A
    variant project has no templates/co-*/ directory, so hookCount === 0 and
    audit.ts emits a permanent WARN: "No variant declares an audit-variant hook
    in script_manifest.local — nothing to regression-check" on every run, even
    though the hook is declared in the project's root variant.json and is
    actually executed in §27. This is recurring false-positive noise that
    desensitizes teams to real warnings. Expected: when the repo has no
    templates/co-*/ manifests but the root variant.json declares and §27
    executed the hook, §28 should skip silently (or incorporate the root
    manifest into the sweep and assert it executes, turning the noise into a
    real regression gate).
