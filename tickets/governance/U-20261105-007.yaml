  symptom: >-
    Pipeline and content gaps found while revising two decks:

    1. Videos: the decks reference YouTube IDs, but no pipeline step downloads
    them for offline HTML playback. The project had to copy
    download_all_videos.py and inject_video_players.py from an earlier deck by
    hand. The rebuild order (build → style patch → video inject) is not
    documented, and a rebuild silently drops the players.

    2. tests/patch-zen-white-bubble.ts defaults to --version v1. With a v2 build
    it patches the wrong file and leaves v2 unpatched, with no warning.

    3. Storyline emits a visualDisplay text panel that repeats the slide's
    bullets verbatim, and captions equal to the title or a bullet. Nothing
    checks for this.

    4. Bullet density: many content slides had 2–3 bullets. The user's standard
    is 4–5; estimate-layout's default min_bullets is 3.

    5. Images: slides whose visual is an SVG got no background photo (about 21
    per deck). Nothing checks photo reuse across decks made the same day (one
    file was shared between two decks).

    6. The instructor profile is not carried over from the most recent filled
    lecture-profile; new decks start blank.

    Expected: an offline video download and inject step in html-build, with the
    rebuild order documented and the inject idempotent. The patch script follows
    the build version or errors. A duplicate-text lint covers visualDisplay,
    caption, title and bullets. min_bullets is configurable per profile (4
    here). Background coverage and cross-deck hash dedupe run in the image gate.
    Instructor defaults come from the newest filled profile.
