  suspected_layer: unsure
  symptom: >-
    Starting a Claude Code session in a new git worktree fails with
    "WorktreeCreate hook failed". In `.claude/settings.json` (around L233),
    `hooks.WorktreeCreate` runs only `git config core.hooksPath .githooks`, with
    async: true. In Claude Code, a WorktreeCreate hook replaces the built-in
    worktree creation: it must create the worktree and print its path. This hook
    does neither, so no worktree session can start. Expected: worktree sessions
    start normally. The command is also redundant: core.hooksPath is
    repository-wide config that every worktree shares, and the SessionStart hook
    already sets it. Suggested fix: remove the WorktreeCreate block from the
    template settings.
  affected_paths:
    - .claude/settings.json
  identity_source: client_roots
  repro: >-
    1. In a project scaffolded from the template, start a new Claude Code
    session that uses its own worktree (for example from the desktop app, with a
    new task in a worktree). 2. The session fails to start with "WorktreeCreate
    hook failed".
