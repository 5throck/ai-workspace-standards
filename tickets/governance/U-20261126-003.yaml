  symptom: >-
    scripts/helpers/local-patch-scan.ts LOCAL_PATCH_RE (=
    /LOCAL-PATCH\(upstream-request:\s*([A-Za-z0-9][A-Za-z0-9-]*)\)/g) scans raw
    file contents with no comment/string awareness. scripts/detect-backport.ts
    line 20 contains that exact pattern inside its own docstring as format
    documentation ("E1 LOCAL_PATCH — LOCAL-PATCH(upstream-request: pending)
    markers found"), so every sync-detection run reports a spurious E1
    template-defect candidate: file=scripts/detect-backport.ts,
    id=pending/uid=null. The detector flags its own documentation as evidence of
    an unfiled local patch. No actual marker exists in the project. Consequence:
    one recurring false candidate per detection run (deduped after first state
    write, but recorded with uid=null = "pending" forever until fixed), and PM
    triage noise each sync. Expected: comment/docstring lines (trimmed line
    starts with * or //) should not produce LOCAL-PATCH findings, or the scanner
    should exclude the detector's own doc example.
  affected_paths:
    - scripts/helpers/local-patch-scan.ts
    - scripts/detect-backport.ts
  identity_source: self_declared
  repro: >-
