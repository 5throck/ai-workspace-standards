    affected_paths=[scripts/detect-backport.ts] and uid=null (persisted in
    .git/detect-backport-state.json filed[0], dedupe_token sha256:527e2e38...).
    Then: grep -n "LOCAL-PATCH(upstream-request" scripts/detect-backport.ts ->
    the ONLY hit is line 20, inside the file's own /** ... */ docstring
