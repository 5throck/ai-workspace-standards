  symptom: >-
    Upgrade delivery can silently drop variant-local additions that live inside
    a delivered core script. In co-newbiz, a variant-specific gate block added
    to scripts/audit.ts (ADR-0070 server-boundary check, wired 2026-08-26) was
    removed without any CONFLICT record or warning when the 2026-08-29 upgrade
    wave replaced audit.ts. The ADR and SCRIPTS.md kept claiming the gate was
    CI-wired, 5 direct page-level DB imports outside app/api accumulated
    undetected, and the loss was only rediscovered by a manual project review on
    2026-11-22 via git archaeology (added 0a701b29, lost 4d6793e6). The same
    delivery semantics left audit.ts and dev-sync.ts carrying two unresolved
    ERROR-severity LOCAL-PATCH CONFLICT dispositions (U-20261108-001,
    U-20261107-003) with no promotion tracker.
  affected_paths:
    - scripts/audit.ts
    - scripts/dev-sync.ts
    - scripts/co-newbiz/audit-variant.ts
  identity_source: cwd
  local_workaround_diff: >-
    Variant-owned gates now live exclusively in
    scripts/co-newbiz/audit-variant.ts (declared via variant.json
    script_manifest.local), which survives upgrade waves; the boundary gate was
    re-implemented there as a blocking runServerBoundaryGate
    (lint-server-boundary.ts v1.1.0 allowlist mode per DEC-20261122-01).
    Additionally two variant LOCAL-PATCHes to the delivered core scripts are
    pending upstream promotion and carry inline markers: U-20261107-003
    (dev-sync.ts scoped-staging commits regenerate VERSION_MANIFEST) and
    U-20261108-001 (audit.ts biome reformat + nul-lint-ignore placement +
    biome.json override note).
  repro: >-
    1. Variant adds a variant-specific gate block to the delivered core script
    scripts/audit.ts (commit 0a701b29, 2026-08-27, comment: "co-newbiz-specific,
    not part of the shared workspace template"), wiring
    scripts/co-newbiz/lint-server-boundary.ts into the full audit pass; ADR-0070
    documents it as CI-wired. 2. upgrade-project delivers a rewritten
    scripts/audit.ts in the next wave (commit 4d6793e6, 2026-08-29): the variant
    block disappears with no CONFLICT recorded and no warning emitted. 3. Docs
    citing the gate stay stale; 5 boundary violations accumulate undetected for
