  source: project/co-deck
  trust: untrusted
  suspected_layer: L1
  symptom: >-
    [L1 — workspace root script scripts/contained-run.ts, filed from co-deck
    because only co-* projects may file] Browser-gated test suites cannot run
    for real under contained-run even after the Playwright Chromium binary is
    installed in the user cache. Two blockers in contained-run.ts env
    construction: (1) HOME is redirected to a scratch temp dir and Playwright
    derives its browser cache from os.homedir(), so chromium.launch() looks for
    browsers at <scratch>/Library/Caches/ms-playwright and fails;
    PLAYWRIGHT_BROWSERS_PATH is not forwarded (only
    PATH/HOME/TMPDIR/LANG/BUN_INSTALL_CACHE_DIR/GIT_CONFIG_GLOBAL are). (2) PATH
    is system dirs + the running runtime's dir only; the design assumes node
    sits next to bun, but on this machine bun is ~/.bun/bin and node is
    ~/.local/bin, so the suites' spawnSync('node', ...) probe fails ENOENT and
    the VR suite skips with 'browser unavailable' instead of running.
  affected_paths:
    - scripts/contained-run.ts
  identity_source: self_declared
  local_workaround_diff: >-
    No repo change made. Workaround: pass the needed non-secret env through the
    command itself: bun scripts/contained-run.ts --project Projects/co-deck
    --timeout 600 -- /bin/sh -c 'export
    PATH="/usr/bin:/bin:/usr/sbin:/sbin:$HOME/../.bun/bin:$HOME/../.local/bin";
    export PLAYWRIGHT_BROWSERS_PATH="$HOME/Library/Caches/ms-playwright"; bun
    test scripts/co-deck/tests/theme-visual-regression.test.ts' (with absolute
    user paths in the real run). Suggested fix: forward PLAYWRIGHT_BROWSERS_PATH
    like BUN_INSTALL_CACHE_DIR, and resolve `command -v node` at contained-run
    start and add its dir to PATH instead of assuming node lives next to the
    running runtime.
  repro: >-
    1. npx playwright install chromium (binary lands in
    ~/Library/Caches/ms-playwright). 2. bun scripts/contained-run.ts --project
    Projects/co-deck --timeout 600 -- bun test
    scripts/co-deck/tests/theme-visual-regression.test.ts → still '(skip)
    browser unavailable'. 3. Manual probe under containment-like env confirms
    both causes: HOME=$(mktemp -d) node -e launch → 'Executable doesn't exist at
    <scratch>/Library/Caches/ms-playwright/...'; PATH without ~/.local/bin →
    'command not found: node'.
  triage: inbox
