  symptom: >-
    Safety workflow run records are never persisted and no validator checks
    them. The variant's safety-workflow-manager agent spec
    (agents/safety-workflow-manager.md:69,76,108,126, shipped from
    templates/co-safety) mandates a completion record for every workflow run at
    memory/workflows/YYYY-MM-DD-<workflow-id>.md with an evidence chain. In the
    deployed co-safety project, memory/workflows/ (and memory/incidents/,
    memory/registers/) contain only .gitkeep since scaffold — every session log
    in memory/ is a template-upgrade chore; zero workflow-run, incident, or
    register records exist. Two root gaps above the project: (1) no schema
    anywhere in the hierarchy defines the RUN-record fields — the workflow
    definitions carry workflow_id (workflows/_shared/tbm/schema.yaml), but
    nothing specifies the required fields of a run record (timestamp,
    dispatching agent ID, workflow ID, legal_basis array); (2)
    scripts/verify-memory.ts (templates/common copy) validates only the
    4-section session-log format and the MEMORY.md index — it never inspects
    memory/workflows/ or memory/incidents/. Expected: the record-keeping posture
    declared in variant.json (record-keeping duties under OSHA-KR Enforcement
    Rule Art. 37) is machine-verifiable. Reproduction: list memory/workflows/ in
    a deployment — .gitkeep only; run scripts/verify-memory.ts — passes with no
    mention of the empty evidence directories.
