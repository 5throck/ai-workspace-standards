  symptom: >-
    validate-image-manifest.ts has two workflow gaps: (1) it REJECTS deck-local
    image paths (./assets/...), forcing deck-local user-cleared press images to
    be copied into the shared pool (deliverables/assets/images/), which exposes
    them to other projects beyond the owner's intent; (2) it refuses to run at
    all when image-manifest.json doesn't exist yet, so the diagram-manifest
    can't be validated during the diagram-only stage (workaround: temp workspace
    with empty manifest).
  affected_paths:
    - scripts/co-deck/validate-image-manifest.ts
    - scripts/co-deck/download-videos.ts
  identity_source: cwd
  repro: >-
    1. Put a deck image at <deck>/assets/x.jpg and reference ./assets/x.jpg →
    validator errors. 2. Run the validator before any image-manifest.json exists
    (diagram-only stage) → refusal; workaround is a temp workspace with an empty
    manifest. 3. `bun scripts/co-deck/download-videos.ts --project …` fails with
    "QuickDL not found at ~/git/project/QuickDL" even though external-deps
    install populated external/quickdl (no venv) — workaround: manual venv +
    --quickdl-dir external/quickdl (also U-20261119-004).
