  T-20261121-001 advisory field explicitly deferred behavioral gating, but the
  owner now signals the connection is real; design the consistency rule
  (advisory vs enforced) with the ADR-0057/0058 country-scoped-assets precedent.
  Needs Design Gate: new seed entry (compatibility_test + adapter surface
  decision — co-deck has NO humanize adapter script today, unlike co-work's
  scripts/humanize/humanize-adapter.ts), country profile changes on two
  variants, and the market_scope↔country_config consistency ruling.
