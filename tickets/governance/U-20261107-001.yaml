  symptom: >-
    The pre-commit Lifecycle Compliance Check (scripts/hooks/pre-commit.ts,
    row-comparison via scripts/helpers/pre-commit-script-gate.ts) requires
    scripts/SCRIPTS.md to be staged whenever any scripts/*.ts is staged, using
    `git diff --cached --name-only` as the staged-set proxy. When the SCRIPTS.md
    registry row for the bumped script ALREADY exists in HEAD with the correct
    target version (the row was swept into an earlier pipeline commit while the
    script's @version bump was not yet landed), the legitimate content delta for
    SCRIPTS.md is zero. A zero-delta file can never appear in the cached diff
    name list, so the gate fails unconditionally and its own prescribed remedy
    ("stage the updated scripts/SCRIPTS.md") is mathematically a no-op in this
    state. Content invariants it is meant to protect (@version == SCRIPTS.md row
    version) are already satisfied; the proxy just cannot observe that. Observed
    at the workspace root while landing a coherent version-coherence batch;
    deterministic on retry.
  affected_paths:
