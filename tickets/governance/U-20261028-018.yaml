  symptom: >-
    The pre-push gitleaks invocation omits --config, so push-time secret
    scanning runs under different policy than pre-commit and CI.
    scripts/hooks/pre-push.ts (line ~198: gitleaks detect --redact
    --log-opts=...) passes no --config, while
    scripts/hooks/pre-commit.ts:438-441 passes
    ['protect','--staged','--no-banner','--log-level','error','--config','.gitleaks.toml']
    with a comment documenting that empty-arg fallback previously weakened that
    gate, and .github/workflows/ci.yml:92 also passes --config explicitly. The
    repo config .gitleaks.toml carries a custom allowlist (CHANGELOG.md,
    .env.sample, test files, _examples/); when implicit config discovery misses
    the dot-named file, push scans of allowlisted content can false-fail or
    silently deviate from the reviewed config. The same omission exists in the
    workspace-root scripts/hooks/pre-push.ts and in
    templates/common/scripts/hooks/pre-push.ts, so all scaffolded projects
    inherit it. Reproduction: grep -n "config" scripts/hooks/pre-push.ts — no
    --config argument in the gitleaks invocation; compare with pre-commit.ts.
