  symptom: >-
    In co-consult variant projects, deliverable-type outputs (client-facing
    research findings, analyses, reports) are placed under docs/reports/ instead
    of the variant's own deliverables/ layout, because the projected AGENTS.md
    §7 File Organization bullet tells agents to put "analysis and reports" in
    docs/. The L2 variant template itself ships the deliverables/ scaffold
    (deliverables/drafts|presentations|references|reports|research) and defines
    an Output Destination Mapping in docs/co-consult.context.md
    (deliverables/research/ = research findings; deliverables/reports/ = final
    client-ready reports; naming {topic}-{report-type}-{YYYY-MM-DD}_ko.md), but
    templates/co-consult/AGENTS.md (~line 320, inherited verbatim from
    templates/common/AGENTS.md ~line 270) contradicts that mapping with "Place
    analysis and reports in docs/". Agents bootstrap AGENTS.md first, so the
    docs/ instruction wins in practice and every deliverable lands in the wrong
    folder, requiring manual relocation and breaking the deliverables/
    convention the variant was designed around.
  affected_paths:
    - AGENTS.md
    - docs/co-consult.context.md
    - deliverables/research
  identity_source: cwd
