title: >-
  CI-only flake: generate-scripts-mirror.test.ts R2 live-tree span count 134 vs
  local 133 (bun 1.4.0 CI vs 1.4.2 local suspicion). The R2 invariant ("the
  generator itself has no registry row in the mirror span") passes locally on
  the identical commit (bun scripts/test-runner.ts unit green, c77e74db lineage)
  but fails in CI across ubuntu/macos/windows with Expected 133 / Received 134.
  Suspects: (a) bun-version regex/parse difference in extractRegistrySpan or the
  L0 SCRIPTS.md row parser, (b) the pinned toHaveLength(133) needing +1 for a
  legitimately added row (mcp-governance-server L0 row? excluded by R2 —
  verify), (c) CI checkout line-ending or locale differences. Reproduce: re-run
  the failed job on the same sha; add a temporary rowKeys dump at
  tests/unit/generate-scripts-mirror.test.ts:208-210 to capture the extra key.
  Until diagnosed, this blocks merges that touch scripts/SCRIPTS.md (branch
  protection requires the failed check) — interim workaround: --admin merge
  after local test-runner green (used for PR #1085).
