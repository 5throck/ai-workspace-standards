  symptom: 'upgrade-project (template 0.30.0, engine from origin/main f8b2482a7) applied to co-security adds graft leftovers and widened permissions from templates/co-security/.claude/settings.json into a project that had none: statusLine.command and subagentStatusLine.command pointing at .claude/helpers/graft-statusline.cjs (missing in the project, breaks the status line), a graft footerLinksRegexes entry, and permission allows Bash(node dist/cli.js:*) (graft CLI), Bash(curl -sI *) and WebFetch(*). The project''s own settings restricted WebFetch to a domain allowlist (bun.sh, github.com, raw.githubusercontent.com, api.github.com, objects.githubusercontent.com, registry.npmjs.org, nodejs.org) and had no curl allow, so for a security engagement the result is a regression of web-access posture. The co-security template file carries 9 graft-matching lines; templates/common/.claude/settings.json has none. The same class of leftover was already fixed for templates/co-architect in PR #2007 (U-20261113-007); other variant templates may carry the same graft references and should be checked.'
