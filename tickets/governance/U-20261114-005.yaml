  symptom: >-
    The workspace asset-location contract exists only in prose and is not
    machine-enforced, allowing a second per-project convention to coexist with
    the canonical shared pool. agents/image-curator.md and agents/html-build.md
    both define the shared pool
    (presentations/assets/{images,diagrams,fonts,videos} bound via
    ../assets/...) as the single convention, yet (a) image-manifest.json /
    diagram-manifest.json path fields are consumed as-is by html-build without
    style or location validation — validate-image-manifest.ts checks
    content-hash uniqueness but not where files live; (b) legacy decks retain
    per-project layouts (soosan_group_2026 carries its own images/ and assets/),
    so follow-recent-decks heuristics can resolve to the wrong convention; (c)
    in the 2026-11-open-innovation-keynote engagement a PM-authored dispatch
    brief that said download into <project>/assets/ silently created deck-local
    images/, diagrams/, fonts/ and the drift was only caught by hand in
    html-build deviation report. Result: two asset conventions ship side by
    side, 20MB + 3.6MB of duplicated deck-local assets, and pool reuse dedup
    does not engage for those decks.
  affected_paths:
    - agents/image-curator.md
    - agents/html-build.md
    - agents/diagram-specialist.md
    - scripts/co-deck/validate-image-manifest.ts
  identity_source: cwd
  repro: >-
    1. Read agents/image-curator.md (line 29: download into the shared image
    pool at presentations/assets/images/) and agents/html-build.md (line 64:
    images are in the shared pool at presentations/assets/images/) — both agree.
    2. Dispatch image-curator with a brief mentioning project-local paths; the
    subagent writes project-local assets/images/ and a manifest with
