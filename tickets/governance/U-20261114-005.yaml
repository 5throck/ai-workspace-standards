    (it checks hash uniqueness, not path location/style). 3. html-build binds
    whatever path style the manifest carries, producing a deck with
    project-local assets while sibling decks use the shared pool. 4. Compare:
    presentations/2026-11-consumer-goods-market-shift (pool convention) vs
    presentations/2026-11-open-innovation-keynote and
    presentations/soosan_group_2026 (project-local convention). Suggested fix:
    enforce manifest path-style (must match presentations/assets/... /
    ../assets/...) and on-disk location in validate-image-manifest.ts; add the
    same location check for diagram-manifest; document the pool convention in
    the dispatch checklist so PM briefs cannot drift.
