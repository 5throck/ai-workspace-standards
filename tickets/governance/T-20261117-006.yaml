title: >-
  Pitch template runtime defect: buildBullets called but never defined — built
  pitch decks render zero slides and html-to-pdf exits 1 for ANY pitch deck.
  Evidence: built pitch deck (buildThemeDeck theme=pitch, style=classic,
  3-slide fixture, template test env) throws "buildBullets is not defined" at
  buildSlideChildren (deck HTML :1651) during initSlides in headless Chrome;
  document.querySelectorAll('.slide').length === 0 and
  document.querySelectorAll('section').length === 0 after load, so
  html-to-pdf exits 1 with the loud zero-slide error ("Tried both selectors:
  '.slide' ... and 'section' ... 0 matches for each") and writes no PDF.
  Cause: templates/co-deck/docs/html-themes/themes/pitch/template.html:219
  calls buildBullets(leftCol, data.bullets) inside the standard-slide branch
  but the helper is never defined anywhere in the template's inline runtime
  (grep: no `function buildBullets` in the file; byte-identical on origin/main
  282b91e54, verified during the PR-5 battery 2026-11-17). Impact: every pitch
  deck built from the current template is non-renderable at runtime and
  non-exportable via html-to-pdf on main; the ppt-engine-integration suite
  sidesteps it (it pins pitch only at the static/inlining level, and its
  rendered-DOM fixtures use zen), so the defect is invisible to the current
  test battery except via html-to-pdf pitch renders. Discovered by the PR-5
  folded-deferral spot-render pin (design
  docs/designs/2026-11-17-co-deck-pdf-followups-design.md §1.3, disposition
  DEC-20261117-04): the outlook spot-render passes (pages == slides) but the
  pitch spot-render cannot run; html-to-pdf.test.ts pins the static
  selector-safety fallback plus a blocker pin asserting the loud exit until
  this is fixed. Expected: define the missing buildBullets helper in the
  pitch template runtime (mirror the sibling templates' helper, e.g.
  zen/template.html's buildBullets) so pitch decks render their slides and
  html-to-pdf page count == slide count; add a measured pitch spot-render pin
  to html-to-pdf.test.ts replacing the static fallback. Affected:
  templates/co-deck/docs/html-themes/themes/pitch/template.html (primary),
  templates/co-deck/scripts/co-deck/tests/html-to-pdf.test.ts (pin swap).
  Not fixed in co-deck PR-5: fixing it would mean touching a 4th template
  file, outside that PR's 3-file scope.
