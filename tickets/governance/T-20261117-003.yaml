result: >-
  Fixed by html-to-pdf.ts 1.3.1 (co-deck PR-4, PR #2060): --pages now adds the
  cdk-page-hidden class to filtered slides AND the injected print CSS gains
  section.cdk-page-hidden, .slide.cdk-page-hidden { display: none !important }
  at 0,2,0 specificity (order-independent, beats the 0,1,0 .slide twin) — the
  inline display:none alone always lost to the stylesheet !important (v1.2.0
  latent, confirmed). Measured pin: --pages 2 renders exactly 2 pages (pdf-lib).
  Latent-since-v1.2.0 claim verified in the oldest tracked blob. Design §2.2,
  DEC-20261117-04.
