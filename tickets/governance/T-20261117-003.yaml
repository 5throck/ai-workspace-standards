title: >-
  --pages non-functional on div.slide decks (pre-existing v1.2.0 latent, R-A1
  anomaly B). Evidence: html-to-pdf --pages hides slides via inline
  `style.display='none'`, but the print CSS `.slide { display: flex !important;
  }` (v1.3.0 twin, carried over from the v1.2.0 `section` rule — verified via
  git show HEAD) overrides it. Result with --pages 5 on the 47-slide keynote:
  logged "Pages: 5" but actual PDF = 49 pages. Latent since v1.2.0; first
  manifests now that div.slide decks render at all. Expected: --pages filtering
  survives the print CSS (e.g. the !important selector also honors
  [data-page-hidden="true"]-style exclusion, or the filter adds a class the
  print block respects). Affected:
  templates/co-deck/scripts/co-deck/html-to-pdf.ts.
