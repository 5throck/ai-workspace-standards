title: >-
  learning: per-subject parameter consumption in valuation models — the
  store/consume gap (co-newbiz S8) — when a model gains a per-subject parameter
  (per-target WACC), the save layer can ship complete (storage, resolution API,
  UI) while every calculation consumer still flattens to the global rate via a
  base-object spread, skewing comparisons with no error raised. Kernels: (1)
  audit all consumers for global-resolution/...base flattening whenever a
  parameter grows a subject axis, (2) label the consumed scope in outputs and
  snapshots (wacc_scope, discount_rate.scope/subject_company_id) so skew is
  diagnosable, (3) define a per-subject-class scope-rule table with an explicit
  non-blocking fallback. Pollination: write-research:audit-xls section 3g/3h has
  no per-subject discount-rate-consistency check — add a checklist row.
  Evidence: co-newbiz PR #491,
  docs/designs/2026-10-10-s8-per-target-wacc-consumption-design.md, ADR-0156
  amendment 2. Class: financial-model correctness + audit-xls pollination
