  suspected_layer: L1
  symptom: >-
    The common CI workflow's install step is skipped in projects whose
    package.json is not at the repository root, leaving the audit job on Bun's
    implicit auto-install — and the step's comment describes a layout the
    template does not guarantee.
    templates/common/.github/workflows/ci.yml:32-38: comment says "package.json
    lives at the repository root, not under scripts/"; guard `if:
    hashFiles('package.json') != ''` skips `bun install`; then `bun
    scripts/audit.ts` runs. In co-safety there is no root package.json (the only
    one is scripts/package.json with its own bun.lock, lockfileVersion 1), so
    the install never runs and audit.ts executes on the auto-install cache.
    audit.ts is deliberately dependency-free for exactly this reason (comment in
    scripts/audit.ts:1332-1333), but the guard plus comment present the skipped
    install as a normal dependency step. Expected: the install step handles the
    scripts/-scoped layout, or the comment and guard state the dependency-free
    design explicitly. Reproduction: in a project without a root package.json,
    read the ci.yml audit job — install skipped, audit step runs directly.
  affected_paths:
    - package.json
    - scripts/package.json
    - ci.yml
  identity_source: cwd
