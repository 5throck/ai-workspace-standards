notes: >-
  Evidence: PR #954 first CI run failed on "VERSION_MANIFEST drift: 1 differing
  line(s)" and recovery required the convergence commit eb6901ab. Root:
  getGitTimestamp() derives Last Modified from committed git log while dev-sync
  generates the manifest (step 4.7) before the commit (step 6) — the committed
  manifest records the pre-PR date and CI merge previews see the PR commit,
  drifting across day boundaries. Fix per ADR-0081 Decision 1 /
  docs/designs/2026-09-18-delivery-pipeline-hardening-design.md §3.1: drop the
  shallow-only branch in generate-version-manifest.ts --check and mask
  header-derived Last Modified columns on both sides unconditionally; keep
  structural columns literal; add a comparator fixture test with a date-only
  diff. Rejected alternative: post-commit regen + amend.
