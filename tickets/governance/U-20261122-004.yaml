  symptom: >-
    scripts/spec-register.ts --file <design-doc> --status <status> silently
    drops the status when the spec already exists: registerSpec's existing-entry
    branch (~lines 248-255) refreshes last_updated but ignores options.status,
    while still printing "Updated: <id>" — the caller believes the status
    advanced (e.g. proposed→implemented at landing) but the registry stays
    stale. The sanctioned --update <id> --status path works, so the bug is
    specifically the --file path's ignored flag plus its success message.
    Expected: either apply options.status on the existing-entry branch or print
    "Updated (status unchanged — use --update <id> --status to advance)" instead
    of the plain success line.
  affected_paths:
    - scripts/spec-register.ts
  identity_source: cwd
  repro: >-
    1. Register a spec normally (creates entry with status proposed). 2. Later
    run: bun scripts/spec-register.ts --file docs/designs/<spec>-design.md
    --source manual --status implemented. 3. Output prints "Updated: <id>" but
    the entry's status stays "proposed": registerSpec's existing-entry branch
    (scripts/spec-register.ts:248-255) refreshes last_updated while silently
    ignoring options.status. 4. The sanctioned workaround is the separate
    --update <id> --status <status> path, but the --file path's success message
    actively misleads (real case: a status flip appeared to succeed, was
    recorded as implemented in a CHANGELOG entry, and the registry stayed
    proposed until a review caught it).
  triage: ready
