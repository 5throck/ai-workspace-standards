  symptom: >-
    A variant project cannot declare its own generators to run automatically at
    commit time, so generated projections can only be drift-gated, not
    auto-regenerated.


    Observed in co-newbiz (2026-10-29):

    - co-newbiz has several project-specific generated projections, each with
    its own generator:
      - the glossary data (`scripts/co-newbiz/generate-glossary-data.ts` → `app/web-next/lib/glossary-data.generated.ts`);
      - the library projection (`scripts/co-newbiz/sync-library-projection.ts`);
      - the wiki projection (`sync-wiki-projection.ts`);
      - the review matrix (`generate-review-matrix.ts`);
      - the PM catalog and the agent registry.
    - The variant audit hook (`scripts/co-newbiz/audit-variant.ts`) can only
    block on drift. When a source file changes (glossary YAML, docs, wiki
    pages), `/sync` fails at the audit gate. Someone then has to run the right
    generator by hand and re-run `/sync`.

    - This happened repeatedly in this session: library projection after doc
    edits, wiki projection, glossary data, skill graph.

    - `scripts/dev-sync.ts` and `.githooks/*` are template-managed, so the
    project cannot add a pre-commit generator step without a local patch that
    the next upgrade would overwrite.

    - The owner wants the glossary (and similar projections) to update
    automatically.


    Expected:

    - A template-supported way for a variant to declare its generators, for
    example a list in `variant.json` or a `scripts/<variant>/generators.json`
    manifest of `{ name, command, outputs, sources }`.

    - dev-sync runs those generators before its audit gate (in the same step
    family as VERSION_MANIFEST / skill-graph regeneration) and stages their
    outputs as pipeline-generated files.

    - The `--check` form of each generator remains the audit's drift gate.
  affected_paths:
