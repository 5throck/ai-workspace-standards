  symptom: >-
    Follow-up to U-20261028-002, at the owner's request (2026-10-28): the
    recurring agent-mirror drift is a symptom of platform-specific knowledge
    living in individual project scripts instead of the workspace.


    Observed:

    - Each platform (Claude Code, Gemini CLI, Codex, Antigravity, Hermes,
    generic `.agents`) accepts different agent-definition fields and model
    identifiers. For example, Claude Code reads only
    `name`/`description`/`model` with model aliases sonnet/opus/haiku and
    ignores `tier`. Gemini expects literal model IDs.

    - These platform rules are encoded ad hoc. In co-newbiz they live in a
    project-local script (`scripts/co-newbiz/sync-agent-personas.ts`, not
    template-managed), with a hard-coded tier→alias map and an outdated
    frontmatter shape. When the SSOT frontmatter changed shape, the project
    script silently produced wrong mirrors (every `model:` line deleted), and
    nothing at workspace level detected it.

    - Only `.claude/agents/` has mirrors. Whether other platforms need generated
    agent definitions, and in what format, is not recorded anywhere. Every
    project has to rediscover it.

    - The same class of problem has recurred for other platform surfaces:
      - skills mirrored to five platform dirs;
      - command parity between `.claude/commands` and `.gemini/commands`;
      - the model registry comment checks.

    Expected:

    - The workspace owns a per-platform capability/adapter definition: which
    surfaces each platform supports (agents, skills, commands, hooks), the
    accepted fields per surface, and the model-identifier format resolved from
    the models registry by tier.

    - One template-managed generator projects `agents/*.md` (SSOT,
    platform-neutral `tier` only) into every platform that supports agent
    definitions.

    - A blocking parity/drift gate runs in every project's audit across the
    fleet, so a change to the SSOT shape or a platform's rules fails loudly
    instead of corrupting mirrors.

    - Project-local copies of this logic are retired in favour of the template
    version.
