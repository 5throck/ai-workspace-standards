  suspected_layer: L2
  symptom: >-
    The deck background model has no first-class notion of chapter/section
    background groups. `background_image.scope` supports only individual |
    divider-cover | all, so a deck that wants each chapter's content slides to
    carry that chapter's own photo cannot express it: the only path is per-slide
    backgroundImage injection outside the manifest, and registering those
    bindings in image-manifest.json is rejected by validate-image-manifest rule
    3 (many-to-one reuse of one pool file across N slides is treated as a
    duplicate-content ERROR — legitimate for accidental duplication, wrong for
    an intentional chapter backdrop). Consequence observed 2026-11-14: with
    scope "all" every standard slide rendered the same global photo ("일반 장표의 배경
    이미지가 모두 같게" per the client), and the fix had to bypass the manifest entirely
    (generator CHAPTER_BG table + deck patch script), leaving the mapping with
    no validator coverage. Requested capability: a chapter/section-scoped
    background group (e.g. background_image.chapters[] mapping section → slug,
    expanded by the build; validator accepts a registered chapter group as
    non-duplicate), plus html-build SKILL guidance on when content-slide
    backgrounds are appropriate vs the global backdrop.
  affected_paths:
    - scripts/co-deck/validate-image-manifest.ts
    - docs/html-themes/themes/zen/theme.json
    - .agents/skills/html-build/SKILL.md
  identity_source: cwd
  repro: >-
    1. In a deck project, assign one pool photo to all content slides of chapter
    1, another to chapter 2, etc. (65-slide assignment observed in
    deliverables/2026-11-ai-era-business-survival today). 2. Attempt to register
    those bindings in image-manifest.json slides[]: validate-image-manifest.ts
    rule 3 fails with "duplicate image across slides … identical content hash"
    for every repeated photo, exit 1. 3. Workaround used locally: keep the
    mapping only in the slidedata generator + a patch script, leaving manifest
    notes to describe it — so no machine gate protects the mapping from drift.
