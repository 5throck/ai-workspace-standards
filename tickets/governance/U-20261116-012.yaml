    Two re-run hygiene defects in the core sync pipeline (scripts/dev-sync.ts, L1-owned, standardized across templates), observed 2026-11-16 while landing an 82-file change through repeated /sync runs in Projects/co-architect (PR #399) after mid-pipeline failures.

    (1) Tracked-but-ignored paths crash step 6 fatally. The variant ships `.zcode/` in .gitignore while `.zcode/config.json` has been tracked since PR #195. The S0/S1 snapshot sweep re-adds dirty paths, and `git add .zcode` fails fatally ("The following paths are ignored by one of your .gitignore files: .zcode — Use -f") — the sync dies at commit-prep even though the task-staged set is complete and valid in the index (git add -u had staged it fine). Expected: the sweep detects tracked-but-ignored paths and either stages them with -f, or WARNs and skips them, instead of a fatal error. Alternative root fix at the template layer: .gitignore negations for deliberately tracked config files under ignored directories.

    (2) Step 2 appends a duplicate memory session-summary block on every re-run. A mid-pipeline failure followed by another /sync on the same day/branch appended three near-identical "## Session Summary" blocks to memory/YYYY-MM-DD.md (one per attempt: 79-file, 82-file, 82-file), which had to be deduplicated by hand. Expected: step 2 replaces or dedups its own pending session block for the same branch/run before appending.
