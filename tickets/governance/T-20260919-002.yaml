result: >-
  Observation recorded during the T-20260918-004 sweep: every new
  project-local script (co-newbiz job-worker.ts etc.) blocks its project's
  audit with "Unregistered script" until someone hand-writes a SCRIPTS.md row
  in the right table format. verify-scripts.ts 1.6.1 → 1.7.0 adds `--fix`:
  appends one Registry row per unregistered script directly after the last
  Registry table row — version from the script's @version header, today's
  date, placeholder description for the author to fill. Layer/source columns
  follow the detected context layer. Primitives exported for unit tests:
  extractHeaderVersion, buildFixRow, insertRowsIntoRegistry (7 tests in
  tests/unit/verify-scripts-fix.test.ts). --generate remains the whole-file
  draft mode; --fix is incremental and non-destructive.
