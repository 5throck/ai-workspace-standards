  symptom: >-
    The delivered external-dependency machinery (scripts/lib/external-deps.ts
    v1.0.0) accepts only git-based install templates: argv[0] must be "git",
    single argv, no shell metacharacters, and entries require a 40-hex commit
    field; unknown fields are rejected. This structurally blocks registering
    non-git dependencies: (1) npm-registry-pinned packages (consumer needs
    install "bun add --cwd {dir} <pkg>@{pin}" with bin at node_modules/.bin/,
    integrity anchor = npm dist.integrity sha512 hash instead of a git commit),
    and (2) GitHub release binary assets (install = release-asset download +
    SHA256 verification against SHA256SUMS; anchor = release tag + asset
    checksum). Reproduction: add an external-deps.json entry with install "bun
    add --cwd {dir} kordoc@4.24.51" or a curl release-asset template, or add an
    optional "checksum" field — the validator rejects each. Needed: bounded
    extension admitting non-git install templates, an optional checksum field,
    and registry/release pin checks, per the workspace external-deps machinery
    design §6 which deferred non-git forms ("nothing structurally blocks" the
    template form).
