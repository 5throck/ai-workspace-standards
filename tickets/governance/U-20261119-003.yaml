  symptom: 'dev-sync step 3.8 (archive-memory.ts) moves memory/*.md files older than 7 days into memory/archive/, but the template .gitignore excludes memory/archive/ ("local preservation only"). For a tracked memory file this deletes it from the repository, and any docs/decisions/DEC-*.md whose frontmatter knowledge_refs references the live path then fails validate-decisions (step 3.96b) with "knowledge_refs path ... does not exist" — on every machine and on every future run, because the archive copy is untracked and a fresh clone has neither path. validate-decisions.ts already special-cases archived governance tickets (tickets/governance/archive/<id>.yaml) but has no equivalent for memory/archive. Observed in Projects/co-newbiz on 2026-11-19: DEC-20261110-01 and DEC-20261111-02 blocked the pipeline after step 3.8 archived memory/2026-11-11.md and two meeting-*.md files.'
