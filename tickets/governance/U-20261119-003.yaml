  repro: '1. In a project scaffolded from the template, accumulate memory files dated more than 7 days ago (e.g. memory/2026-11-11.md) and a docs/decisions/DEC-*.md whose frontmatter knowledge_refs references that memory file. 2. Run dev-sync: step 3.8 moves the memory file to memory/archive/. 3. .gitignore excludes memory/archive/, so the tracked file is deleted from the repo (only an untracked local copy remains). 4. Step 3.96b validate-decisions reports "knowledge_refs path memory/<name>.md does not exist"; on a fresh clone both paths are missing so every future run fails at the gate until hand-editing. Same class for DEC records referencing memory/meeting-*.md once mtime exceeds 7 days.'
