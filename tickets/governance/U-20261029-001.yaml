  symptom: >-
    The new agent-mirror parity gate (sync-agent-mirrors.ts v1.0.0, wired into
    audit.ts as a FATAL gate) hard-errors in detached project checkouts: it
    resolves extends-stub personas by walking up for templates/common/agents,
    which exists only in workspace checkouts. A delivered project's CI (ubuntu
    runner, single-repo checkout) therefore fails the Documentation Audit on
    every run after the delivering commit — the PR carrying the gate cannot
    merge and the project's CI is permanently red. The script's own help says
    the repair is "pass --templates-root <workspace>/templates, or run inside a
    workspace checkout", but audit.ts invokes it without flags and ci.yml
    modification is a protected surface. Expected: in detached L3 checkouts
    without a resolvable templates root the gate degrades to an explicit [SKIP]
    (like design-lint / validate-agents' validators guard — the same class was
    fixed for validate-agents 1.4.1 / validate-skills 1.5.2 in commit 346c743),
    or the gate/CI wiring supplies a self-contained persona resolution path.
  affected_paths:
    - scripts/sync-agent-mirrors.ts
    - .github/workflows/ci.yml
  identity_source: cwd
  repro: >-
    In any detached L3 project whose local checkout has no workspace templates/
    ancestor: run `bun scripts/sync-agent-mirrors.ts --check` — ERROR
    templates/common/agents not found. Same run passes inside the workspace
    checkout (templates root found by ancestor walk). CI evidence: PR #227
    Documentation Audit failure 2026-10-28T22:25Z, exit code 1.
