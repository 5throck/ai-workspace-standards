result: >-
  Fixed by the check-mode stub degrade (PR #1727, sync-agent-mirrors v1.3.0;
  supersedes the v1.2.0 blanket guard which both concealed real drift among
  verifiable mirrors and still hard-threw on absent mirrors): per-agent
  semantics — an existing stub-derived mirror in a detached checkout is
  UNVERIFIABLE (WARN listing the file + the repair line, exit 0; stdout so the
  audit arm's WARN-grep surfaces it), a missing stub mirror is real
  missing-drift (exit 1 — presence is always enforceable), non-stub mirrors
  compare normally everywhere, write mode still hard-errors. Verified on a
  detached git-archive checkout of co-newbiz main: baseline exit 1 → v1.3.0 exit
  0 with 39-in-parity + 2 unverifiable WARNs; deleted non-stub mirror → exit 1.
  Same defect class as T-20261029-008 (fixed #1709); this closes the
  stub-carrying-project half. Delivery to co-newbiz rides the next upgrade
  delivery of the script (its current v1.1.0 local copy predates v1.1.1+/1.3.0;
  its CI is not currently running the gate — the canary install carried no audit
  arm).
