  symptom: 'PDF export does not match the HTML deck in four ways (found exporting 2026-11-open-innovation-keynote, zen x white-bubble, 47 slides). (1) html-to-pdf.ts reports ''Total sections: 0'' and writes a 21 MB 0-page PDF with exit 0 — it captures <section> elements, but zen renders slides as div.slide. (2) gen-slides-pdf.ts reads only slideData.footnotes; source/caveat lines kept in a separate `notes` field (needed so abbreviations render outside the card and sources inside, per the co-deck abbreviation-footnote contract) are silently absent from the PDF. (3) Punchline: a title containing ''\n'' (HTML inlineTitle renders it as a line break) or U+2060 word joiners renders as overlapping text in the PDF; using text/sub instead works but the sub line renders far smaller than in HTML. (4) Contact slide: HTML renders `bullets`, the PDF renderer reads only contactName/contactEmail/contactLinkedIn/contactPhone/contactNote, so a bullets-only contact slide prints just its title. Expected: html-to-pdf either supports div.slide or fails loudly; gen-slides-pdf renders `notes`, multi-line punchlines and bullet contact content with HTML parity.'
