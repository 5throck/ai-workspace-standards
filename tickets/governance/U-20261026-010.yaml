    A variant project's /sync is blocked at dev-sync step 3.7 (verify-scripts
    --check-drift) by workspace-side template activity unrelated to the
    project's change set. Observed 2026-10-26 in the co-design project: after
    the workspace root auto-released template v0.21.0 (51 delivered paths), the
    project's /sync aborted at step 3.7 with an L0/L1 drift table (1
    equal-version content divergence + 4 version-skewed pairs) even though the
    project's own audit.ts passes 470 PASS / 0 FAIL and the staged change set
    touches no scripts. Running the same --check-drift from the workspace root
    itself reports all pairs in sync, so the divergence only exists between the
    project's scripts and the workspace L1 copies — a state that the sanctioned
    resolution (receive the new delivery, or propagate:apply at the workspace
    root) cannot be executed by the project session: propagate:apply at the
    workspace root would overwrite the newer L1 content (3 of the 4 skewed pairs
    have L1 ahead), and receiving the delivery is gated on a separate open
    upstream issue about sync clobbering project-owned files. The check resolves
    the parent workspace from the project directory, so any workspace-side
    release can stall every project's sync until that project receives a
    delivery; there is no bypass or downgrade env for step 3.7 (T-20260912-009
    made it blocking by design; dev-sync documents "no generic skip pattern").
    Requested consideration: scope the project-context drift comparison to
    change-set-relevant scripts, distinguish L1-ahead version skew (delivery
    pending) from L0-ahead drift with a WARN instead of a block, or provide a
    documented escape for project contexts whose divergence is explained by a
    workspace release newer than the project's last received delivery.
