  symptom: >-
    For pitch-enhanced + premium-dark decks, the PDF from gen-slides-pdf.ts does
    not match the built HTML deck. HTML draws every slide inside one rounded
    .slide frame on a darker page. Standard slides there are a two-column grid:
    section eyebrow above a left-aligned title, `**bold**` bullet runs in accent
    color, and a right panel with the image plus its .cdk-caption. The PDF
    instead draws a header bar with the section in the top-left corner, a
    separate centered text card, plain white bullets, a full-height visual panel
    without the caption, a punchline that wraps (no first-line accent, extra
    quote mark), a contact slide without its image, and footnotes outside the
    frame. Locally fixed with an opt-in `frame` block in the theme
    pdf_layout_spec.json plus framed renderers (standard/contact/title/divider,
    punchline and video tweaks, footnotes, frame mask). Code is marked
    `LOCAL-PATCH(upstream-request: PENDING-FRAME)`.
