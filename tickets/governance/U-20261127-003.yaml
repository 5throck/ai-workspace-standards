  -> v1.2.0 (twin templates/common/scripts/lib/ssrf.ts byte-identical), spec
  docs/designs/2026-11-27-safefetch-headers-design.md (registered approved;
  threat analysis: Host/SNI-pin break, smuggling via framing headers,
  connection/upgrade semantics, proxy interference, CRLF injection). Mechanism:
  optional init.headers?: Record<string,string> on safeFetch/fetchPinned routed
  through http(s).request's structured headers option; case-insensitive
  deny-list (exact: host, content-length, transfer-encoding, connection,
  upgrade, te, trailer, expect, via; prefix: proxy-*, forward*) throws typed
  SSRFHeaderBlockedError naming the offending header; CR/LF/control-char regex
  on names/values; header validation precedes validateUrl (zero DNS/network on
  rejection). Allowed: auth/UA/custom application headers pass through verbatim.
  Guard core byte-for-byte unchanged; absent-init behaviour identical to v1.1.1;
  method stays GET in v1. Tests: tests/unit/ssrf-safe-fetch.test.ts v1.1.0 (13
  deny entries, 7 case-mix, CRLF name/value, control chars, allowed pass-through
  with Host pin, absent/{signal}-only unchanged) — 35 pass in-file; full unit
  suite 5377 pass; typecheck 0; audit/lifecycle-sync-audit green; canary
  consumer shape ({signal} audit.ts:613) 200 unchanged. Landed as PR #2209
  (merge 5833a0eb9, 4/4 checks SUCCESS first try, ledger row order 33 --kind
  real). Note for requester: co-newbiz's DART adapter can pass its auth/UA
  headers via init.headers after adopting the current ssrf.ts at its next
  upgrade visit; the CIDR rider was already resolved by v1.1.1 (U-20261031-003).
