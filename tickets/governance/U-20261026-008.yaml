  symptom: 'playground/package.json token-compile scripts invoke "bun ../../scripts/compile-tokens.ts ... || bun ../../../scripts/compile-tokens.ts ...". In an instantiated co-design project neither path is the project''s own compiler at ../scripts/compile-tokens.ts: ../../scripts/ does not exist, and ../../../scripts/compile-tokens.ts resolves OUTSIDE the repository (it only works on machines where the checkout happens to be nested under a workspace root that has scripts/compile-tokens.ts — an unversioned, out-of-repo dependency for the token SSOT pipeline). On any other clone layout both paths miss and bun run dev / bun run build die at the predev/prebuild hook. playground/README.md states the paths assume the compiler at <project>/scripts/compile-tokens.ts, which does not match the script as written. Fix direction: make ../scripts/compile-tokens.ts the primary path (keep the workspace path as documented fallback) and correct the README.'
