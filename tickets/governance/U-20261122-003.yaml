    memory/*.md prose against docs/decisions/ — so a decision record that was
    ruled but never filed (the exact ADR-0061 gate failure mode) passes the gate
    green. Real instance: co-security cited DEC-20261121-02 (gate-② reversal) in
    CHANGELOG + two memory logs for a day+ with no
    docs/decisions/DEC-20261121-02.md, while syncs reported "validate-decisions:
    0 warnings". Expected: a check that scans CHANGELOG.md + memory/*.md (flat
    logs) for DEC-YYYYMMDD-NN tokens and fails/warns when the referenced file is
    absent in docs/decisions/.
  affected_paths:
    - scripts/validate-decisions.ts
  identity_source: cwd
  repro: >-
