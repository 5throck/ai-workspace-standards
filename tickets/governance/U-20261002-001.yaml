result: >-
  Root cause confirmed live: the default unit-tests job installed only the root
  lockfile while tests import from app/web-next (own bun.lock). Fixed
  generically in templates/common ci.yml (workspace PR #1303, lands next
  release): the Install step now also runs bun install --frozen-lockfile in
  every nested lockfile directory (5 other projects had the same latent
  breakage). Delivered to co-newbiz (PR #445) - the reported 'Cannot find module
  next/server' is gone from the post-merge run. Residual python-dependent test
  failures in the default Bun-only job are a separate, expected limitation;
  co-newbiz now sets CI_SKIP_DEFAULT_UNIT_TESTS=true and keeps its green
  project-owned Unit + Script Tests job.
