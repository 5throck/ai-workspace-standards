  symptom: >-
    The opt-in workspace `unit-tests` CI job (ci.yml line ~98, outside the
    PROJECT-JOB markers) runs only root `bun install --frozen-lockfile` (line
    ~136) and then `bun run test:unit`. In co-newbiz, unit tests import
    app/web-next/lib modules that need dependencies installed in app/web-next
    (for example next/server via lib/envelope.ts), so the job fails with "Cannot
    find module 'next/server'" in CI while the same suite passes locally and
    passes in the project "Unit + Script Tests" job, which does run `bun install
    --frozen-lockfile --cwd app/web-next` (line ~163). Expected: the workspace
    unit-tests job either installs project workspace dependencies when present,
    or documents that projects whose unit tests reach a workspace app must use
    the project-jobs section instead. ADR-0094 introduced this job.
  affected_paths:
