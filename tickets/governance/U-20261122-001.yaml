    (default-on). 2. scripts/test-runner.ts:335 does if (!existsSync(suite.dir))
    return files; — fail-open: zero test files discovered. 3. The job passes
    green despite running zero tests; registry rows claiming "Unit-pinned by
    tests/unit/*.test.ts" (e.g. detect-backport 26 tests) are unverifiable
