    narration, e.g. '기업 기능의 약 10%' (= 'business functions'), '$3B 워스', '선불 럼프섬',
    'Buy 답', '워크플로우 미재설계', '규제 통행증', '질문에 걸리는 기술 위치', English labels like '2
    Front War', and '표본' for '사례' throughout. (2) Narration numbers that
    contradict the slide: script said '1천5백억 달러 규모의 금융 백스톱' while the slide/SVG
    said $105B. (3) Relative dates in narration not computed from the
    presentation date: an event dated 2026-08 narrated as '작년 8월' in a 2026-11
    deck. (4) Asset claims not checked against files: two video slides stated
    'mp4·한국어 자막 확보 완료' (and storyline.md said subtitles were localized) but no
    assets/videos/subs/yt-<id>.ko.vtt sidecars exist; inject-video-players
    reported 'no subtitle sidecars found'. Expected: each class is caught before
    Gate 2 / before build, not by the end user.
