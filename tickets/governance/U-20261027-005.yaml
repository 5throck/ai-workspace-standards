    The DESIGN-R2 theme-invariance rule (theme presets in tokens.json may
    override only color and shadow tokens;
    typography/spacing/borderRadius/target-size are theme-invariant — documented
    in design-tokens.template.css and variant design docs) has zero machine
    enforcement in the L1 tooling. scripts/compile-tokens.ts extractThemes
    (about lines 207-240) accepts any key tree under "themes" and compiles it
    silently into [data-theme] blocks — a theme preset adding a typography or
    spacing override would ship without a diagnostic. Simultaneously
    scripts/design-lint.ts skips the themes branch entirely (TOKEN_SKIPPED_KEYS
    includes "themes", line ~130; walker ~398-404), so the linter can never see
    a violation either. The rule lives only in prose; nothing fails when a
    preset breaks it. Requested consideration: fail compilation (or emit an
    error-level lint finding) when a theme preset contains any top-level group
    other than color/shadow, or add a deliberate themes-reading sub-check to
    design-lint.
