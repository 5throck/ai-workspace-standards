result: >-
  Confirmed and fixed on both sides. Defect locus is the generator, not the
  gate: sync-library-projection.ts embedded sources via JSON.stringify, which
  serializes a real CRLF as the escape sequence \r\n — invisible to the
  file-level normalize(), so a CRLF checkout read as stale (reproduced: CRLF
  source -> --check exit 1, LF -> exit 0). co-newbiz fix:
  sync-library-projection.ts v1.3.1 normalizes each source read to LF +
  subprocess CRLF regression test (PR 5throck/co-newbiz#962). Workspace audit
  found no runDriftGate twin (the helper is local to co-newbiz's
  audit-variant.ts); two analogous L0 gates were genuinely vulnerable and are
  fixed: generate-scripts-mirror.ts v1.1.1 (both-CRLF reported drift on an
  unchanged span) and sync-agent-mirrors.ts v1.3.1 (mixed-EOL projection vs CRLF
  mirror). Root cause for delivered projects: templates/common/.gitattributes
  lacked eol=lf for *.yaml/*.ts/*.toml — now matches root. Workspace PR
  5throck/ai-workspace-standards#2146, CI green incl. windows-latest.
