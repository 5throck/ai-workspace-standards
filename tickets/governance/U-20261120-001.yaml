    scripts/helpers/memory-union-verify.ts (invoked at dev-sync step 3.88)
    reports a merge-dropped memory session block (owedBlocks, computed from the
    merged blob) even after the block is restored verbatim, when a same-branch
    sync pipeline is re-run following a one-side-taken merge. repairedAtHead
    demands the full parent-union in the worktree, but the merged blob already
    contains the theirs-side block, so it is never "owed" by step 2's sparing
    logic — restoring the demanded block then re-runs the same finding
    (restore-then-re-collapse loop). Convergence required 3 pipeline iterations
    with a non-obvious escape: restoring the demanded block WITHOUT its
    `dev-sync:session` marker line (marker-less blocks are accepted by
    parseBlocks and are not targeted by step 2's branch-keyed replace), plus
    collapsing a doubled separator left by the earlier collapse to pass
    well-formedness. Expected: step 3.88 should converge in one pass —
    owedBlocks vs repairedAtHead should use one consistent definition of what
    the worktree must contain (the parent union), and restored marker-less
    blocks should not alternate between owed/not-owed across re-runs.
