    WITHOUT its `dev-sync:session` marker line (parseBlocks accepts marker-less
    blocks; the branch-keyed replace in step 2 only targets markered segments,
    so it is not re-collapsed), then fix the resulting doubled separator to
    satisfy well-formedness.
