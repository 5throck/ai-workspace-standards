  symptom: 'In templates/co-deck/scripts/co-deck/tests/theme-visual-regression.test.ts (0.2.0), the suite fails with an opaque assertion when the Playwright npm package is installed but its Chromium browser binary is not. Observed on a macOS machine with playwright 1.63.0 in node_modules and no ms-playwright cache: `compare 27 pairs with existing baselines` fails `expect(result.total).toBeGreaterThan(0)` (received 0), because the browser subprocess prints "Failed to launch Chromium: Executable doesn''t exist at .../chromium_headless_shell-1243/..." and exits 1 without a RESULT payload. Expected: an explicit skip naming the missing dependency, as the sibling render tests do for pdftoppm/pdftotext. Root cause: `checkPlaywrightAvailable()` only calls `require.resolve(''playwright'')`; it never checks that a browser executable exists. The co-deck project copy is byte-identical to the template and fails the same way. Note this is not a baseline mismatch: the comparison never ran.'
