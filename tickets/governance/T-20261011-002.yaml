title: >-
  validator-hardening: VA-08 checkVariantPackageContract crashes uncaught when
  templates/common/package.json is unparseable — the guarded block records the
  'common' fail but the per-variant verdict re-parses the same file unguarded,
  throwing SyntaxError at the first variant and destroying triage (remaining
  variants unchecked, no issues summary). Fix: parse common once, cache the
  parsed result, reuse per variant, early-return when the common parse already
  failed. Also removes the per-variant double parse. Evidence:
  scripts/validate-templates.ts checkVariantPackageContract, Slot C 2026-10-11
