  symptom: >-
    Agent persona SSOT and platform mirrors disagree on the model/tier fields,
    and persona sync deletes the per-agent model.


    Observed in co-newbiz:

    1. `scripts/co-newbiz/sync-agent-personas.ts` derives the Claude `model:`
    from a nested `tier: { claude: high|medium|low }` field (regex
    `claude:\s*(high|medium|low)`). The agent SSOT files `agents/*.md` now use a
    flat `tier: high|medium|low` field, so no tier is found and the regenerated
    `.claude/agents/*.md` mirrors are written without a `model:` line. All 40
    mirrors lose `model:` on every run. Without `model:`, Claude Code falls back
    to the parent session's model, so Low and Medium tier agents run on the top
    model.

    2. `agents/*.md` frontmatter carries both `tier: high` and `model: inherit`.
    That is two sources for one fact, and the values contradict each other: a
    high tier implies a specific model, while inherit means the parent session's
    model.

    3. Only `.claude/agents/` has generated agent mirrors. `.gemini/`,
    `.codex/`, `.agents/` and `.hermes/` have no agent mirror directories. It is
    unclear whether those platforms read `agents/*.md` directly or whether their
    mirrors are missing, so platform parity of agent definitions is not
    guaranteed or checked.

    4. `sync-agent-personas --check` reports every mirror as drifted, so the
    drift check cannot catch real divergence.


    Expected:

    - `agents/*.md` is the single source of truth and carries a platform-neutral
    `tier` only, with no `model` field.

    - Each platform mirror is generated from it, with the platform model value
    resolved from the tier through the models registry (Claude: high=opus,
    medium=sonnet, low=haiku; Gemini: registry model IDs).

    - Every platform that supports agent definitions gets an equivalent mirror.

    - A blocking drift check keeps the mirrors identical to the SSOT.


    The owner asked for this fix to apply to the template and the whole fleet,
    not only co-newbiz.
  affected_paths:
    - scripts/co-newbiz/sync-agent-personas.ts
    - agents/
    - .claude/agents/
    - .gemini/
    - .codex/
    - .agents/
    - .hermes/
    - scripts/validate-model-registry.ts
    - docs/workspace-schema.json
  identity_source: client_roots
  repro: >-
    In co-newbiz on main (2026-10-28):

    1. Confirm `.claude/agents/valuation-agent.md` contains `model: opus`.

    2. Run `bun scripts/co-newbiz/sync-agent-personas.ts`.

    3. `grep -c '^model:' .claude/agents/*.md`: the line is removed from all 40
    files.

    4. `agents/valuation-agent.md` frontmatter shows `tier: high` and `model:
    inherit` together.

    5. `ls -d .gemini/agents .codex/agents .agents/agents .hermes/agents` finds
    no agent mirror directories.


    Local handling: co-newbiz has not run the sync wholesale. In PR #761, only
    the five changed persona mirrors were edited by hand, keeping their existing
    `model:` lines.
