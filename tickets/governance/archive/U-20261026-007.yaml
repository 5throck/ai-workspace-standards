  suspected_layer: L1
  symptom: >-
    scripts/verify-readme-sync.ts builds variantDirs exclusively from a
    repo-root templates/ directory (existsSync('templates')). Instantiated
    variant projects have no templates/ directory, so runUserGuideHashAudit()
    iterates an empty list and always prints "[SKIP] No user-guide pairs found."
    The docs/user-guide.md vs docs/user-guide_ko.md translated_from_hash gate
    therefore cannot fail at project level: scripts/audit.ts does not invoke
    verify-readme-sync at all, and the only invocation
    (scripts/hooks/pre-commit.ts) runs the no-op leg. A project could edit the
    English user guide without retranslating the Korean twin and no gate fails.
    Fix direction: seed the user-guide audit with the project-local pair (cwd
    ".") when templates/ is absent, mirroring how REQUIRED_DIRS already includes
    "." for the README leg.
  affected_paths:
    - scripts/verify-readme-sync.ts
    - scripts/hooks/pre-commit.ts
    - docs/user-guide.md
    - docs/user-guide_ko.md
  identity_source: cwd
