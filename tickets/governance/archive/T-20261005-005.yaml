title: >-
  governance-hygiene: one-file-per-spec storage — make
  docs/specs/entries/<id>.json the SSOT and docs/specs/registry.json a committed
  generated projection. Follow-up to T-20261005-002 (canonical order, merged as
  PR #1425): sorted insertion removed the deterministic tail conflict, but two
  registrations whose ids fall into the same alphabetical gap (typically
