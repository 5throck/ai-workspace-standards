  symptom: >-
    Template-delivered docs/workspace-schema.json configures
    designLint.scanRoots as ["templates/co-design/playground/src"]. Instantiated
    variant projects have no templates/ directory, so scripts/audit.ts
    (checkDesignLint, about lines 1726-1756) takes roots only from the schema
    when the schema file exists, filters by fs.existsSync, gets an empty list,
    and emits Skip("Design-lint gate: no configured scan roots present"). The
    skip is reported as a sanctioned verdict, so the variant's declared
    operative verification gate number 2 never runs in audit or in CI (the CI
    audit job runs the same script). A standalone bun scripts/design-lint.ts
    would scan playground/src because design-lint.ts's own uiSourceRoots default
    includes it — the two consumers of the same schema disagree on roots. Fix
    direction: default scanRoots to the project-relative playground/src in the
    delivered schema, or make audit.ts fall back to design-lint's conventional
    roots (or fail loudly) when configured roots do not exist, instead of
    silently skipping.
  affected_paths:
    - docs/workspace-schema.json
    - scripts/audit.ts
    - scripts/design-lint.ts
  identity_source: cwd
