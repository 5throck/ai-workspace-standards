  symptom: >-
    templates/common/.claude/settings.json allow list ships Bash(npx graft:*)
    and Bash(node dist/cli.js:*). npx graft:* resolves the graft package
    remotely at run time, so a registry compromise or typosquat resolution
    change executes unprompted code with user privileges (supply chain, ATT&CK
    T1195.002). node dist/cli.js:* auto-runs whatever is currently built in
    dist/, so a tampered build is silently executed. Fix direction: install
    graft as a pinned devDependency and allow its local binary subcommands; drop
    the npx-mediated entry; scope dist execution to the specific subcommands
    actually used.
  affected_paths:
    - .claude/settings.json
