    scripts/validate-md-language.ts has three perimeter gaps in the language
    policy enforcement. (a) Dead protected-path entry: the protected-paths list
    (~line 236) matches /^Hermes\.md$/ case-sensitively, which never matches the
    actual root file HERMES.md — currently harmless (no Hangul in that file) but
    the protection intent is dead code. (b) English originals of the bilingual
    twins are unscanned: no pattern in officialPatterns (~lines 206-242) matches
    root README.md, docs/README.md, or docs/user-guide.md, so a stray Korean
    sentence introduced into the EN originals never fails validation (the KO
    twins are guarded only for the user-guide pair via the hash sync, and the
    README pair's hash check does not scan language). (c) Unenforceable
    declarations: the suffix-locale declaration gate (~lines 470-486) runs only
    on files passing isOfficialDocument, so lang: ko declarations in
    README_ko.md, docs/user-guide_ko.md, and docs/README_ko.md are
    convention-only, whereas agents/ and skills/ README twins ARE gated.
    Requested: fix the HERMES.md regex to case-insensitive, add officialPatterns
    entries for the EN originals, and extend (or explicitly accept) the
    declaration-gate perimeter.
