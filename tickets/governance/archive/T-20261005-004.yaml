title: >-
  validator-hardening: validate-md-language.ts inline-code stripper assumes
  single-backtick delimiters (`/`[^`]+`/g`) and cannot parse CommonMark
  double-backtick inline code (`` `x` ``). Observed 2026-10-05: a CHANGELOG
  entry using double-backtick markup left stray unpaired backticks whose global
  regex pairing swallowed/exposed later spans, unmasking Korean that lives
  inside intentional inline-code tokens in older entries and failing the
  language gate on an English-only edit (false positive; the same file passes
  without the new entry). Direction: strip multi-backtick code spans (lazy
  ``...`` match) BEFORE the single-backtick pass so delimiter runs are consumed
  whole, plus a regression test pinning (a) double-backtick spans containing
  Korean are exempt and (b) Korean outside code spans still fails. Acceptance: a
  CHANGELOG-style file whose only Korean sits inside double-backtick inline code
  passes the validator; Korean in plain prose still fails.
