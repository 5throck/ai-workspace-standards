  symptom: >-
    Skill-directory names are embedded unsanitized into a bun -e JavaScript
    payload in scripts/skill-session-review.ts (line ~180): const triggers =
    await $`bun -e "const
    m=require('js-yaml');...readFileSync('skills/${skill}/SKILL.md','utf8')..."`.
