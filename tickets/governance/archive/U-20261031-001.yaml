    (touchedSkills(), lines ~137-146) where the segment regex [^/]+ accepts
    quotes and $() sequences, so a maliciously-named working-tree directory
    under skills/ breaks out of the string literal and executes arbitrary
    JavaScript during /sync. Secondary issue at line ~158: new
    RegExp(`...${skill}...`) is regex-injection from the same source. This
    affects every variant project instance since the file is template-managed.
  affected_paths:
    - scripts/skill-session-review.ts
  identity_source: cwd
  repro: >-
    1. Create a working-tree directory
    skills/x'-require('node:child_process').execSync('id >
    /tmp/pwned');'\/SKILL.md (regex
    ^(?:skills|\.agents\/skills)\/([^/]+)\/SKILL\.md$ admits quotes and
    metacharacters via [^/]+). 2. Run bun scripts/skill-session-review.ts
    (invoked from scripts/dev-sync.ts during /sync). 3. The directory name is
    interpolated into the bun -e JavaScript payload and executes on the
    developer workstation with full local privileges.
