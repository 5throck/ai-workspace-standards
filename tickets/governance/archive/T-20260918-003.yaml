result: >-
  Implemented per ADR-0081 Decision 3 /
  docs/designs/2026-09-18-delivery-pipeline-hardening-design.md §3.3.
  tests/unit/intentional-duplicate-parser.test.ts 1.1.0 → 1.2.0: the scanner
  parity test now pins marker IDENTITY — exactly 2 markers, one per known file
  (context.md + variant.context.template.md), section '3', source/hash/text
  fidelity — and drops both absolute line expectations (context.md 429,
  variant.context.template.md 151). Position survives only as a sanity bound:
  each marker must sit after its file's first '## ' heading. Acceptance met:
  documentation insertions above a marker can no longer fail the suite (the
  PR #955 class), while deleting a marker or mutating section/source/hash
  still fails. Context: the absolute pin broke CI on a docs-only PR (#955)
  and the hash pin broke it again the same day after the §3.3 recovery note
  re-seed (a1be51db) — position/line churn is the failure mode, identity is
  the contract.
