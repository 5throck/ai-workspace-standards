title: >-
  Re-check the vendor documentation behind the multi-surface installer and
  settle two open choices (follow-up to ADR-0097, design Appendix B). (1)
  scripts/install-upstream-mcp.ts uses codex mcp get --json and codex mcp
  remove, which exist in the installed Codex CLI but not on the vendor MCP page
  (it documents list, add and login): confirm against the vendor changelog or
  source when Codex ships a new major version, and keep the loud-fail behavior
  for an older CLI. (2) Decide whether the installer may create the Antigravity
  registry ~/.gemini/config/mcp_config.json when it is absent; today it only
  edits an existing file because docs/graft-platform-integration.md warns the
  path can vary by version while antigravity.google/docs/mcp documents it for
  the IDE and the CLI. Also re-check the documented paths for Claude Desktop
  (macOS and Windows only) and Hermes (HERMES_HOME). Record the decision and the
  source URLs in the design Appendix B and ADR-0097 follow-ups. Scope:
  documentation plus a possible one-line installer change.
