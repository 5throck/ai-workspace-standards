id: T-20260930-037
kind: manual
title: >-
  Make the scaffold/upgrade pipeline rewrite pm.md extends to a
  project-resolvable path instead of copying the template-relative path verbatim
priority: normal
description: >-
  Survey (read-only, 2026-09-30; every Projects/*/agents/pm.md extends line,
  resolved relative to its agents/ dir; L0 scripts/validate-pm-extends.ts 0.3.1
  run on each file): DANGLING, validator INVALID (missing) - co-abap,
  co-consult, co-deck, co-develop, co-export, co-game, co-price, co-safety,
  co-security, all "extends: ../../common/agents/pm.md", which resolves to
  Projects/common/agents/pm.md (does not exist); it is the template-relative
  path (templates/co-x/agents -> templates/common/agents) copied verbatim. VALID
  only because of the local layout - co-architect, co-newbiz use
  "../../../agents/pm.md", which reaches ai_workspace/agents/pm.md only under
  ai_workspace/Projects/ (validator resolves relative to the file, then
  workspace-root-relative; a standalone clone would dangle). No extends -
  co-design, co-work (VALID). Verification: the validator is not wired into
  audit.ts, dev-sync.ts, git hooks, or CI at L0 or in any project, so no gate
  fails today (project-local copies exit 1 when run by hand); hence priority
  normal everywhere. Context: the project pm.md bodies are already fully
  resolved at scaffold (new-project.ts 2.3b, 340+ lines), so the extends line is
  stale metadata, not a live inheritance. Root cause:
  templates/co-*/agents/pm.md declare extends: ../../common/agents/pm.md
  (correct inside templates/), and new-project.ts (2.3b) / upgrade-project.ts
  resolve the body but keep the template-relative extends frontmatter verbatim.
  Fix: when resolving an extends-stub into a project, drop extends (preferred,
  the body is inlined) or rewrite it to a project-resolvable path; add a
  regression test. Also decide whether co-architect/co-newbiz
  "../../../agents/pm.md" (valid only inside ai_workspace/Projects/) should be
  treated as invalid, and consider wiring validate-pm-extends.ts into the
  project audit so the drift is caught. Per-project fixes: T-20260930-028..036.
  Source: co-newbiz deferred item D7
  (docs/reports/2026-09-22-project-review-full.md).
