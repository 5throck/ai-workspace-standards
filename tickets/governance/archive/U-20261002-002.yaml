  symptom: >-
    Every co-* fleet project CI went red after the 2026-10-01 upgrade-project
    fleet resync (template v0.8.3 delivery): the delivered
    .github/workflows/ci.yml pins bun-version: latest on the two install jobs
    and bun-version: "1.3.x" on the unit-tests job, while each project's
    bun.lock is lockfileVersion 2 (written by bun 1.4.2).

    On CI, setup-bun `latest` resolves to bun 1.3.14, which cannot parse
    lockfileVersion 2: the install step fails with "Unknown lockfile version",
    bun ignores the lockfile, and --frozen-lockfile aborts.

    Expected: template pin defaults that parse the lockfiles the current
    toolchain writes, or preservation of project-local pin patches across
    upgrade-project resyncs.

    Observed: main red in co-design, co-develop, co-export, co-game, co-security
    and co-work from 2026-10-01 14:00Z until pins were restored locally on
    2026-10-02 (co-design b91deef/719df64 and co-develop aa66d60/0af6738 had
    each been clobbered twice by resyncs).
  affected_paths:
    - .github/workflows/ci.yml
  local_workaround_diff: >-
