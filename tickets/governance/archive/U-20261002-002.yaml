    lockfileVersion 2

    +          # bun.lock. Repro: CI run 36924701121.
               # Pinned: `latest` resolved to bun 1.3.14 on CI, which cannot parse
               # lockfileVersion 2 (local-verified 1.4.2). Same rationale as the L0
               # root test.yml pin.
    -          bun-version: latest

    +          bun-version: 1.4.2

    @@ -115,8 +121,9 @@ jobs:

    -          bun-version: "1.3.x"

    +          # (same LOCAL-PATCH marker block as above)

    +          bun-version: "1.4.x"
  repro: >-
