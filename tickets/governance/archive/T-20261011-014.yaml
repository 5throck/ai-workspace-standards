title: >-
  upgrade-project: stash/pop drops gitignored machine artifacts — during a
  project upgrade the stash/pop of the working tree silently discards gitignored
  local tooling (observed: co-abap's vsp binary vanished across an upgrade;
  install-vsp.ts restores it but session state around it was lost). Before
  stashing, detect gitignored untracked files that look like tooling/binary
  artifacts and WARN with an inventory (or exclude them from the stash) so
  machine-local setup survives upgrades. From T-20261011-012's deferral record
