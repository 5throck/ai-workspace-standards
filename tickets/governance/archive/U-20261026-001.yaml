  symptom: >-
    Agent definition stubs pass every shipped gate. In project co-newbiz, 39 of
    41 agents/*.md files carried only frontmatter plus an 8-line body (a Role
    heading copying the description's first sentence and one shared boilerplate
    Scope line) from 2026-09-17 until 2026-10-25, undetected by
    validate-agents.ts, agent-lifecycle-audit.ts, agent-verify.ts, and audit.ts
    - all four passed while the bodies had no Responsibilities, Protocols,
    Constraints, or Required Tools sections. The root cause is a
    management-system gap rather than a one-off: no shipped validator enforces
    minimum definition substance (required body sections or a minimum body
    length) for agents/*.md, and no lifecycle audit flags stub-quality
    definitions, so scaffolded stubs can sit in a production roster
    indefinitely. Detection happened only via a manual cross-project comparison
    on 2026-10-25 (15 sibling projects average 108-230 lines per agent file). A
    body-completeness check in the shared validators - declared-section
    presence, or a stub detector such as body-under-N-lines or
    missing-Responsibilities - would have caught this in September. Co-newbiz
    fixed it locally on 2026-10-25 (PR #731 rewrote all 39 files to the
    canonical 9-section standard); the detection gap itself remains open.
