  symptom: >-
    The variant context file has no placement guard, so it was silently
    relocated. The workspace convention renders
    templates/common/docs/variant.context.template.md as
    docs/<variant>.context.md, and the workspace-managed PM body references that
    path as the workflow-table location. No validator verifies the convention:
    in co-newbiz the file was moved to docs/meta/co-newbiz.context.md on
    2026-10-16 (local docs restructure, commit 48082d1c), which left 4 stale
    references in docs/context.md pointing at the old path and orphaned the
    pm.md reference, and no gate noticed for 9 days (found 2026-10-25 by a
    manual check while writing agent definitions whose Output Destination
    blockquote targets the file). The same silent-relocation risk applies to
    every project scaffolded from the template. An audit gate asserting
    docs/<variant>.context.md exists at the template-convention path - or that
    any relocation carries a registered superseding record - would make the
    convention enforceable. Co-newbiz fixed it locally on 2026-10-25 (PR #731:
    file returned to the docs root, docs/meta/ dissolved, references
    retargeted); the guard gap itself remains open.
  affected_paths:
    - templates/common/docs/variant.context.template.md
    - templates/common/docs/context.md
    - agents/pm.md
    - scripts/audit.ts
