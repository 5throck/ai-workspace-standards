  symptom: >-
    estimate-layout.ts --lint validates only maxima — max_bullets_per_slide and
    max_body_chars from theme.json content_rules. There is no minimum content
    check, so sparse decks pass the layout gate: standard content slides with
    too few bullets (e.g. 1–2) produce sparse, thin-looking decks that clients
    flag in review. The zen theme.json content_rules schema has no min_* fields,
    so there is nothing for the lint to read even if it wanted to enforce a
    floor. Observed on 2026-10-ai-era-business-majors: slides with 2 bullets
    passed --lint with exit 0 while the client review flagged insufficient
    density.
  affected_paths:
