  symptom: >-
    Template-upgrade and workspace-sync deliveries mechanically rewrite
    agents/*.md (placeholder substitution, section retitles, lifecycle-block
    cleanup) but never advance the frontmatter last_updated field, so
    scripts/agent-lifecycle-audit.ts reports stale-date warnings after every
    upgrade wave (observed: commits 548ca96 2026-09-29, 5361921 2026-10-05,
    2a48945 2026-10-11 touching agent bodies with zero date bumps; 8 of 9 agent
    files warned as of 2026-10-26). The findings are level=warning and
    scripts/audit.ts gates only on errors==[], so the drift is never remediated;
    in several files the top-level last_updated and the lifecycle-block date
    disagree with each other. Fix direction: add a post-delivery re-stamp step
    to the upgrade engine for every file it touches with a content change
    (agent-lifecycle-audit already implements isMetadataOnlyChange to
    distinguish bump-only commits), or escalate the stale warning class to error
    level so the gate enforces it.
