    which is inaccurate. As a result, non-regulatory agents (for example dba,
    frontend-engineer, sre) carry a "Legal Basis" section with no statutory or
    regulatory grounding. Expected: one workspace rule — `## Legal Basis` is
    included only for agents whose work rests on statutes, regulations, or
    certification/permit regimes, and omitted otherwise, with the
    sibling-ownership Boundary content placed in Role or Constraints instead. No
    validator currently checks this either way.
