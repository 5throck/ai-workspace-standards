  symptom: >-
    archive-memory.ts archives old memory files out of memory/ but leaves the
    MEMORY.md index rows (and any session-block links) pointing at the
    now-missing file. verify-memory.ts Check 3c only WARNs afterwards, so the
    index silently rots until someone notices a dead link.


    Observed 2026-11-16 in Projects/co-architect:
    memory/meeting-2026-09-25-adr019-step3b.md was archived out by a sync run
    (the transcript no longer exists in memory/ — and in this case not even
    under the archive target, since memory/archive/ is gitignored and
    local-only), leaving a dead Meetings row in memory/MEMORY.md. verify-memory
    reported "Missing MEMORY.md index link target ... repoint or tombstone the
    row" as a WARN only; the fix had to be done by hand (repointed the row to
    the ADR recording the same decision).


    Expected: archive-memory.ts tombstones or repoints affected MEMORY.md rows
    as part of archiving (e.g. replace the link with the archive target, or a
    one-line tombstone naming where the content went), so Check 3c stays green
    after routine syncs instead of accumulating WARNs that only a manual pass
    clears.
  affected_paths:
    - scripts/archive-memory.ts
    - scripts/verify-memory.ts
    - memory/MEMORY.md
  identity_source: cwd
  repro: >-
