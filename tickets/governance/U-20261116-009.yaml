  symptom: 'Two HTML-build gaps plus two deck-local fixes worth promoting. (1) Native zen video slides (ppt-engine VideoSlide, data-video) play a local mp4 only when slideData carries `videoLocal`; html-build/build-theme-deck emit only `videoId`, and inject-video-players skips native video slides, so decks fall back to YouTube even when yt-<id>.mp4 is in the pool. Its index-based binding list also goes stale when slides are inserted. (2) The co-deck contract says slideData.footnotes = abbreviation definitions rendered bottom-left outside the card, but storyline mixes sources into footnotes and a deck-local patch (''fix e'') renders all footnotes inside the card — abbreviations end up inside the card. Fixed deck-locally by splitting abbreviations (`footnotes`, slide-level outside the card) from sources (`notes`, in-card) in FootnoteBuilder. (3) Punchline with two sentences: deck CSS widens the punchline card (min(1120px, 90%)) and caps the title size so each ''\n''-separated sentence stays on one line. Expected: html-build emits videoLocal when the pool file exists; storyline writes abbreviations and sources to separate fields; FootnoteBuilder supports the split; punchline multi-line layout supported in the zen style.'
