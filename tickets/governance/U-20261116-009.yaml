    - scripts/co-deck/lib/theme-builder.ts
    - scripts/co-deck/inject-video-players.ts
    - docs/html-themes/themes/_shared/ppt-engine.js
    - docs/html-themes/styles/white-bubble/style.css
    - skills/storyline/SKILL.md
