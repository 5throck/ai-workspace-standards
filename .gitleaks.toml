# gitleaks configuration — workspace root
# Docs: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml

title = "ai-workspace-standards gitleaks config"

[extend]
# Inherit all default rules from the upstream gitleaks config
useDefault = true

[allowlist]
description = "Allowlist for known false positives in this workspace"
# Regex patterns on the matched secret value
regexes = [
  # Placeholder values in .env.sample and docs
  '''your[_-]?(api[_-]?)?key[_-]?here''',
  '''your[_-]?secret[_-]?here''',
  '''replace[_-]?with[_-]?actual''',
  '''example[_\-.]com''',
  # All-caps placeholder tokens used in documentation examples
  '''YOUR_API_KEY''',
  '''YOUR_TOKEN''',
  '''YOUR_SECRET''',
  # gitleaks:allow inline marker (single-line suppression)
  '''gitleaks:allow''',
]
# Paths to skip entirely
paths = [
  '''\.env\.sample''',
  # T-20261026-009 (finding #35): machine-written upstream ticket records. The
  # intake server (scripts/mcp-upstream-server.ts) writes 64-hex sha256 digests
  # (dedupe_key, request_sha256) into tickets/governance/*.yaml (incl. archive/),
  # which gitleaks' generic-api-key rule trips on (U-20261001-001, 2026-10-01).
  # The old fix suppressed the 64-hex VALUE SHAPE repo-wide, hiding any 64-hex
  # secret anywhere; scoping to the record files restores repo-wide detection
  # (verified: gitleaks allowlist regexes/paths are OR-combined, so a value
  # regex cannot be path-scoped within an entry — path exemption is the only
  # narrowing mechanism). Keep additions here narrow: one path per
  # machine-written digest surface, never a value-shape wildcard.
  '''tickets/governance/.*\.yaml$''',
  # CHANGELOG entries describe changes by title only — no secret values expected
  # If a real secret is found here, remove this exclusion and fix the entry
  '''CHANGELOG\.(md|txt)$''',
  '''.*_test\.(js|ts|py|go|rs)$''',
  '''.*\.test\.(js|ts)$''',
  '''.*_spec\.rb$''',
  # co-security agent docs legitimately discuss credentials/secrets as subject matter
  '''templates/co-security/agents/.*\.md$''',
  # Other projects in workspace root — not part of this repo's audit scope
  # .env files are gitignored; --no-git mode scans them anyway — exclude here
  '''\.env$''',
  # Local dependency/build directories — gitignored, never committed, but
  # --no-git mode scans them anyway; third-party library internals (test
  # fixtures, crypto constant names, etc.) commonly trip generic secret regexes
  '''(^|/)\.venv/''',
  '''(^|/)venv/''',
  '''(^|/)node_modules/''',
  '''(^|/)__pycache__/''',
  # L2 Projects/ directory contains user engagements — outside audit scope
  '''Projects/''',
]
