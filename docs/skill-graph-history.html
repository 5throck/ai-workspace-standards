<style>
:root{--bg:#f6f7f9;--fg:#1c2430;--muted:#5b6673;--card:#ffffff;--border:#d5dae1;--accent:#2563eb;--ok:#15803d;--warn:#b45309;--unk:#64748b;--chip:#e8edf3;--hatch:#c9d2dc}
:root[data-theme="light"]{--bg:#f6f7f9;--fg:#1c2430;--muted:#5b6673;--card:#ffffff;--border:#d5dae1;--accent:#2563eb;--ok:#15803d;--warn:#b45309;--unk:#64748b;--chip:#e8edf3;--hatch:#c9d2dc}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12161c;--fg:#dce3ec;--muted:#8b96a5;--card:#1a2028;--border:#2b333e;--accent:#5b9dff;--ok:#4ade80;--warn:#fbbf24;--unk:#94a3b8;--chip:#232b35;--hatch:#39434f}}
:root[data-theme="dark"]{--bg:#12161c;--fg:#dce3ec;--muted:#8b96a5;--card:#1a2028;--border:#2b333e;--accent:#5b9dff;--ok:#4ade80;--warn:#fbbf24;--unk:#94a3b8;--chip:#232b35;--hatch:#39434f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:16px 20px 0;border-bottom:1px solid var(--border)}
h1{margin:0 0 8px;font-size:20px}
.controls{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.controls input{flex:1;max-width:520px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--fg)}
.controls button{padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--fg);cursor:pointer}
#tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab-btn{padding:7px 14px;border:1px solid var(--border);border-bottom:none;border-radius:6px 6px 0 0;background:var(--card);color:var(--muted);cursor:pointer;font:inherit}
.tab-btn.active{color:var(--fg);font-weight:600;border-bottom:1px solid var(--card);margin-bottom:-1px}
main{padding:16px 20px 40px}
.tab{display:none}
.tab.active{display:block}
.muted{color:var(--muted)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.stat{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 16px;min-width:130px}
.stat-v{font-size:22px;font-weight:700}
.stat-l{color:var(--muted);font-size:12px}
.absent .row{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:5px 10px;margin:4px 0;color:var(--warn)}
h2{font-size:15px;margin:18px 0 8px}
.trend{display:flex;align-items:flex-end;gap:3px;height:56px;padding:6px;background:var(--card);border:1px solid var(--border);border-radius:8px;overflow-x:auto}
.tcol{display:flex;align-items:flex-end;gap:1px}
.tcol i{width:7px;display:block;border-radius:1px}
.tcol i.c{background:var(--ok)}.tcol i.d{background:var(--warn)}.tcol i.u{background:var(--unk)}
.strip{display:flex;height:20px;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.strip .tick{background:var(--accent)}
.strip .gap{background:repeating-linear-gradient(45deg,var(--hatch),var(--hatch) 4px,var(--bg) 4px,var(--bg) 8px)}
table{border-collapse:collapse;width:100%;margin:8px 0;background:var(--card);border:1px solid var(--border);border-radius:8px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.chip{display:inline-block;background:var(--chip);border:1px solid var(--border);border-radius:10px;padding:1px 8px;font-size:12px}
.chip.hash{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.chip.proj{background:transparent}
.cap{font-weight:600}
.hashline{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:2px 0}
.group{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin:8px 0}
.count{background:var(--chip);border-radius:10px;padding:1px 8px;font-size:12px;margin-left:8px}
details.group>summary{cursor:pointer;display:flex;align-items:center}
details.group[open]>summary{margin-bottom:6px}
.badge{display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:1px 8px;font-size:11px;white-space:nowrap}
.hidden{display:none}
</style>

emory-log bookkeeping WIP must be committed or discarded before default-branch restore — skill-graph coverage blocked on pr/* checkout","status":"done","priority":"normal","source":"live","runnerFiled":false},{"id":"T-20261122-004","title":"design (dev-sync): spec-check (step 3.9) fails on skill-graph drift for changes pipeline steps could have pre-converged — docs/skill-graph.json is a derived projection but only regenerated by hand, and the step-3.9 failure hint names the wrong cause. Fix: pre-converge the skill-graph projection before step 3.9 (mirroring the step-3.85 pattern) and/or make the step-3.9 failure hint echo the actual failing sub-check names. Needs Design Gate (dev-sync is protected).","status":"done","priority":"normal","source":"live","runnerFiled":false},{"id":"T-20261114-013","title":"co-learning exam-bank-operations backport decision (owner decision needed: is the content education-generic enough for the template; template PR, so root change): Projects/co-learning skills/exam-bank-operations/SKILL.md is version 1.2.0 vs template templates/co-learning/skills/exam-bank-operations 1.1.0 and upgrade-project reports it as PROJECT_AHEAD (WARN, kept in the PENDING BACKPORT list, first seen 2026-11-14). The project content was added in commit 926c0c3 (2026-10-07 'register education-operations team (P1)'): frontmatter triggers 'invigilation' and 'misconduct handling', '### 5. Invigilation policy (during sittings)' and '### 6. Misconduct handling'. The new text references project-specific ADR-0003 (approval-code reset flow) and the cms-operations / lms-operations skills (4 skills exist in the project variant.json but those two are not necessarily in the template), which must be scrubbed or ported before the content can enter the template. Options: (a) scrub ADR-0003 and the cms/lms references and port to templates/co-learning/skills/exam-bank-operations with a version bump to 1.2.0 (CV-02) plus regenerated skill-graph; (b) port together with cms-operations/lms-operations if the owner wants them template-wide; (c) record a keep-in-project decision so the PENDING BACKPORT entry is closed. Acceptance: owner decision recorded; if (a)/(b), template PR merged with version 1.2.0 and generated skill-graph, and upgrade-project dry-run on co-learning no longer lists PROJECT_AHEAD for this path; if (c), decision recorded in the project and the engine pending-backport entry resolved.","status":"done","priority":"low","source":"archive","runnerFiled":false},{"id":"T-20261114-012","title":"Variants that shadow common files wholesale have no drift guard: a later edit to templates/common/\u003cpath> never reaches a variant copy that replaced it, and no validator reports divergence. Enumeration on origin/main fcbee7f78 (compare relative paths under templates/common, 1013 files, against each templates/co-*, byte comparison): files present in both and byte-different per variant: co-abap 19, co-architect 17, co-consult 29, co-deck 29, co-design 58, co-develop 27, co-export 12, co-game 27, co-hr 27, co-learning 13, co-news 12, co-price 31, co-safety 63, co-security 27, co-work 36 (identical copies 2-11 each). Most are expected per-variant content (present in all 15: README.md, README_ko.md, HERMES.md, AGENTS.md, agents/pm.md, docs/lifecycle/agents/pm.md, skills/SKILLS.md, docs/skill-graph.json, .gemini/settings.json, .claude/settings.json; agents/i18n-specialist.md in 14). The governance-doc shadows are docs/phase-definitions.md (14 of 15 variants; co-architect has none; design 2026-10-28-l0-only-governance-doc-cleanup-design.md (line 220) records that 14/16 projects carrying variant-customized phase-definitions is the accepted norm, i.e. intended hand-maintained divergence) and docs/governance/agents/workflows.md (co-learning only, new in PR #2032; its entire delta versus common is the 29-line Stream Boundaries insertion at line 124 inside the VARIANT-ROLE-BOUNDARY zone, so the other 150+ lines are a frozen snapshot of common, and common's file changed three times in recent history: cf8bc12e9, 92d90b49f, 57dcdc191). Other shadowed sets worth guarding: the three platform skill copies (platform-skill-lifecycle-manager, platform-command-lifecycle-manager, finishing-a-development-branch under .claude/.codex/.gemini/.agents/.hermes skills) differ in 8 variants (co-consult, co-deck, co-design, co-develop, co-game, co-hr, co-security, co-work), plus package.json (4), SECURITY.md and .gitignore (2 each). Existing guards cover only narrow cases: scripts/validate-variant-claims.ts check j (AGENTS.md boilerplate drift vs common) and README-pair hash parity; nothing reports a whole-file shadow whose common source moved. Impact: improvements to common governance text (for example the workflows.md Gate-passed sentence that differs at line 104 per T-20261114-002) silently never reach shadowing variants, and the divergence is discovered only by humans during an upgrade conflict. Proposed fix (design first): either (a) hash-of-common recorded in the variant file (a front-matter or trailing comment such as common-sha256 plus common-template-version stamped at shadow time) with a validate-templates check that warns when the current common hash differs and the variant has not re-acknowledged it, or (b) a validate-templates check that computes the shadow set (path in both trees, bytes differ) and compares it to a declared list in variant.json (shadowedCommonFiles with reason), failing on undeclared shadows and reporting declared ones whose common source changed since the recorded hash; for zone-only deltas (co-learning workflows.md) prefer converting the shadow into a zone override of common so the rest keeps flowing. Acceptance: the check lists exactly the current shadow set above on main, a seeded fixture (edit common, leave variant) is flagged, intentional shadows (README, variant.json, phase-definitions) can be declared without noise, and co-learning workflows.md either carries the recorded hash or is converted to a zone override. Priority low (a normal bump is reasonable once a second zone-only shadow appears). Relations: PR #2032, T-20261114-002, T-20261114-003, T-20261110-012 (README-pair hash gating precedent), T-20261110-010 (variant script parity for @version files).","status":"done","priority":"low","source":"live","runnerFiled":false},{"id":"T-20261114-007","title":"dev-sync scoped staging can open a PR that contains none of the intended edits (and the unexplained co-security #112 CLAUDE.md omission is a related symptom). Context: scoped staging is the DEFAULT since dev-sync v1.23.0 (archived T-20261001-015, PR #1298); SYNC_SCOPED_STAGING=1 and --scoped-staging are accepted no-ops, SYNC_SCOPED_STAGING=0 / --warn-staging restores the old sweep-in behaviour, so the exclusion is intended and this ticket is about the opposite failure mode. Step 6.5 (scripts/dev-sync.ts, classification near :2257-2283, warn-only branch near :2285-2301, the 'Scoped-staging check' WARN) computes committable = taskStaged U pipelineOutputs and leaves residual (neither pre-staged nor pipeline-generated) OUT of the commit with only a yellow WARN; there is no exit path keyed on taskStaged being empty. When the operator forgot git add, the pipeline still commits, pushes and opens a PR holding only generated outputs (memory log, CHANGELOG, VERSION_MANIFEST, skill-graph) with a plausible 'chore: workspace sync (N files)' subject from composeCommitMessage (derived from the final staged set), passing the language and pre-push gates. Field: root PRs #2009, #2010 and #2025 shipped that way (operator-reported) and cost three PRs under the one-open-root-PR rule. Folded-in related symptom (PR-specific proof unavailable, no transcript retained): co-security PR #112 commit 97230ff (15 files, none CLAUDE.md) although the engine logged 'MERGE: CLAUDE.md' / 'MERGED COMMON-CLAUDE block'. Minimal repro on a scratch clone of Projects/co-security at 7cefe7b with the engine from origin/main: bun scripts/upgrade-project.ts \u003cclone> --yes (exit 1) leaves 'M CLAUDE.md' whose diff is exactly one line, the managed block footer '*Last Updated: 2026-11-13 ...*' moved BACKWARDS to 2026-11-12 (project commit 1f94682 carries 2026-11-13, templates/common/CLAUDE.md carries 2026-11-12); a file dirty at S0 and unchanged by the pipeline is residual and, unless explicitly git added, is left out with only the WARN. So two mechanisms interact: COMMON-CLAUDE merge has no never-move-Last-Updated-backwards rule (engine nit), and scoped staging hides engine-written tracked files. Proposed fix: (1) guard: if taskStaged is empty AND residual contains at least one tracked modified/deleted/renamed path (porcelain M/D/R, not untracked scratch) exit 1 with the list and the ways forward (git add \u003cpaths>, or --stage \u003cpaths>, or --allow-generated-only); relax for known delivery/closeout callers that intentionally present an empty index (see comments near dev-sync.ts:2246-2250 and :2400-2406); (2) new repeatable --stage \u003cpath|glob> flag staging paths before the snapshot so the declared set is part of taskStaged; (3) keep untracked scratch residual as WARN only; (4) document in skills/sync/SKILL.md which invocation classes may run with an empty index; (5) optional tiny engine nit: keep the newer Last Updated date in the COMMON-CLAUDE merge so a no-op delivery produces no CLAUDE.md change. Acceptance: fixture with a tracked unstaged edit and empty index makes dev-sync exit 1 before commit or push; same with --stage \u003cfile> commits the file; delivery/closeout callers unchanged; the existing scoped-staging cases (9, T-20261001-015) stay green; with the guard, an engine-modified tracked file that is not staged can no longer be omitted silently. Relations: T-20261001-015 (archived), U-20261107-003 (v1.43.0 overlap classification), U-20261006-006.","status":"done","priority":"normal","source":"live","runnerFiled":false},{"id":"T-20261108-009","title":"co-newbiz 0.30.0 deferred on a REAL lint re in the project's scripts/dev-sync.ts — so Projects/co-safety/docs/graph-deltas/ has never received a record and the channel is empty by design-absence, not by quiescence. Consequence: native M2/M4 Graph Delta Log verification of the cycle-1 evidence-plane pair (DEC-20261030-01 follow-up condition) is structurally unreachable — re-verified NOT CLEARED in backport cycle 2 (2026-10-30); even once wired plus a first real graph change, the >= 90-day accumulated generated_at span puts earliest native clearance at approximately 2027-01-28. Seeding a record today would flip M2 to FAIL (0-day span preempts the git-log fallback); backdating was rejected as evidence falsification. Suggested remedy: invoke the generator in the project's sync pipeline as a post-commit step, same pattern as the workspace root's skill-graph regen (scripts/dev-sync.ts step 4.65 generate-skill-graph.ts invocation); re-verify no earlier than 2027-01-28. Refs: DEC-20261030-01 consequence clause; docs/reports/2026-10-30-backport-user-directed-cycle2-co-design-co-develop-co-game.md §Follow-up status","status":"done","priority":"normal","source":"archive","runnerFiled":false},{"id":"T-20261009-008","title":"skill-graph fleet-report orphan triage: add HERMES.md to the docRef corpus, compute triage axes for isolated agents, and preserve root-L0 edges via overrides or same-capability attribution (stop flagging architect/standup-synthesizer)","status":"done","priority":"normal","source":"archive","runnerFiled":false},{"id":"T-20261009-007","title":"Pin docs/skill-graph.overrides.json scoped-key resolution with a unit fixture test (bare-key fan-out removal is untested)","status":"done","priority":"low","source":"archive","runnerFiled":false},{"id":"T-20261009-004","title":"skill-graph: resolve standup-synthesizer isolation (new orphan vs 2026-10-08 snapshot, docRefs 0) — wire a doc reference or file retirement","status":"done","priority":"normal","source":"archive","runnerFiled":true},{"id":"T-20261008-009 <script>
(function () {
"use strict";
var MODEL = JSON.parse(document.getElementById("report-data").textContent);
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function chip(text, cls) { return el("span", cls ? "chip " + cls : "chip", text); }
function dayAfter(iso) { var d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + 1); return d.toISOString().slice(0, 10); }
function dayBefore(iso) { var d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() - 1); return d.toISOString().slice(0, 10); }
function dayDiff(a, b) { return Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / 86400000); }
function truncate(s, n) { return s.length > n ? s.slice(0, n - 1) + "\u2026" : s; }

// theme: default follows prefers-color-scheme; the toggle flips and persists (design §5.2)
var THEME_KEY = "sgf-history-theme";
function setTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem(THEME_KEY, t); } catch (err) { /* storage unavailable: non-persistent theme */ }
}
try {
  var saved = localStorage.getItem(THEME_KEY);
  if (saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved);
} catch (err) { /* ignore */ }
function currentTheme() {
  var attr = document.documentElement.getAttribute("data-theme");
  if (attr === "dark" || attr === "light") return attr;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
document.getElementById("theme-toggle").addEventListener("click", function () {
  setTheme(currentTheme() === "dark" ? "light" : "dark");
});

// tabs
var TABS = ["overview", "timeline", "divergence", "gaps", "tickets"];
var sections = {};
TABS.forEach(function (t) { sections[t] = document.getElementById("tab-" + t); });
var active = "overview";
function activate(name) {
  active = name;
  document.querySelectorAll(".tab-btn").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-tab") === name);
  });
  TABS.forEach(function (t) { sections[t].classList.toggle("active", t === name); });
  applySearch();
}
document.querySelectorAll(".tab-btn").forEach(function (b) {
  b.addEventListener("click", function () { activate(b.getAttribute("data-tab")); });
});

// search: filters rows of the ACTIVE tab only (design §5.2)
var searchInput = document.getElementById("search");
function applySearch() {
  var q = searchInput.value.trim().toLowerCase();
  sections[active].querySelectorAll("[data-search]").forEach(function (row) {
    var hay = row.getAttribute("data-search");
    row.classList.toggle("hidden", q !== "" && hay.indexOf(q) === -1);
  });
}
searchInput.addEventListener("input", applySearch);

function statCard(value, label) {
  var c = el("div", "stat");
  c.appendChild(el("div", "stat-v", value));
  c.appendChild(el("div", "stat-l", label));
  return c;
}

function renderOverview() {
  var ov = sections.overview;
  ov.textContent = "";
  var presentSet = {};
  // present = projects carried by the latest series row (a member absent there
  // is a transient PR checkout or had no graph this run)
  var lastRow = MODEL.series[MODEL.series.length - 1];
  var present = lastRow ? Object.keys(lastRow.projects) : [];
  present.forEach(function (p) { presentSet[p] = true; });
  var head = el("div", "stats");
  head.appendChild(statCard(present.length + " / " + MODEL.fleet.count, "fleet members covered"));
  head.appendChild(statCard(String(MODEL.latest.convergence.converged.length), "converged"));
  head.appendChild(statCard(String(MODEL.latest.convergence.convergenceWithDivergence.length), "divergent"));
  head.appendChild(statCard(String(MODEL.latest.convergence.hashUnknown.length), "hash-unknown"));
  ov.appendChild(head);
  ov.appendChild(el("p", "muted", "Latest snapshot: " + MODEL.latest.date));
  var absent = MODEL.fleet.members.filter(function (m) { return !presentSet[m.name]; });
  if (absent.length > 0) {
    ov.appendChild(el("h2", "", "Absent members"));
    var ab = el("div", "absent");
    absent.forEach(function (m) {
      var reason = m.transientAbsent ? "absent: transient PR checkout" : "absent: no graph this run";
      var row = el("div", "row", m.name + " \u2014 " + reason);
      row.setAttribute("data-search", (m.name + " " + reason).toLowerCase());
      ab.appendChild(row);
    });
    ov.appendChild(ab);
  }
  var maxClass = 1;
  MODEL.series.forEach(function (r) {
    maxClass = Math.max(maxClass, r.classes.converged, r.classes.divergent, r.classes.unknown);
  });
  ov.appendChild(el("h2", "", "Convergence class counts over time"));
  var strip = el("div", "trend");
  MODEL.series.forEach(function (r) {
    var col = el("div", "tcol");
    col.setAttribute("title", r.date + " \u2014 converged " + r.classes.converged + ", divergent " + r.classes.divergent + ", hash-unknown " + r.classes.unknown);
    [["c", r.classes.converged], ["d", r.classes.divergent], ["u", r.classes.unknown]].forEach(function (pair) {
      var bar = el("i", pair[0]);
      bar.style.height = Math.max(2, Math.round((pair[1] / maxClass) * 48)) + "px";
      col.appendChild(bar);
    });
    strip.appendChild(col);
  });
  ov.appendChild(strip);
  var totals = { nodes: 0, edges: 0, skills: 0 };
  present.forEach(function (p) {
    var s = lastRow.projects[p];
    totals.nodes += s.nodes; totals.edges += s.edges; totals.skills += s.skills;
  });
  ov.appendChild(el("h2", "", "Latest totals (sum over covered projects)"));
  var tot = el("div", "stats");
  tot.appendChild(statCard(String(totals.nodes), "graph nodes"));
  tot.appendChild(statCard(String(totals.edges), "graph edges"));
  tot.appendChild(statCard(String(totals.skills), "skill nodes"));
  ov.appendChild(tot);
}

function renderTimeline() {
  var tl = sections.timeline;
  tl.textContent = "";
  tl.appendChild(el("h2", "", "Snapshot axis (hatched = no snapshot that day)"));
  var dates = MODEL.series.map(function (r) { return r.date; });
  if (dates.length > 0) {
    var first = dates[0];
    var last = dates[dates.length - 1];
    var strip = el("div", "strip");
    var segments = [];
    var cursor = first;
    MODEL.gaps.forEach(function (g) {
      if (g.from > cursor) segments.push({ kind: "tick", start: cursor, days: dayDiff(cursor, g.from), end: dayBefore(g.from) });
      segments.push({ kind: "gap", start: g.from, days: g.days, end: g.to });
      cursor = dayAfter(g.to);
    });
    if (cursor <= last) segments.push({ kind: "tick", start: cursor, days: dayDiff(cursor, dayAfter(last)), end: last });
    segments.forEach(function (s) {
      var seg = el("div", s.kind);
      seg.style.flexGrow = String(s.days);
      seg.setAttribute("title", s.kind === "tick"
        ? (s.days > 1 ? "snapshots " + s.start + " .. " + s.end : "snapshot " + s.start)
        : "gap " + s.start + " .. " + s.end + " (" + s.days + " days, no snapshot)");
      strip.appendChild(seg);
    });
    tl.appendChild(strip);
  }
  tl.appendChild(el("h2", "", "Per-date fleet diff (NEW / VANISHED skills)"));
  var table = el("table");
  var thead = el("thead");
  var hr = el("tr");
  ["date", "new skills", "vanished skills"].forEach(function (h) { hr.appendChild(el("th", "", h)); });
  thead.appendChild(hr);
  table.appendChild(thead);
  var tbody = el("tbody");
  for (var i = MODEL.series.length - 1; i >= 0; i--) {
    var r = MODEL.series[i];
    var tr = el("tr", "row");
    tr.setAttribute("data-search", (r.date + " " + r.newSkills.join(" ") + " " + r.vanishedSkills.join(" ")).toLowerCase());
    tr.appendChild(el("td", "mono", r.date));
    var tdNew = el("td");
    if (r.newSkills.length === 0) tdNew.appendChild(el("span", "muted", "\u2014"));
    else r.newSkills.forEach(function (s) { tdNew.appendChild(chip(s)); });
    tr.appendChild(tdNew);
    var tdVan = el("td");
    if (r.vanishedSkills.length === 0) tdVan.appendChild(el("span", "muted", "\u2014"));
    else r.vanishedSkills.forEach(function (s) { tdVan.appendChild(chip(s)); });
    tr.appendChild(tdVan);
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  tl.appendChild(table);
}

function renderDivergence() {
  var dv = sections.divergence;
  dv.textContent = "";
  var conv = MODEL.latest.convergence;
  dv.appendChild(el("h2", "", "Convergence with divergence (" + conv.convergenceWithDivergence.length + ") \u2014 reconciliation candidates, not auto-promoted"));
  conv.convergenceWithDivergence.forEach(function (g) {
    var grp = el("div", "group row");
    var hay = g.capability;
    grp.appendChild(el("div", "cap", g.capability));
    Object.keys(g.hashes).forEach(function (h) {
      var line = el("div", "hashline");
      line.appendChild(chip(h.slice(0, 8), "hash"));
      g.hashes[h].forEach(function (p) {
        line.appendChild(chip(p, "proj"));
        hay += " " + h + " " + p;
      });
      grp.appendChild(line);
    });
    grp.setAttribute("data-search", hay.toLowerCase());
    dv.appendChild(grp);
  });
  dv.appendChild(el("h2", "", "Converged (" + conv.converged.length + ") \u2014 single content hash"));
  var chips = el("div", "chips");
  conv.converged.forEach(function (c) {
    var cp = chip(c);
    cp.setAttribute("data-search", c.toLowerCase());
    chips.appendChild(cp);
  });
  dv.appendChild(chips);
  dv.appendChild(el("h2", "", "Hash-unknown (" + conv.hashUnknown.length + ") \u2014 at least one carrier is a v1 graph"));
  var chipsU = el("div", "chips");
  conv.hashUnknown.forEach(function (c) {
    var cp = chip(c);
    cp.setAttribute("data-search", c.toLowerCase());
    chipsU.appendChild(cp);
  });
  dv.appendChild(chipsU);
}

function renderGaps() {
  var gp = sections.gaps;
  gp.textContent = "";
  gp.appendChild(el("h2", "", "Root skills missing from project graphs (latest snapshot)"));
  var entries = Object.keys(MODEL.latest.missingFromProjects).map(function (p) {
    return { project: p, missing: MODEL.latest.missingFromProjects[p] || [] };
  }).sort(function (a, b) { return b.missing.length - a.missing.length || (a.project < b.project ? -1 : 1); });
  entries.forEach(function (e) {
    var det = document.createElement("details");
    det.className = "group row";
    var sum = el("summary");
    sum.appendChild(el("span", "cap", e.project));
    sum.appendChild(el("span", "count", String(e.missing.length)));
    det.appendChild(sum);
    var list = el("div", "chips");
    e.missing.forEach(function (s) { list.appendChild(chip(s)); });
    det.appendChild(list);
    det.setAttribute("data-search", (e.project + " " + e.missing.join(" ")).toLowerCase());
    gp.appendChild(det);
  });
}

function renderTickets() {
  var tk = sections.tickets;
  tk.textContent = "";
  tk.appendChild(el("h2", "", "Governance tickets mentioning skill-graph (live + archive, newest first)"));
  if (MODEL.tickets.length === 0) {
    tk.appendChild(el("p", "muted", "No governance ticket title mentions skill-graph."));
    return;
  }
  var table = el("table");
  var thead = el("thead");
  var hr = el("tr");
  ["id", "title", "status", "priority", "source", "filed"].forEach(function (h) { hr.appendChild(el("th", "", h)); });
  thead.appendChild(hr);
  table.appendChild(thead);
  var tbody = el("tbody");
  MODEL.tickets.forEach(function (t) {
    var tr = el("tr", "row");
    tr.setAttribute("data-search", (t.id + " " + t.title + " " + t.status + " " + t.priority + " " + t.source).toLowerCase());
    tr.appendChild(el("td", "mono", t.id));
    tr.appendChild(el("td", "", truncate(t.title, 140)));
    tr.appendChild(el("td", "", t.status));
    tr.appendChild(el("td", "", t.priority));
    tr.appendChild(el("td", "", t.source));
    var tdF = el("td");
    if (t.runnerFiled) tdF.appendChild(el("span", "badge", "runner-filed"));
    tr.appendChild(tdF);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tk.appendChild(table);
}

renderOverview();
renderTimeline();
renderDivergence();
renderGaps();
renderTickets();
activate("overview");
})();
</script>
</body>
</html>
