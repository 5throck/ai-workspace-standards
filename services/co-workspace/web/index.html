<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>co-workspace</title>
<style>
  :root {
    --bg: #0d1117; --bg2: #10161d; --panel: #12181f; --border: #21262d; --border2: #30363d;
    --fg: #e6edf3; --muted: #8b949e; --faint: #6e7681; --accent: #58a6ff; --input-bg: #0d1117;
  }
  [data-theme="light"] {
    --bg: #f6f8fa; --bg2: #ffffff; --panel: #ffffff; --border: #d0d7de; --border2: #d8dee4;
    --fg: #1f2328; --muted: #656d76; --faint: #8c959f; --accent: #0969da; --input-bg: #ffffff;
  }
  :root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); height: 100vh; display: flex; overflow: hidden; }
  .collapsed-note { font-size: .7rem; color: #6e7681; writing-mode: vertical-rl; padding: 8px 2px; cursor: pointer; }
  /* right artifacts panel */
  #artifacts { width: 380px; min-width: 300px; border-left: 1px solid var(--border); display: flex; flex-direction: column; background: var(--bg2); }
  #artifacts .tabs { display: flex; border-bottom: 1px solid var(--border); }
  #artifacts .tabs button { flex: 1; background: transparent; color: #8b949e; border: 0; padding: 9px 4px; font: inherit; font-size: .78rem; cursor: pointer; }
  #artifacts .tabs button.active { color: #58a6ff; border-bottom: 2px solid #58a6ff; }
  #artifacts .content { flex: 1; overflow: auto; padding: 10px 12px; font-size: .82rem; }
  .fileRow { display: flex; justify-content: space-between; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
  .fileRow:hover { background: var(--panel); }
  .fileRow.dir { color: #79c0ff; font-weight: 600; }
  .fileRow .size { color: #6e7681; font-size: .7rem; }
  pre.preview { background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; overflow: auto; max-height: 100%; white-space: pre-wrap; font-size: .78rem; }
  .turnRow { padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: .78rem; }
  .turnRow .meta { color: var(--muted); font-size: .68rem; }
  .turnRow .txt { color: var(--fg); margin-top: 3px; }
  .collapsebtn { background: transparent; color: #8b949e; border: 0; cursor: pointer; font-size: .9rem; padding: 2px 6px; }
  .collapsebtn:hover { color: #58a6ff; }
  header .ctlgroup { display: flex; align-items: center; gap: 8px; }
  header label.check { display: flex; gap: 5px; align-items: center; font-size: .76rem; color: #8b949e; cursor: pointer; }
  header label.check input { width: auto; }
  .toast { position: fixed; top: 12px; right: 14px; background: #1c2a3a; border: 1px solid #1f6feb; color: var(--fg); border-radius: 8px; padding: 8px 14px; font-size: .8rem; z-index: 50; }
  .hint { color: #7d8590; }
  /* ── sidebar ── */
  aside { position: relative; width: 260px; min-width: 200px; background: var(--bg2); border-right: 1px solid var(--border);
          display: flex; flex-direction: column; padding: 12px; gap: 10px; }
  #artifacts { position: relative; }
  .rz { position: absolute; top: 0; bottom: 0; width: 6px; cursor: col-resize; z-index: 30; }
  .rz:hover, .rz.active { background: var(--accent); opacity: .4; }
  .brand { font-weight: 700; font-size: .95rem; padding: 2px 4px 8px; }
  .brand span { color: #58a6ff; }
  .newbtn { background: #238636; color: #fff; border: 0; border-radius: 8px; padding: 9px; font: inherit; font-weight: 600; cursor: pointer; width: 100%; }
  .userbox { display: flex; flex-direction: column; gap: 4px; font-size: .74rem; color: #8b949e; }
  .userbox input { background: var(--bg); color: var(--fg); border: 1px solid #30363d; border-radius: 7px; padding: 7px 9px; font: inherit; }
  .userbox label.check { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .userbox input[type=checkbox] { width: auto; }
  #sessions { flex: 1; overflow-y: auto; border-top: 1px solid var(--border); padding-top: 8px; }
  .sess { padding: 8px 9px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .sess:hover { background: var(--panel); }
  .sess.active { background: var(--bg); outline: 1px solid var(--accent); }
  .sess .nm { font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess .meta { color: #6e7681; font-size: .68rem; }
  .sess .del { background: transparent; color: #f85149; border: 0; cursor: pointer; font-size: .75rem; padding: 2px 4px; visibility: hidden; }
  .sess:hover .del { visibility: visible; }
  .sess .del:hover { text-decoration: underline; }
  .sidetitle { font-size: .7rem; color: #8b949e; letter-spacing: .05em; }
  .grouphead { font-size: .72rem; color: #58a6ff; font-weight: 600; padding: 8px 4px 3px; letter-spacing: .03em; }
  .grouphead.gtoggle { cursor: pointer; user-select: none; }
  .groupDel { background: transparent; border: 0; color: var(--muted); font-size: .62rem; cursor: pointer; padding: 0 2px; letter-spacing: 0; }
  .groupDel:hover { color: #f85149; }
  .todayBadge { color: #3fb950; font-size: .64rem; margin-left: 5px; }
  .modal .ntOption { background: var(--panel); color: var(--fg); border: 1px solid var(--border2); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: .8rem; cursor: pointer; text-align: left; }
  .modal .ntOption:hover { background: color-mix(in srgb, var(--accent) 12%, var(--panel)); border-color: var(--accent); }
  .modal .ntOption.selected { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  /* ── main column ── */
  section { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  header select { background: var(--bg); color: var(--fg); border: 1px solid #30363d; border-radius: 8px; padding: 6px 9px; font: inherit; font-size: .85rem; }
  header .pname { color: var(--muted); font-size: .78rem; overflow: hidden; text-overflow: ellipsis; }
  header .pname b { color: var(--fg); }
  #log { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
  .msg { padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; line-height: 1.6; font-size: .92rem; max-width: 82%; }
  .user { background: color-mix(in srgb, var(--accent) 14%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 34%, transparent); align-self: flex-end; }
  .assistant { background: var(--panel); border: 1px solid var(--border2); align-self: stretch; max-width: 100%; }
  .assistant.pending::after { content: "▌"; color: #58a6ff; }
  .progress-inline { color: #e3b341; font-size: .8rem; }
  .composer { padding: 10px 16px 14px; }
  .composerBox { max-width: 780px; margin: 0 auto; background: var(--input-bg); border: 1px solid var(--border2);
                 border-radius: 16px; padding: 10px 12px 8px; }
  .composerBox:focus-within { outline: 1px solid var(--accent); }
  .composerTools { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .modelPick { background: transparent; color: var(--fg); border: 1px solid var(--border2); border-radius: 8px;
               padding: 4px 8px; font: inherit; font-size: .78rem; max-width: 180px; }
  .betaPick { font-size: .74rem; color: var(--muted); display: flex; gap: 4px; align-items: center; cursor: pointer; }
  .betaPick input { width: auto; }
  .sendBtn { background: #1f6feb; color: #fff; border: 0; border-radius: 10px; padding: 7px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  .sendBtn:disabled { opacity: .45; cursor: default; }
  .stopBtn { background: #8b1f1f; color: #fff; border: 0; border-radius: 10px; padding: 7px 14px; font: inherit; cursor: pointer; font-size: .78rem; }
  .stopBtn.hidden { display: none; }
  textarea { width: 100%; background: transparent; color: var(--fg); border: 0; font: inherit; min-height: 44px; resize: none; outline: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .chip { background: var(--panel); color: var(--fg); border: 1px solid var(--border2); border-radius: 999px;
          padding: 7px 14px; font: inherit; font-size: .8rem; cursor: pointer; }
  .chip:hover { outline: 1px solid var(--accent); }
  .empty { margin: auto; text-align: center; color: #6e7681; }
  /* auth card in sidebar */
  #authCard { border-top: 1px solid var(--border); padding-top: 8px; margin-top: auto; display: flex; flex-direction: column; gap: 6px; font-size: .78rem; }
  .avatar { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; background: var(--accent);
            color: #fff; align-items: center; justify-content: center; font-size: .7rem; font-weight: 700; flex-shrink: 0; }
  .vtag { color: var(--accent); font-size: .68rem; }
  #authCard input { background: var(--input-bg); color: var(--fg); border: 1px solid var(--border2); border-radius: 7px; padding: 7px 9px; font: inherit; width: 100%; }
  #authCard .field { display: flex; flex-direction: column; gap: 3px; color: var(--muted); }
  #authCard button { background: #1f6feb; color: #fff; border: 0; border-radius: 7px; padding: 7px; font: inherit; cursor: pointer; font-size: .78rem; }
  #authCard .switch { color: var(--accent); cursor: pointer; text-align: center; font-size: .72rem; }
  #userInfo { font-size: .78rem; color: var(--muted); }
  #userInfo b { color: var(--fg); }
  /* admin */
  #adminMenu { background: var(--panel); color: var(--fg); border: 1px solid var(--border2); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: .78rem; cursor: pointer; }
  .barRow { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: .78rem; }
  .barLabel { width: 120px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .barTrack { flex: 1; background: var(--input-bg); border-radius: 4px; height: 14px; overflow: hidden; }
  .barFill { height: 100%; background: var(--accent); border-radius: 4px; }
  .barVal { width: 70px; text-align: right; color: var(--faint); font-size: .7rem; }
  .statGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .statBox { background: var(--panel); border: 1px solid var(--border2); border-radius: 8px; padding: 8px 10px; }
  .statBox .n { font-size: 1.1rem; font-weight: 700; color: var(--fg); }
  .statBox .l { font-size: .68rem; color: var(--muted); }
  table.admin { width: 100%; border-collapse: collapse; font-size: .78rem; }
  table.admin td, table.admin th { padding: 5px 6px; border-bottom: 1px solid var(--border); text-align: left; }
  #adminView { display: none; flex: 1; overflow: auto; padding: 16px 20px; }
  #adminView .card { max-width: 560px; background: var(--panel); border: 1px solid var(--border2); border-radius: 12px; padding: 16px 18px; }
  #adminView .card h2 { margin: 0 0 12px; font-size: 1.05rem; }
  #adminView .card .field { display: flex; flex-direction: column; gap: 3px; color: var(--muted); margin-bottom: 8px; }
  #adminView .card input { background: var(--input-bg); color: var(--fg); border: 1px solid var(--border2); border-radius: 7px; padding: 7px 9px; font: inherit; width: 100%; }
  #adminView .card button { background: #1f6feb; color: #fff; border: 0; border-radius: 7px; padding: 7px 14px; font: inherit; cursor: pointer; }
  #adminView .card button:hover { background: #388bfd; }
  .formErr { color: #f85149; font-size: .78rem; min-height: 1em; margin-top: 6px; }
  .donutRow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 4px; }
  .donutBox { background: var(--panel); border: 1px solid var(--border2); border-radius: 10px; padding: 10px 12px; }
  .donutBox h4 { margin: 0 0 8px; font-size: .78rem; color: var(--muted); font-weight: 600; }
  .donut { display: flex; gap: 12px; align-items: center; }
  .donut svg { width: 88px; height: 88px; flex-shrink: 0; }
  .donutTotal { font-size: 6px; font-weight: 700; fill: var(--fg); }
  .legend { font-size: .72rem; color: var(--muted); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .legRow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legRow .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; flex-shrink: 0; }
  .pager { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: .76rem; color: var(--muted); }
  .pager input { background: var(--input-bg); color: var(--fg); border: 1px solid var(--border2); border-radius: 7px; padding: 5px 9px; font: inherit; font-size: .76rem; width: 200px; }
  .pager button { background: var(--panel); color: var(--fg); border: 1px solid var(--border2); border-radius: 6px; padding: 3px 9px; font: inherit; font-size: .74rem; cursor: pointer; }
  .pager button:disabled { opacity: .4; cursor: default; }
  .modalWrap { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: var(--panel); border: 1px solid var(--border2); border-radius: 12px; padding: 18px 20px; width: min(460px, 92vw); }
  .modal h3 { margin: 0 0 10px; font-size: 1rem; color: var(--fg); }
  .modal .field { display: flex; flex-direction: column; gap: 3px; color: var(--muted); margin-bottom: 8px; font-size: .78rem; }
  .modal input { background: var(--input-bg); color: var(--fg); border: 1px solid var(--border2); border-radius: 7px; padding: 7px 9px; font: inherit; width: 100%; }
  .modal .row { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 10px; }
  .modal .row .spacer { flex: 1; }
  .modal button { background: #1f6feb; color: #fff; border: 0; border-radius: 7px; padding: 7px 14px; font: inherit; cursor: pointer; }
  .modal .copyStatus { color: var(--muted); font-size: .74rem; }
  .gws-hidden { display: none !important; }
  .empty b { color: var(--fg); font-size: 1.05rem; display: block; margin-bottom: 6px; }
</style>
</head>
<body>
<aside>
  <div class="brand">co-workspace <span>teams</span></div>
  <button class="newbtn" id="newTeam">＋ New team</button>
  <div class="sidetitle" style="display:flex; align-items:center; justify-content:space-between;">SESSIONS
    <button class="collapsebtn" id="groupToggle" title="Switch between variant and recency grouping" aria-pressed="true" style="font-size:.64rem; letter-spacing:0;">variant ▾</button>
  </div>
  <div id="sessions"></div>
  <div id="authCard"></div>
</aside>
<section>
  <header>
    <button class="collapsebtn" id="collapseLeft" title="Toggle sidebar">☰</button>
    <span class="pname" id="pnameLabel" style="flex:1"></span>
    <button id="adminMenu" class="gws-hidden">⚙ Admin</button>
    <button class="collapsebtn" id="themeBtn" title="Toggle theme">◐</button>
    <button class="collapsebtn" id="collapseRight" title="Toggle artifacts panel">▤ Artifacts</button>
  </header>
  <div id="adminView"></div>
  <div id="log">
    <div class="empty">
      <b>What can the team do for you?</b>
      Create a team from a variant, then chat — teams are private to you and reused when you return.
      <div class="chips">
        <button type="button" class="chip" data-fill="Analyze this data and summarize the key findings">📊 Analyze data</button>
        <button type="button" class="chip" data-fill="Draft a project plan with milestones and owners">📋 Draft a plan</button>
        <button type="button" class="chip" data-fill="Research this topic and summarize what you find">🔍 Research</button>
        <button type="button" class="chip" data-fill="Review this document and suggest improvements">✍️ Review a doc</button>
      </div>
    </div>
  </div>
  <form class="composer" id="composer">
    <div class="composerBox">
      <textarea id="message" rows="1" placeholder="Ask the team…"></textarea>
      <div class="composerTools">
        <select id="model" aria-label="Variant" class="modelPick"></select>
        <span style="flex:1"></span>
        <button type="button" id="stopBtn" class="stopBtn hidden">■ Stop</button>
        <button type="submit" id="send" class="sendBtn">Send</button>
      </div>
    </div>
  </form>
</section>
<aside id="artifacts">
  <div class="tabs">
    <button data-tab="files" class="active">Files</button>
    <button data-tab="preview">Preview</button>
    <button data-tab="history">History</button>
  </div>
  <div class="content" id="artifactsContent"></div>
</aside>
<script type="module">
  // T-20260928-012: pure helpers (donut slice math, recency grouping) live in
  // /app-helpers.js so they can be unit-tested without a browser.
  import { prepareDonutSlices, RECENCY_GROUP_ORDER, recencyGroupLabel } from "./app-helpers.js";
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  const modelSel = $("model"), sessionsEl = $("sessions"), log = $("log"),
        form = $("composer"), input = $("message"), send = $("send"),
        pnameLabel = $("pnameLabel");
  let catalog = [];   // full variant catalog (New-team modal)
  let myTeams = [];   // the signed-in user's teams (composer select + sidebar)
  let currentTenantId = "";
  // Single provisioning poller per tenant — the double-select (createTeam's explicit
  // selectSession + loadSessions's boot-select of the same new team) used to start two
  // polls, double the "ready" bubble, and double-fire loadSessions on completion.
  let provisionPollTimer = null;
  let currentModel = "";
  let me = null;
  let currentUserName = () => (me?.loginId ?? "default");

  function bubble(role, text = "") {
    document.querySelector(".empty")?.remove();
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  // R7: /v1/models is the creation catalog; the composer select is driven by the user's
  // teams (renderTeamSelect) so only created teams are chattable.
  async function loadModels() {
    const body = await (await fetch("/v1/models")).json();
    catalog = body.data ?? [];
  }

  // R7: the composer targets a team; switching the select switches teams.
  function renderTeamSelect() {
    modelSel.innerHTML = "";
    for (const t of myTeams) {
      const opt = document.createElement("option");
      opt.value = t.tenantId;
      opt.textContent = t.variant + (t.name ? ` · ${t.name}` : "");
      modelSel.appendChild(opt);
    }
    if (currentTenantId) modelSel.value = currentTenantId;
  }
  modelSel.addEventListener("change", () => {
    const team = myTeams.find((t) => t.tenantId === modelSel.value);
    if (team) selectSession(team);
  });

  // R7: explicit team creation from the catalog (beta behind its own toggle, persisted).
  function openNewTeamModal(presetMessage = "") {
    const authHeaders = { "content-type": "application/json", "x-requested-with": "co-workspace" };
    const wrap = showModal({ title: "New team", bodyHtml: `
      <div class="field"><input id="nt-name" placeholder="Team name (optional)"></div>
      <label class="betaPick" style="margin: 2px 0 8px;"><input type="checkbox" id="nt-beta" style="width:auto"> include beta variants</label>
      <div id="nt-list" style="display:flex; flex-direction:column; gap:6px; max-height:280px; overflow:auto;"></div>
      <div class="formErr" id="nt-err" role="alert"></div>
      <div class="row"><span class="spacer"></span><button id="nt-close" type="button" style="background:transparent;color:var(--muted);border:1px solid var(--border2);">Close</button></div>` });
    const betaBox2 = wrap.querySelector("#nt-beta");
    betaBox2.checked = localStorage.getItem("gw-beta") === "1";
    const renderList = () => {
      const list = catalog.filter((m) => betaBox2.checked || m.meta?.status !== "beta");
      wrap.querySelector("#nt-list").innerHTML = list
        .map((m) => `<button type="button" class="ntOption" data-variant="${esc(m.id)}">${esc(m.id)}${m.meta?.status === "beta" ? " · beta" : ""}</button>`)
        .join("") || `<div class="hint">No variants available.</div>`;
      for (const b of wrap.querySelectorAll(".ntOption")) {
        b.addEventListener("click", () => createTeam(b.dataset.variant));
      }
    };
    betaBox2.addEventListener("change", () => { localStorage.setItem("gw-beta", betaBox2.checked ? "1" : "0"); renderList(); });
    wrap.querySelector("#nt-close").addEventListener("click", () => wrap.remove());
    const createTeam = async (variant) => {
      const name = wrap.querySelector("#nt-name").value.trim();
      const res = await fetch("/sessions", { method: "POST", headers: authHeaders, body: JSON.stringify({ variant, name: name || undefined }) });
      const body = await res.json().catch(() => ({}));
      if (res.status === 202 || res.status === 200) {
        wrap.remove();
        await loadSessions();
        const team = myTeams.find((t) => t.tenantId === body.tenantId);
        if (team) selectSession(team);
        if (presetMessage) { input.value = presetMessage; form.requestSubmit(); }
      } else {
        wrap.querySelector("#nt-err").textContent = `⚠ ${body.error ?? "team creation failed"}`;
        if (presetMessage) input.value = presetMessage; // never lose the typed message
      }
    };
    renderList();
  }
  $("newTeam").addEventListener("click", () => openNewTeamModal());

  // Untitled legacy sessions predate auto-titling — never expose raw thread ids as names.
  const displayName = (t) => t.name || (t.status === "failed" ? "Failed session" : "New chat");

  // User-reported duplicate-sidebar fix (2026-09-29): two concurrent loadSessions
  // calls (the provisioning poll firing loadSessions while createTeam's own call is
  // still in flight) interleave as clear→clear→fetch→fetch→render→render and paint
  // the same group twice. A render generation guard makes the newest call win and
  // stale loads abort before rendering.
  let loadSessionsSeq = 0;
  async function loadSessions() {
    const seq = ++loadSessionsSeq;
    sessionsEl.innerHTML = "";
    let mine = [];
    try {
      const res = await fetch("/tenants?mine=1");
      // Signed-out visitors get a 302 to /login (HTML), not a JSON body — treat as empty.
      if (res.ok) mine = ((await res.json()).tenants ?? []).slice().reverse();
    } catch { /* network hiccup — show the empty list */ }
    if (seq !== loadSessionsSeq) return; // superseded — never paint a stale snapshot
    myTeams = mine;
    renderTeamSelect();
    // R6: variant grouping by default (catalog order, recency inside, collapsible);
    // the persisted toggle flips back to the recency grouping.
    const grouping = localStorage.getItem("gw-grouping") ?? "variant";
    const groups = new Map();
    if (grouping === "variant") {
      for (const t of mine) {
        const g = groups.get(t.variant) ?? [];
        g.push(t);
        groups.set(t.variant, g);
      }
      const catalogOrder = catalog.map((m) => m.id);
      const labels = [...groups.keys()].sort((a, b) => {
        const ia = catalogOrder.indexOf(a), ib = catalogOrder.indexOf(b);
        return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib) || a.localeCompare(b);
      });
      for (const label of labels) emitGroup(label, groups.get(label), grouping === "variant");
    } else {
      for (const t of mine) {
        const label = recencyGroupLabel(t.createdAt);
        (groups.get(label) ?? groups.set(label, []).get(label)).push(t);
      }
      for (const label of RECENCY_GROUP_ORDER.filter((l) => groups.has(l))) emitGroup(label, groups.get(label), false);
    }
    if (mine.length === 0) {
      sessionsEl.innerHTML = '<div class="hint" style="padding:6px 4px;">No teams yet — create one to start.</div>';
    }
    // Boot/reload: the composer shows a team, so it must actually BE selected (ChatGPT
    // pattern — reopen the most recent team); otherwise a send would hit "no team".
    if (!currentTenantId && myTeams.length > 0) selectSession(myTeams[0]);
  }

  // R-UX: deleting a whole variant group requires an explicit "files secured" ack — the
  // teams' project files and history are removed permanently.
  function confirmVariantDelete(variant, tenants) {
    const list = tenants
      .map((t) => `<div style="padding:1px 0;">• ${esc(displayName(t))} — ${t.sessions} turns</div>`)
      .join("");
    const wrap = showModal({ title: `Delete ${variant} teams`, bodyHtml: `
      <div class="field">This permanently deletes ${tenants.length} team(s) of this variant — including all project files and history:</div>
      <div class="field">${list}</div>
      <label class="field" style="flex-direction:row; align-items:center; gap:6px;"><input type="checkbox" id="vd-ack" style="width:auto"> I have secured the files I need</label>
      <div class="formErr" id="vd-err" role="status"></div>
      <div class="row"><span class="spacer"></span><button id="vd-cancel" type="button" style="background:transparent;color:var(--muted);border:1px solid var(--border2);">Cancel</button><button id="vd-go" disabled>Delete teams</button></div>` });
    const ack = wrap.querySelector("#vd-ack");
    const go = wrap.querySelector("#vd-go");
    ack.addEventListener("change", () => { go.disabled = !ack.checked; });
    wrap.querySelector("#vd-cancel").addEventListener("click", () => wrap.remove());
    go.addEventListener("click", async () => {
      go.disabled = true;
      const err = wrap.querySelector("#vd-err");
      for (const t of tenants) {
        const res = await fetch(`/tenants/${t.tenantId}`, { method: "DELETE", headers: { "x-requested-with": "co-workspace" } });
        if (res.status !== 200) {
          const body = await res.json().catch(() => ({}));
          err.textContent = `⚠ ${body.error ?? "delete failed"}`;
          go.disabled = false;
          return;
        }
      }
      if (tenants.some((t) => t.tenantId === currentTenantId)) currentTenantId = "";
      wrap.remove();
      loadSessions();
    });
  }

  function emitGroup(label, tenants, collapsible) {
    let collapsedMap = {};
    try { collapsedMap = JSON.parse(localStorage.getItem("gw-collapsed-groups") || "{}"); } catch { /* ignore */ }
    const isCollapsed = Boolean(collapsedMap[label]);
    const head = document.createElement("div");
    head.className = "grouphead" + (collapsible ? " gtoggle" : "");
    sessionsEl.appendChild(head);
    if (collapsible) {
      head.style.display = "flex";

      head.appendChild(groupDel);
      head.addEventListener("click", () => {

      const todayBadge = collapsible && new Date(t.createdAt).toDateString() === today ? '<span class="todayBadge">Today</span>' : "";
      // In variant grouping the row sits inside its variant group — the tag would be redundant.
      const meta = collapsible
        ? `${t.sessions} turns`
        : `<span class="vtag">${esc(t.variant)}</span> · ${t.sessions} turns`;
      row.innerHTML = `<div><div class="nm">${esc(name)}${tag}${todayBadge}</div>` +
        `<div class="meta">${meta}</div></div>`;

        del.addEventListener("click", async (e) => {

          const res = await fetch(`/tenants/${t.tenantId}`, { method: "DELETE", headers: { "x-requested-with": "co-workspace" } });
          if (res.status === 200) {
            if (t.tenantId === currentTenantId) { currentTenantId = ""; pnameLabel.textContent = ""; }
            loadSessions();
          }

  async function selectSession(t) {
    if (currentTenantId === t.tenantId && provisionPollTimer) return; // already watching this provisioning tenant
    currentTenantId = t.tenantId;
    currentModel = t.variant;
    modelSel.value = t.tenantId;
    const name = displayName(t);
    const usage = t.usage ? ` · ${t.usage.inputTokens ?? 0}→${t.usage.outputTokens ?? 0} tok` : "";
    pnameLabel.innerHTML = `project: <b>${esc(name)}</b> · ${t.sessions} turns${usage}`;
    log.innerHTML = "";
    // QA-09: replay recent turns as read-only bubbles
    try {
      const { turns } = await (await fetch(`/tenants/${t.tenantId}/history`)).json();
      for (const turn of turns.slice(-10).reverse()) {
        if (turn.finalText) bubble("assistant", `[#${turn.seq}] ${turn.finalText}`);
      }
    } catch { /* history is best-effort */ }
    if (t.status === "provisioning") {
      // R7: a freshly created team streams its provisioning stages into the log until ready.
      const note = bubble("assistant", "⏳ Preparing the team workspace…");
      if (provisionPollTimer) { clearInterval(provisionPollTimer); provisionPollTimer = null; }
      const timer = setInterval(async () => {
        if (currentTenantId !== t.tenantId) { clearInterval(timer); provisionPollTimer = null; return; }
        const d = await (await fetch(`/tenants/${t.tenantId}`)).json().catch(() => null);
        if (!d) return;
        const last = d.progress?.[d.progress.length - 1];
        note.textContent = `⏳ [${last?.stage ?? "preparing"}] ${last?.label ?? "…"}`;
        if (d.status === "ready") {
          clearInterval(timer); provisionPollTimer = null;
          note.textContent = `✔ Team "${name}" is ready — send your first message below.`;
          loadSessions();
        } else if (d.status === "failed") {
          clearInterval(timer); provisionPollTimer = null;
          note.textContent = `⚠ Team provisioning failed: ${d.error ?? "unknown"} — delete it and create a new team.`;
          loadSessions();
        }
      }, 1000);
      provisionPollTimer = timer;
    } else {
      bubble("assistant", `Resumed "${name}" (${t.variant}) — ${t.sessions} earlier turns. Continue below.`);
    }
    document.querySelectorAll(".sess").forEach((el) => el.classList.toggle("active", el.dataset.tid === currentTenantId));
  }



  // QA-07: Stop button while a turn is streaming (lives in the composer tools)
  $("stopBtn").addEventListener("click", async () => {
    if (!currentTenantId) return;
    await fetch(`/tenants/${currentTenantId}/cancel`, {
      method: "POST",

    });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    if (!currentTenantId) { openNewTeamModal(message); return; }
    input.value = ""; send.disabled = true;
    $("stopBtn").classList.remove("hidden");
    bubble("user", message);
    const reply = bubble("assistant");
    reply.classList.add("pending");
    try {
      // R7: chat targets the selected team explicitly — the web surface never auto-creates.
      const res = await fetch(`/tenants/${currentTenantId}/chat`, {
        method: "POST",
        headers: { "content-type": "application/json", "x-requested-with": "co-workspace" },
        body: JSON.stringify({ message }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: res.statusText }));
        if (res.status === 404) { currentTenantId = ""; loadSessions(); }
        throw new Error(err.error ?? `HTTP ${res.status}`);
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "", first = true;
      let progressNote = null;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buffer.indexOf("\n\n")) >= 0) {
          const frame = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 2);
          for (const line of frame.split("\n")) {
            if (!line.startsWith(": provisioning:")) continue;
            // Live provisioning stages while the team prepares (R7 feedback).
            if (!progressNote) {
              progressNote = document.createElement("div");
              progressNote.className = "progress-inline";
              log.insertBefore(progressNote, reply);
            }
            progressNote.textContent = "⏳ " + line.replace(": provisioning: ", "");
          }
          if (!frame.startsWith("data: ")) continue;
          const payload = JSON.parse(frame.slice(6));
          if (payload.type === "text" && typeof payload.text === "string") {
            reply.classList.remove("pending");
            reply.textContent += payload.text;
            log.scrollTop = log.scrollHeight;
          } else if (payload.type === "error") {
            throw new Error(payload.error ?? "stream error");
          } else if (payload.type === "tool_use") {
            if (!first) reply.classList.add("pending");
          }
          // "done" and tool_result/system events need no UI of their own — the reply
          // accumulates from text deltas, matching the raw stream contract.
        }
      }
      loadSessions();
    } catch (err) {
      reply.textContent += (reply.textContent ? "\n\n" : "") + `⚠ ${err.message}`;
    } finally {
      reply.classList.remove("pending");
      applyComposerLock();
      $("stopBtn").classList.add("hidden");
    }
  });

  // R-UX: drag the panel edges to resize (persisted per browser, like the collapse state).
  function makeResizable(el, side, storageKey, min, max) {
    const handle = document.createElement("div");
    handle.className = "rz";
    handle.style[side] = "0";
    el.appendChild(handle);
    handle.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      handle.setPointerCapture(e.pointerId);
      handle.classList.add("active");
      const startX = e.clientX;
      const startW = el.getBoundingClientRect().width;
      const move = (ev) => {
        const delta = side === "right" ? ev.clientX - startX : startX - ev.clientX;
        const w = Math.max(min, Math.min(max, startW + delta));
        el.style.width = w + "px";
        el.style.minWidth = w + "px";
      };
      const up = () => {
        handle.classList.remove("active");
        handle.removeEventListener("pointermove", move);
        handle.removeEventListener("pointerup", up);
        localStorage.setItem(storageKey, String(el.getBoundingClientRect().width));
      };
      handle.addEventListener("pointermove", move);
      handle.addEventListener("pointerup", up);
    });
    const saved = localStorage.getItem(storageKey);
    if (saved) { const w = Math.max(min, Math.min(max, Number(saved))); el.style.width = w + "px"; el.style.minWidth = w + "px"; }
  }
  makeResizable(document.querySelector("aside"), "right", "gw-sidebar-w", 200, 420);

  async function loadPreviewTab(filePath) {

  const historyCache = new Map();
  async function loadHistoryTab() {
    const tenantId = currentTenantForArtifacts();

    historyCache.set(tenantId, { sessions: detail.sessions, turns });

  // Clipboard ladder: secure-context async API → execCommand fallback (LAN http) → manual hint.
  async function copyText(text, input, statusEl) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else if (input) {
        input.focus(); input.select();
        if (!document.execCommand("copy")) throw new Error("execCommand refused");
      } else {
        throw new Error("no fallback input");
      }
      statusEl.textContent = "Copied to clipboard.";
    } catch {
      if (input) { input.focus(); input.select(); }
      statusEl.textContent = "Copy unavailable here — text selected: press Ctrl-C / Cmd-C.";

  }

      `<div class="switch" id="toLogin">← Back to sign in</div>` +
      `<div class="field" id="verifyRow" style="display:none;"><input id="verify-key" placeholder="Verification key from mail"><button id="verifyBtn">Activate</button></div>` +
      `<div class="hint">A verification mail is generated to the outbox; enter its key here to activate. Your email is discarded after verification (only a hash is kept).</div>`;
    $("signupBtn").addEventListener("click", async () => {
      const res = await fetch("/auth/signup", {
        method: "POST",
        headers: { "content-type": "application/json", "x-requested-with": "co-workspace" },
        body: JSON.stringify({ loginId: $("su-id").value, email: $("su-email").value, password: $("su-pw").value }),
      });
      const body = await res.json();
      if (res.status === 200) {
        $("verifyRow").style.display = "flex";
        $("signupBtn").disabled = true;
        bubble("assistant", "✉ " + body.message);
      } else {
        bubble("assistant", `⚠ ${body.error ?? "signup failed"}`);
      }
    });
    $("verifyBtn").addEventListener("click", async () => {
      const res = await fetch("/auth/verify", {
        method: "POST",
        headers: { "content-type": "application/json", "x-requested-with": "co-workspace" },
        body: JSON.stringify({ token: $("verify-key").value }),
      });
      const body = await res.json();
      bubble("assistant", res.status === 200 ? `✔ ${body.message}` : `⚠ ${body.error}`);
      if (res.status === 200) renderAuthCard();
    });
    $("toLogin").addEventListener("click", renderAuthCard);
  }

  // R3: account modal — password change (popup, current credential required) and
  // self-service email change (verification key from the outbox mail). The display-name
  // self-edit form was removed (renames are an admin action now).
  function renderAccountModal() {
    const wrap = showModal({ title: `Account — @${me?.loginId ?? ""}`, bodyHtml: `
      <h3 style="font-size:.85rem; margin: 12px 0 6px;">Change password</h3>
      <div class="field"><input id="ac-cur" type="password" placeholder="Current password" autocomplete="current-password"></div>
      <div class="field"><input id="ac-new" type="password" placeholder="New password (8+)" autocomplete="new-password"></div>
      <div class="field"><input id="ac-new2" type="password" placeholder="Repeat new password" autocomplete="new-password"></div>
      <div class="row" style="justify-content:flex-start;"><button id="ac-pw-save">Change password</button></div>
      <div class="formErr" id="ac-pw-err" role="alert"></div>
      <h3 style="font-size:.85rem; margin: 14px 0 6px;">Change email</h3>
      <div class="field"><input id="ac-email" type="email" placeholder="New email (a verification key will be sent)" autocomplete="email"></div>
      <div class="row" style="justify-content:flex-start;"><button id="ac-email-send" class="ghost" style="background:transparent;color:var(--fg);border:1px solid var(--border2);">Send verification</button></div>
      <div class="field" id="ac-verify-row" style="display:none;"><input id="ac-verify-key" placeholder="Verification key from the mail"></div>
      <div class="row" style="justify-content:flex-start; display:none;" id="ac-verify-rowbtn"><button id="ac-email-verify">Confirm email</button></div>
      <div class="formErr" id="ac-email-err" role="alert"></div>
      <h3 style="font-size:.85rem; margin: 14px 0 6px;">Sessions</h3>
      <div id="ac-sessions" class="hint" style="margin:0 0 6px;">loading…</div>
      <div class="row" style="justify-content:flex-start; gap:8px;">
        <button id="ac-sess-others" class="ghost" style="background:transparent;color:var(--fg);border:1px solid var(--border2);">Sign out other sessions</button>
        <button id="ac-sess-all" style="color:#f85149;background:transparent;border:1px solid var(--border2);">Sign out everywhere</button>
      </div>
      <div class="formErr" id="ac-sess-err" role="alert"></div>
      <div class="row"><span class="spacer"></span><button id="ac-close" type="button" style="background:transparent;color:var(--muted);border:1px solid var(--border2);">Close</button></div>` });
    const authHeaders = { "content-type": "application/json", "x-requested-with": "co-workspace" };
    wrap.querySelector("#ac-close").addEventListener("click", () => wrap.remove());
    // session-hardening D7: list + revoke the caller's sessions
    const sessList = wrap.querySelector("#ac-sessions");
    const sessErr = wrap.querySelector("#ac-sess-err");
    async function refreshSessions() {
      try {
        const body = await (await fetch("/auth/sessions", { headers: authHeaders })).json();
        sessList.innerHTML = (body.sessions ?? []).map((x) =>
          `${x.current ? "<b>this session</b>" : "other session"} — last active ${esc(String(x.lastActive).slice(0, 16).replace("T", " "))} UTC`).join("<br>") || "no sessions";
      } catch { sessList.textContent = "could not load sessions"; }
    }
    refreshSessions();
    wrap.querySelector("#ac-sess-others").addEventListener("click", async () => {
      const res = await fetch("/auth/sessions/revoke-others", { method: "POST", headers: authHeaders });
      const body = await res.json().catch(() => ({}));
      sessErr.style.color = res.status === 200 ? "#3fb950" : "#f85149";
      sessErr.textContent = res.status === 200 ? `✔ ${body.message}` : `⚠ ${body.error ?? "revoke failed"}`;
      if (res.status === 200) refreshSessions();
    });
    wrap.querySelector("#ac-sess-all").addEventListener("click", async () => {
      const res = await fetch("/auth/sessions/revoke-all", { method: "POST", headers: authHeaders });
      if (res.status === 200) { wrap.remove(); location.href = "/login"; }
      else sessErr.textContent = "⚠ revoke-all failed";
    });
    wrap.querySelector("#ac-pw-save").addEventListener("click", async () => {
      const err = wrap.querySelector("#ac-pw-err");
      err.textContent = "";
      const cur = wrap.querySelector("#ac-cur").value;
      const a = wrap.querySelector("#ac-new").value;
      const b = wrap.querySelector("#ac-new2").value;
      if (!cur) { err.textContent = "⚠ Current password is required."; return; }
      if (a.length < 8) { err.textContent = "⚠ New password must be at least 8 characters."; return; }
      if (a !== b) { err.textContent = "⚠ New passwords do not match."; return; }
      const res = await fetch("/auth/me", { method: "PATCH", headers: authHeaders, body: JSON.stringify({ currentPassword: cur, password: a }) });
      if (res.status === 200) {
        err.textContent = "";
        err.style.color = "#3fb950";
        err.textContent = "✔ Password changed. Other sessions were signed out.";
      } else {
        const body = await res.json().catch(() => ({}));
        err.textContent = `⚠ ${body.error ?? `change failed (HTTP ${res.status})`}`;
      }
    });
    wrap.querySelector("#ac-email-send").addEventListener("click", async () => {
      const err = wrap.querySelector("#ac-email-err");
      err.textContent = "";
      err.style.color = "";
      const res = await fetch("/auth/email/change", { method: "POST", headers: authHeaders, body: JSON.stringify({ email: wrap.querySelector("#ac-email").value }) });
      const body = await res.json().catch(() => ({}));
      if (res.status === 200) {
        wrap.querySelector("#ac-verify-row").style.display = "flex";
        wrap.querySelector("#ac-verify-rowbtn").style.display = "flex";
        err.textContent = `✔ ${body.message}`;
        err.style.color = "#3fb950";
      } else {
        err.textContent = `⚠ ${body.error ?? "request failed"}`;
      }
    });
    wrap.querySelector("#ac-email-verify").addEventListener("click", async () => {
      const err = wrap.querySelector("#ac-email-err");
      err.textContent = "";
      err.style.color = "";
      const res = await fetch("/auth/email/verify", { method: "POST", headers: authHeaders, body: JSON.stringify({ token: wrap.querySelector("#ac-verify-key").value.trim() }) });
      const body = await res.json().catch(() => ({}));
      if (res.status === 200) {
        err.style.color = "#3fb950";
        err.textContent = "✔ Email updated.";
      } else {
        err.textContent = `⚠ ${body.error ?? "verification failed"}`;
      }
    });
  }

  // R1 forced rotation: a must-change session (admin-issued temp credential) gets a
  // blocking dialog — no overlay click-away, no app use until a new password is set.
  // The rotation PATCH omits currentPassword (the temp credential was verified at
  // sign-in) and invalidates every OTHER session server-side; the rotating session
  // survives, so after the save the app continues signed in as the same user
  // (2026-10-02 rotation-keeps-session design — no drop to the signed-out card).
  function forcePasswordChange() {
    const wrap = showModal({ title: "Set a new password", dismissible: false, bodyHtml: `
      <div class="hint">Your sign-in used a temporary password. Choose a new one to continue.</div>
      <div class="field"><input id="fc-new" type="password" placeholder="New password (8+)" autocomplete="new-password"></div>
      <div class="field"><input id="fc-new2" type="password" placeholder="Repeat new password" autocomplete="new-password"></div>
      <div class="row" style="justify-content:flex-start;"><button id="fc-save">Save and continue</button></div>
      <div class="formErr" id="fc-err" role="alert"></div>` });
    const err = wrap.querySelector("#fc-err");
    wrap.querySelector("#fc-save").addEventListener("click", async () => {
      err.textContent = "";
      err.style.color = "";
      const a = wrap.querySelector("#fc-new").value;
      const b = wrap.querySelector("#fc-new2").value;
      if (a.length < 8) { err.textContent = "⚠ New password must be at least 8 characters."; return; }
      if (a !== b) { err.textContent = "⚠ New passwords do not match."; return; }
      const res = await fetch("/auth/me", { method: "PATCH", headers: { "content-type": "application/json", "x-requested-with": "co-workspace" }, body: JSON.stringify({ password: a }) });
      const body = await res.json().catch(() => ({}));
      if (res.status === 200) {
        wrap.remove();
        me = body.user ?? me;
        renderAuthCard();
        applyAdminVisibility();
        applyComposerLock();
        loadSessions();
        bubble("assistant", "✔ password updated — other sessions were signed out");
      } else {
        err.textContent = `⚠ ${body.error ?? `change failed (HTTP ${res.status})`}`;
      }
    });
  }

  async function doLogin(id, pw) {
    const res = await fetch("/auth/login", {
      method: "POST",
      headers: { "content-type": "application/json", "x-requested-with": "co-workspace" },
      body: JSON.stringify({ loginId: id, password: pw }),
    });
    const body = await res.json();
    if (res.status === 200) {
      me = body.user;
      renderAuthCard();
      applyAdminVisibility();
      applyComposerLock();
      loadSessions();
      if (me.mustChangePassword) forcePasswordChange();
    } else {
      bubble("assistant", `⚠ ${body.error ?? "login failed"}`);
    }
  }

  function applyAdminVisibility() {
    adminMenu.classList.toggle("gws-hidden", me?.role !== "admin");
  }

  // ── admin panel with stats + graphs ──
  function barChart(rows, unit) {
    const max = Math.max(1, ...rows.map((r) => r[1]));
    return rows
      .map(
        ([label, val]) =>
          `<div class="barRow"><div class="barLabel" title="${esc(label)}">${esc(label)}</div>` +
          `<div class="barTrack"><div class="barFill" style="width:${(val / max) * 100}%"></div></div>` +
          `<div class="barVal">${val}${unit}</div></div>`,
      )
      .join("");
  }

  // R5: dependency-free SVG donut (stroke-dasharray on a ~100-unit circumference ring).
  // Top-7 slices + "others"; the legend carries the numbers (chart is the shape, table the detail).
  function donutChart(title, slices, unit) {
    const { top, total } = prepareDonutSlices(slices);
    const colors = ["#58a6ff", "#3fb950", "#d29922", "#f778ba", "#bc8cff", "#39c5cf", "#ff7b72", "#6e7681"];
    let offset = 25;
    const segs = top.map((sl, i) => {
      const pct = (sl.value / (total || 1)) * 100;
      const seg = `<circle r="15.9" cx="21" cy="21" fill="none" stroke="${colors[i % colors.length]}" stroke-width="6" stroke-dasharray="${pct} ${100 - pct}" stroke-dashoffset="${offset}"><title>${esc(sl.label)}: ${sl.value}${unit} (${pct.toFixed(0)}%)</title></circle>`;
      offset -= pct;
      return seg;
    });
    const legend = top
      .map((sl, i) => `<div class="legRow"><span class="dot" style="background:${colors[i % colors.length]}"></span>${esc(sl.label)} — <b>${sl.value}${unit}</b> · ${(sl.value / (total || 1) * 100).toFixed(0)}%</div>`)
      .join("");
    return `<div class="donutBox"><h4>${esc(title)}</h4><div class="donut">` +
      `<svg viewBox="0 0 42 42" role="img" aria-label="${esc(`${title}: ${top.map((sl) => `${sl.label} ${sl.value}${unit}`).join(", ")}`)}">${segs.join("")}<text x="21" y="24" text-anchor="middle" class="donutTotal">${total}</text></svg>` +
      `<div class="legend">${legend || '<div class="legRow">no data</div>'}</div></div></div>`;
  }

  adminMenu.addEventListener("click", async () => {
    const on = adminView.style.display === "block";
    if (on) {
      showView("chat");
      return;
    }
    showView("panel");
    adminView.innerHTML = "<div class='hint'>loading…</div>";
    const stats = await (await fetch("/admin/stats")).json();
    const users = (await (await fetch("/admin/users")).json()).users;
    const fmt = (b) => (b > 1e9 ? (b / 1e9).toFixed(1) + "GB" : b > 1e6 ? (b / 1e6).toFixed(1) + "MB" : b > 1e3 ? (b / 1e3).toFixed(0) + "KB" : b + "B");
    // R5: three composition donuts in one row; per-user rankings stay as bars (detail in the table).
    const donutRow = `<div class="donutRow">` +
      donutChart("Tenants by status", Object.entries(stats.tenantsPerStatusObject ?? stats.tenants).map(([label, value]) => ({ label, value })), "") +
      donutChart("Tenants by variant", stats.tenantsPerVariant.map((r) => ({ label: r.variant, value: r.count })), "") +
      donutChart("Users by state", Object.entries(stats.users).map(([label, value]) => ({ label, value })), "") +
      `</div>`;
    adminView.innerHTML =
      `<div class="statGrid">` +
      `<div class="statBox"><div class="n">${stats.users.active}</div><div class="l">active users</div></div>` +
      `<div class="statBox"><div class="n">${Object.values(stats.tenants).reduce((a, b) => a + b, 0)}</div><div class="l">tenants</div></div>` +
      `<div class="statBox"><div class="n">${fmt(stats.diskBytes)}</div><div class="l">disk usage</div></div>` +
      `</div>` +
      donutRow +
      `<h2 style="font-size:.85rem; margin-top:14px;">Tenants per user</h2>${barChart(stats.perUser.map((u) => [u.principal, u.tenantCount]), "")}` +
      `<h2 style="font-size:.85rem; margin-top:14px;">Disk usage per user</h2>${barChart(stats.perUser.map((u) => [u.principal, u.diskBytes]), "B")}` +
      `<h2 style="font-size:.85rem; margin-top:14px;">Users</h2>` +
      `<div class="pager"><input id="userSearch" placeholder="Search users…" aria-label="Search users"><span id="userPager"></span></div>` +
      `<table class="admin"><thead><tr><th>ID</th><th>Status</th><th>Tenants</th><th>Usage</th><th>Actions</th></tr></thead><tbody id="userRows"></tbody></table>`;
    // R5: client-side search + pager (25/page) — server-side pagination deferred past ~150 users.
    let userPage = 0;
    let userQuery = "";
    const userPageSize = 25;
    function renderUserTable() {
      const tbody = adminView.querySelector("#userRows");
      const pager = adminView.querySelector("#userPager");
      const q = userQuery.trim().toLowerCase();
      const filtered = users.filter((u) => !q || (u.loginId ?? u.principal).toLowerCase().includes(q) || (u.name ?? "").toLowerCase().includes(q));
      const pages = Math.max(1, Math.ceil(filtered.length / userPageSize));
      userPage = Math.max(0, Math.min(userPage, pages - 1));
      const slice = filtered.slice(userPage * userPageSize, userPage * userPageSize + userPageSize);
      tbody.innerHTML = slice
        .map((u) => {
          const pu = stats.perUser.find((p) => p.principal === (u.principal ?? u.loginId));
          return `<tr><td>${esc(u.loginId ?? u.principal)}${u.role === "admin" ? " ·admin" : ""}</td>` +
            `<td>${esc(u.status)}</td><td>${pu?.tenantCount ?? 0}</td><td>${fmt(pu?.diskBytes ?? 0)}</td>` +
            `<td><button class="collapsebtn" data-rename="${u.id}" data-name="${esc(u.loginId)}" data-cur="${esc(u.name)}">rename</button> ` +
            `<button class="collapsebtn" data-reset="${u.id}" data-name="${esc(u.loginId)}">reset pw</button> ` +
            `<button class="collapsebtn" data-del="${u.id}" style="color:#f85149;">delete</button></td></tr>`;
        })
        .join("") || `<tr><td colspan="5" class="hint">${q ? `No users match '${esc(userQuery)}'` : "No users yet"}</td></tr>`;
      pager.innerHTML = `${filtered.length} users — page ${userPage + 1}/${pages} ` +
        `<button id="u-prev" ${userPage === 0 ? "disabled" : ""}>‹</button><button id="u-next" ${userPage >= pages - 1 ? "disabled" : ""}>›</button>`;
      pager.querySelector("#u-prev").addEventListener("click", () => { userPage -= 1; renderUserTable(); });
      pager.querySelector("#u-next").addEventListener("click", () => { userPage += 1; renderUserTable(); });
      bindUserActions();
    }
    let searchTimer = 0;
    adminView.querySelector("#userSearch").addEventListener("input", (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { userQuery = e.target.value; userPage = 0; renderUserTable(); }, 250);
    });
    function bindUserActions() {
    for (const btn of adminView.querySelectorAll("[data-rename]")) {
      btn.addEventListener("click", () => {
        const wrap = showModal({ title: `Rename @${btn.getAttribute("data-name")}`, bodyHtml: `
          <div class="field"><input id="rn-val" value="${esc(btn.getAttribute("data-cur") ?? "")}" placeholder="Display name (1-80 chars)"></div>
          <div class="formErr" id="rn-err" role="alert"></div>
          <div class="row"><span class="spacer"></span><button id="rn-save">Save</button>
          <button id="rn-close" type="button" style="background:transparent;color:var(--muted);border:1px solid var(--border2);">Cancel</button></div>` });
        wrap.querySelector("#rn-close").addEventListener("click", () => wrap.remove());
        wrap.querySelector("#rn-val").focus();
        wrap.querySelector("#rn-save").addEventListener("click", async () => {
          const res = await fetch(`/admin/users/${btn.getAttribute("data-rename")}/name`, {
            method: "PATCH",
            headers: { "content-type": "application/json", "x-requested-with": "co-workspace" },
            body: JSON.stringify({ name: wrap.querySelector("#rn-val").value.trim() }),
          });
          if (res.status === 200) { wrap.remove(); adminMenu.click(); adminMenu.click(); }
          else { const body = await res.json().catch(() => ({})); wrap.querySelector("#rn-err").textContent = `⚠ ${body.error ?? "rename failed"}`; }
        });
      });
    }
    // session-hardening D7: destructive admin ops re-confirm the operator password
    // (x-admin-password header) — the server rejects without it (403).
    function askAdminPassword(title) {
      return new Promise((resolve) => {
        const wrap = showModal({ title, bodyHtml: `
          <div class="field">Confirm your password to run this action (session-hardening: destructive admin operations require re-authentication).</div>
          <div class="field"><input id="ap-val" type="password" autocomplete="current-password"></div>
          <div class="formErr" id="ap-err" role="alert"></div>
          <div class="row"><span class="spacer"></span><button id="ap-ok">Confirm</button>
          <button id="ap-cancel" type="button" class="ghost" style="background:transparent;color:var(--muted);border:1px solid var(--border2);">Cancel</button></div>` });
        const input = wrap.querySelector("#ap-val");
        input.focus();
        const done = (v) => { wrap.remove(); resolve(v); };
        wrap.querySelector("#ap-cancel").addEventListener("click", () => done(null));
        wrap.querySelector("#ap-ok").addEventListener("click", () => done(input.value));
        input.addEventListener("keydown", (e) => { if (e.key === "Enter") done(input.value); });
      });
    }
    for (const btn of adminView.querySelectorAll("[data-reset]")) {
      btn.addEventListener("click", async () => {
        const pw = await askAdminPassword(`Reset password for @${btn.getAttribute("data-name")} — confirm your password`);
        if (pw === null) return;
        const res = await fetch(`/admin/users/${btn.getAttribute("data-reset")}/reset-password`, { method: "POST", headers: { "x-requested-with": "co-workspace", "x-admin-password": pw } });
        const body = await res.json();
        if (res.status !== 200) { alert(body.error ?? "reset failed"); return; }
        const wrap = showModal({ title: `Temporary password for @${btn.getAttribute("data-name")}`, bodyHtml: `
          <div class="field">Give this one-time password to the user. It expires in 15 minutes and must be changed at first sign-in.</div>
          <div class="field"><input id="rp-val" readonly value="${esc(body.tempPassword)}" style="font-family: ui-monospace, monospace; letter-spacing: 1px;"></div>
          <div class="formErr" id="rp-err" role="status"></div>
          <div class="row"><span class="copyStatus" id="rp-status" role="status"></span><span class="spacer"></span>
          <button id="rp-copy" type="button">Copy</button><button id="rp-close" type="button" class="ghost" style="background:transparent;color:var(--muted);border:1px solid var(--border2);">Close</button></div>` });
        const val = wrap.querySelector("#rp-val");
        val.focus(); val.select();
        wrap.querySelector("#rp-copy").addEventListener("click", () => copyText(val.value, val, wrap.querySelector("#rp-status")));
        wrap.querySelector("#rp-close").addEventListener("click", () => wrap.remove());
      });
    }
    for (const btn of adminView.querySelectorAll("[data-del]")) {
      btn.addEventListener("click", async () => {
        const disposition = prompt(`Delete user — tenant disposition?\n'delete' = remove tenant files, 'archive' = keep (default)`, "archive");
        if (disposition === null) return;
        const pw = await askAdminPassword(`Delete @${btn.getAttribute("data-name")} — confirm your password`);
        if (pw === null) return;
        const res = await fetch(`/admin/users/${btn.getAttribute("data-del")}?tenants=${disposition === "delete" ? "delete" : "archive"}`, { method: "DELETE", headers: { "x-requested-with": "co-workspace", "x-admin-password": pw } });
        const body = await res.json();
        alert(`User deleted · tenants handled: ${body.tenantsHandled} (${body.disposition})`);
        adminMenu.click();
        adminMenu.click();
      });
    }
    }
    renderUserTable();
  });

  // auth state on load
  let googleConfiguredFlag = false;
  (async () => {
    const health = await (await fetch("/health")).json();
    googleConfiguredFlag = Boolean(health.googleSso);
    loginRequiredFlag = Boolean(health.loginRequired);
    const res = await fetch("/auth/me");
    if (res.status === 200) {
      me = (await res.json()).user;
      applyAdminVisibility();
      if (me.mustChangePassword) forcePasswordChange();
    }
    renderAuthCard();
    applyComposerLock();
  })();

  for (const chip of document.querySelectorAll(".chip")) {
    chip.addEventListener("click", () => openNewTeamModal(chip.dataset.fill));
  }

  // Enter sends, Shift+Enter breaks a line. isComposing guards the IME case: pressing
  // Enter to commit a Korean/Chinese candidate must not fire the message.
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      if (!send.disabled) form.requestSubmit();
    }
  });

  const groupToggle = $("groupToggle");
  function applyGroupToggle() {
    const grouping = localStorage.getItem("gw-grouping") ?? "variant";
    groupToggle.textContent = grouping === "variant" ? "variant ▾" : "recency ▾";
    groupToggle.setAttribute("aria-pressed", grouping === "variant" ? "true" : "false");
  }
  groupToggle.addEventListener("click", () => {
    localStorage.setItem("gw-grouping", (localStorage.getItem("gw-grouping") ?? "variant") === "variant" ? "recency" : "variant");
    applyGroupToggle();
    loadSessions();
  });
  applyGroupToggle();
  applyComposerLock();
  loadModels();
  loadSessions();
</script>
</body>
</html>
