<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>co-workspace</title>
<style>
  :root {
    --bg: #0d1117; --bg2: #10161d; --panel: #12181f; --border: #21262d; --border2: #30363d;
    --fg: #e6edf3; --muted: #8b949e; --faint: #6e7681; --accent: #58a6ff; --input-bg: #0d1117;
  }
  [data-theme="light"] {
    --bg: #f6f8fa; --bg2: #ffffff; --panel: #ffffff; --border: #d0d7de; --border2: #d8dee4;
    --fg: #1f2328; --muted: #656d76; --faint: #8c959f; --accent: #0969da; --input-bg: #ffffff;
  }
  :root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); height: 100vh; display: flex; overflow: hidden; }
  .collapsed-note { font-size: .7rem; color: #6e7681; writing-mode: vertical-rl; padding: 8px 2px; cursor: pointer; }
  /* right artifacts panel */
  #artifacts { width: 380px; min-width: 300px; border-left: 1px solid #21262d; display: flex; flex-direction: column; background: #10161d; }
  #artifacts .tabs { display: flex; border-bottom: 1px solid var(--border); }
  #artifacts .tabs button { flex: 1; background: transparent; color: #8b949e; border: 0; padding: 9px 4px; font: inherit; font-size: .78rem; cursor: pointer; }
  #artifacts .tabs button.active { color: #58a6ff; border-bottom: 2px solid #58a6ff; }
  #artifacts .content { flex: 1; overflow: auto; padding: 10px 12px; font-size: .82rem; }
  .fileRow { display: flex; justify-content: space-between; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
  .fileRow:hover { background: var(--panel); }
  .fileRow.dir { color: #79c0ff; font-weight: 600; }
  .fileRow .size { color: #6e7681; font-size: .7rem; }
  pre.preview { background: #0d1117; border: 1px solid #21262d; border-radius: 8px; padding: 10px; overflow: auto; max-height: 100%; white-space: pre-wrap; font-size: .78rem; }
  .turnRow { padding: 6px 8px; border-bottom: 1px solid #21262d; font-size: .78rem; }
  .turnRow .meta { color: #6e7681; font-size: .68rem; }
  .turnRow .txt { color: var(--fg); margin-top: 3px; }
  .collapsebtn { background: transparent; color: #8b949e; border: 0; cursor: pointer; font-size: .9rem; padding: 2px 6px; }
  .collapsebtn:hover { color: #58a6ff; }
  header .ctlgroup { display: flex; align-items: center; gap: 8px; }
  header label.check { display: flex; gap: 5px; align-items: center; font-size: .76rem; color: #8b949e; cursor: pointer; }
  header label.check input { width: auto; }
  .toast { position: fixed; top: 12px; right: 14px; background: #1c2a3a; border: 1px solid #1f6feb; color: var(--fg); border-radius: 8px; padding: 8px 14px; font-size: .8rem; z-index: 50; }
  .hint { color: #7d8590; }
  /* ── sidebar ── */
  aside { width: 260px; min-width: 220px; background: var(--bg2); border-right: 1px solid var(--border);
          display: flex; flex-direction: column; padding: 12px; gap: 10px; }
  .brand { font-weight: 700; font-size: .95rem; padding: 2px 4px 8px; }
  .brand span { color: #58a6ff; }
  .newbtn { background: #238636; color: #fff; border: 0; border-radius: 8px; padding: 9px; font: inherit; font-weight: 600; cursor: pointer; width: 100%; }
  .userbox { display: flex; flex-direction: column; gap: 4px; font-size: .74rem; color: #8b949e; }
  .userbox input { background: var(--bg); color: var(--fg); border: 1px solid #30363d; border-radius: 7px; padding: 7px 9px; font: inherit; }
  .userbox label.check { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .userbox input[type=checkbox] { width: auto; }
  #sessions { flex: 1; overflow-y: auto; border-top: 1px solid var(--border); padding-top: 8px; }
  .sess { padding: 8px 9px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .sess:hover { background: var(--panel); }
  .sess.active { background: var(--bg); outline: 1px solid var(--accent); }
  .sess .nm { font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess .meta { color: #6e7681; font-size: .68rem; }
  .sess .del { background: transparent; color: #f85149; border: 0; cursor: pointer; font-size: .75rem; padding: 2px 4px; visibility: hidden; }
  .sess:hover .del { visibility: visible; }
  .sess .del:hover { text-decoration: underline; }
  .sidetitle { font-size: .7rem; color: #8b949e; letter-spacing: .05em; }
  .grouphead { font-size: .72rem; color: #58a6ff; font-weight: 600; padding: 8px 4px 3px; letter-spacing: .03em; }
  /* ── main column ── */
  section { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  header select { background: var(--bg); color: var(--fg); border: 1px solid #30363d; border-radius: 8px; padding: 6px 9px; font: inherit; font-size: .85rem; }
  header .pname { color: var(--muted); font-size: .78rem; overflow: hidden; text-overflow: ellipsis; }
  header .pname b { color: var(--fg); }
  #log { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
  .msg { padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; line-height: 1.6; font-size: .92rem; max-width: 82%; }
  .user { background: color-mix(in srgb, var(--accent) 14%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 34%, transparent); align-self: flex-end; }
  .assistant { background: var(--panel); border: 1px solid var(--border2); align-self: stretch; max-width: 100%; }
  .assistant.pending::after { content: "▌"; color: #58a6ff; }
  .progress-inline { color: #e3b341; font-size: .8rem; }
  .composer { padding: 10px 16px 14px; }
  .composerBox { max-width: 780px; margin: 0 auto; background: var(--input-bg); border: 1px solid var(--border2);
                 border-radius: 16px; padding: 10px 12px 8px; }
  .composerBox:focus-within { outline: 1px solid var(--accent); }
  .composerTools { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .modelPick { background: transparent; color: var(--fg); border: 1px solid var(--border2); border-radius: 8px;
               padding: 4px 8px; font: inherit; font-size: .78rem; max-width: 180px; }
  .betaPick { font-size: .74rem; color: var(--muted); display: flex; gap: 4px; align-items: center; cursor: pointer; }
  .betaPick input { width: auto; }
  .sendBtn { background: #1f6feb; color: #fff; border: 0; border-radius: 10px; padding: 7px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  .sendBtn:disabled { opacity: .45; cursor: default; }
  .stopBtn { background: #8b1f1f; color: #fff; border: 0; border-radius: 10px; padding: 7px 14px; font: inherit; cursor: pointer; font-size: .78rem; }
  .stopBtn.hidden { display: none; }
  textarea { width: 100%; background: transparent; color: var(--fg); border: 0; font: inherit; min-height: 44px; resize: none; outline: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .chip { background: var(--panel); color: var(--fg); border: 1px solid var(--border2); border-radius: 999px;
          padding: 7px 14px; font: inherit; font-size: .8rem; cursor: pointer; }
  .chip:hover { outline: 1px solid var(--accent); }
  .empty { margin: auto; text-align: center; color: #6e7681; }
  /* auth card in sidebar */
  #authCard { border-top: 1px solid var(--border); padding-top: 8px; display: flex; flex-direction: column; gap: 6px; font-size: .78rem; }
  #authCard input { background: var(--input-bg); color: var(--fg); border: 1px solid var(--border2); border-radius: 7px; padding: 7px 9px; font: inherit; width: 100%; }
  #authCard .field { display: flex; flex-direction: column; gap: 3px; color: var(--muted); }
  #authCard button { background: #1f6feb; color: #fff; border: 0; border-radius: 7px; padding: 7px; font: inherit; cursor: pointer; font-size: .78rem; }
  #authCard .switch { color: var(--accent); cursor: pointer; text-align: center; font-size: .72rem; }
  #userInfo { font-size: .78rem; color: var(--muted); }
  #userInfo b { color: var(--fg); }
  /* admin */
  #adminMenu { position: absolute; top: 10px; right: 14px; background: var(--panel); border: 1px solid var(--border2); border-radius: 8px; padding: 6px 10px; font-size: .78rem; cursor: pointer; }
  .barRow { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: .78rem; }
  .barLabel { width: 120px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .barTrack { flex: 1; background: var(--input-bg); border-radius: 4px; height: 14px; overflow: hidden; }
  .barFill { height: 100%; background: var(--accent); border-radius: 4px; }
  .barVal { width: 70px; text-align: right; color: var(--faint); font-size: .7rem; }
  .statGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .statBox { background: var(--panel); border: 1px solid var(--border2); border-radius: 8px; padding: 8px 10px; }
  .statBox .n { font-size: 1.1rem; font-weight: 700; color: var(--fg); }
  .statBox .l { font-size: .68rem; color: var(--muted); }
  table.admin { width: 100%; border-collapse: collapse; font-size: .78rem; }
  table.admin td, table.admin th { padding: 5px 6px; border-bottom: 1px solid var(--border); text-align: left; }
  #adminView { display: none; flex: 1; overflow: auto; padding: 16px 20px; }
  .gws-hidden { display: none !important; }
  .empty b { color: var(--fg); font-size: 1.05rem; display: block; margin-bottom: 6px; }
</style>
</head>
<body>
<aside>
  <div class="brand">co-workspace <span>teams</span></div>
  <button class="newbtn" id="newChat">＋ New chat</button>
  <div class="sidetitle">SESSIONS</div>
  <div id="sessions"></div>
  <div id="authCard"></div>
</aside>
<section>
  <header>
    <button class="collapsebtn" id="collapseLeft" title="Toggle sidebar">☰</button>
    <span class="pname" id="pnameLabel" style="flex:1"></span>
    <button class="collapsebtn" id="themeBtn" title="Toggle theme">◐</button>
    <button class="collapsebtn" id="collapseRight" title="Toggle artifacts panel">▤ Artifacts</button>
    <button id="adminMenu" class="gws-hidden">⚙ Admin</button>
  </header>
  <div id="adminView"></div>
  <div id="log">
    <div class="empty">
      <b>What can the team do for you?</b>
      Pick a variant, type a message — the workspace is reused automatically.
      <div class="chips">
        <button type="button" class="chip" data-fill="Analyze this data and summarize the key findings">📊 Analyze data</button>
        <button type="button" class="chip" data-fill="Draft a project plan with milestones and owners">📋 Draft a plan</button>
        <button type="button" class="chip" data-fill="Research this topic and summarize what you find">🔍 Research</button>
        <button type="button" class="chip" data-fill="Review this document and suggest improvements">✍️ Review a doc</button>
      </div>
    </div>
  </div>
  <form class="composer" id="composer">
    <div class="composerBox">
      <textarea id="message" rows="1" placeholder="Ask the team…"></textarea>
      <div class="composerTools">
        <select id="model" aria-label="Variant" class="modelPick"></select>
        <label class="betaPick" title="Include beta variants"><input type="checkbox" id="beta" style="width:auto"> β</label>
        <span style="flex:1"></span>
        <button type="button" id="stopBtn" class="stopBtn hidden">■ Stop</button>
        <button type="submit" id="send" class="sendBtn">Send</button>
      </div>
    </div>
  </form>
</section>
<aside id="artifacts">
  <div class="tabs">
    <button data-tab="files" class="active">Files</button>
    <button data-tab="preview">Preview</button>
    <button data-tab="history">History</button>
  </div>
  <div class="content" id="artifactsContent"></div>
</aside>
<script type="module">
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const modelSel = $("model"), sessionsEl = $("sessions"), log = $("log"),
        form = $("composer"), input = $("message"), send = $("send"),
        betaBox = $("beta"), pnameLabel = $("pnameLabel");
  let currentTenantId = "";
  let currentModel = "";
  let me = null;
  let currentUserName = () => (me?.loginId ?? "default");

  function bubble(role, text = "") {
    document.querySelector(".empty")?.remove();
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  async function loadModels() {
    const body = await (await fetch("/v1/models")).json();
    const includeBeta = betaBox.checked;
    const catalog = body.data.filter((m) => includeBeta || m.meta?.status !== "beta");
    modelSel.innerHTML = "";
    for (const m of catalog) {
      const isBeta = m.meta?.status === "beta";
      const label = isBeta ? `${m.id} · beta` : m.id;
      const vo = document.createElement("option");
      vo.value = m.id;
      vo.textContent = label;
        const mo = document.createElement("option");
      mo.value = m.id;
      mo.textContent = label;
      modelSel.appendChild(mo);
    }
  }

  async function loadSessions() {
    const body = await (await fetch("/tenants?mine=1")).json();
    sessionsEl.innerHTML = "";
    const mine = (body.tenants ?? []).slice().reverse();
    // ChatGPT-pattern: group by recency
    const groups = new Map();
    for (const t of mine) {
      const d = new Date(t.createdAt);
      const days = Math.floor((Date.now() - d.getTime()) / 86400000);
      const label = days === 0 ? "Today" : days === 1 ? "Yesterday" : days <= 7 ? "Previous 7 days" : "Older";
      (groups.get(label) ?? groups.set(label, []).get(label)).push(t);
    }
    const order = ["Today", "Yesterday", "Previous 7 days", "Older"];
    for (const label of order.filter((l) => groups.has(l))) {
      const tenants = groups.get(label);
      const head = document.createElement("div");
      head.className = "grouphead";
      head.textContent = label;
      sessionsEl.appendChild(head);
      for (const t of tenants) {
        const row = document.createElement("div");
        row.className = "sess" + (t.tenantId === currentTenantId ? " active" : "");
        const name = t.name ?? t.tenantId;
        const tag = t.status === "failed" ? " ⚠" : t.status === "provisioning" ? " ⏳" : "";
        const tok = t.usage ? ` · ${t.usage.inputTokens ?? 0}→${t.usage.outputTokens ?? 0} tok` : "";
        row.innerHTML = `<div><div class="nm">${esc(name)}${tag}</div>` +
          `<div class="meta">${t.sessions} turns${tok}</div></div>`;
        const del = document.createElement("button");
        del.className = "del"; del.textContent = "Delete"; del.title = "Delete session";
        del.addEventListener("click", async (e) => {
          e.stopPropagation();
          if (!confirm(`Delete "${name}"? Project files will be removed.`)) return;
          const res = await fetch(`/tenants/${t.tenantId}`, { method: "DELETE" });
          if (res.status === 200) {
            if (t.tenantId === currentTenantId) { currentTenantId = ""; pnameLabel.textContent = ""; }
            loadSessions();
          }
        });
        row.appendChild(del);
        row.addEventListener("click", () => selectSession(t));
        sessionsEl.appendChild(row);
      }
    }
    if (mine.length === 0) {
      sessionsEl.innerHTML = '<div class="hint" style="padding:6px 4px;">No sessions yet.</div>';
    }
  }

  async function selectSession(t) {
    currentTenantId = t.tenantId;
    currentModel = t.variant;
    modelSel.value = t.variant;
    const usage = t.usage ? ` · ${t.usage.inputTokens ?? 0}→${t.usage.outputTokens ?? 0} tok` : "";
    pnameLabel.innerHTML = `project: <b>${t.name ?? t.tenantId}</b> · ${t.sessions} turns${usage}`;
    log.innerHTML = "";
    // QA-09: replay recent turns as read-only bubbles
    try {
      const { turns } = await (await fetch(`/tenants/${t.tenantId}/history`)).json();
      for (const turn of turns.slice(-10).reverse()) {
        if (turn.finalText) bubble("assistant", `[#${turn.seq}] ${turn.finalText}`);
      }
    } catch { /* history is best-effort */ }
    bubble("assistant", `Resumed "${t.name ?? t.tenantId}" (${t.variant}) — ${t.sessions} earlier turns. Continue below.`);
    document.querySelectorAll(".sess").forEach((el) => el.classList.remove("active"));
    document.querySelectorAll(".sess").forEach((el) => {
      if (el.querySelector(".nm")?.textContent.startsWith(t.name ?? t.tenantId)) el.classList.add("active");
    });
  }

  $("newChat").addEventListener("click", () => {
    currentTenantId = ""; currentModel = "";
    pnameLabel.textContent = "";
    log.innerHTML = "";
    bubble("assistant", "New chat — pick a variant and send a message. The team workspace is reused per (variant, user); a new project is created only if none exists yet.");
  });

  // QA-07: Stop button while a turn is streaming (lives in the composer tools)
  $("stopBtn").addEventListener("click", async () => {
    if (!currentTenantId) return;
    await fetch(`/tenants/${currentTenantId}/cancel`, {
      method: "POST",
      headers: { "x-requested-with": "co-workspace" },
    });
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = ""; send.disabled = true;
    $("stopBtn").classList.remove("hidden");
    bubble("user", message);
    const reply = bubble("assistant");
    reply.classList.add("pending");
    try {
      const res = await fetch("/v1/chat/completions", {
        method: "POST",
        headers: { "content-type": "application/json", "x-requested-with": "co-workspace" },
        body: JSON.stringify({
          model: modelSel.value,
          user: currentUserName(),
          stream: true,
          messages: [{ role: "user", content: message }],
        }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: res.statusText }));
        throw new Error(err.error ?? `HTTP ${res.status}`);
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "", first = true;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buffer.indexOf("\n\n")) >= 0) {
          const frame = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 2);
          for (const line of frame.split("\n")) {
            if (line.startsWith(": provisioning:")) {
              const note = document.createElement("div");
              note.className = "progress-inline";
              note.textContent = "⏳ " + line.replace(": provisioning: ", "");
              if (first) { log.appendChild(note); first = false; log.scrollTop = log.scrollHeight; }
              continue;
            }
          }
          if (!frame.startsWith("data: ") || frame === "data: [DONE]") continue;
          const payload = JSON.parse(frame.slice(6));
          if (payload.error) throw new Error(payload.error.message ?? "stream error");
          const delta = payload.choices?.[0]?.delta?.content;
          if (delta) {
            reply.classList.remove("pending");
            reply.textContent += delta;
            log.scrollTop = log.scrollHeight;
          }
        }
      }
      loadSessions();
    } catch (err) {
      reply.textContent += (reply.textContent ? "\n\n" : "") + `⚠ ${err.message}`;
    } finally {
      reply.classList.remove("pending");
      send.disabled = false;
      $("stopBtn").classList.add("hidden");
    }
  });

  // ── Wave A: panel collapse (localStorage) ──
  function applyCollapse() {
    const leftCollapsed = localStorage.getItem("gw-collapse-left") === "1";
    const rightCollapsed = localStorage.getItem("gw-collapse-right") === "1";
    document.querySelector("aside").style.display = leftCollapsed ? "none" : "flex";
    const art = $("artifacts");
    art.style.display = rightCollapsed ? "none" : "flex";
  }
  $("collapseLeft").addEventListener("click", () => {
    localStorage.setItem("gw-collapse-left",
      localStorage.getItem("gw-collapse-left") === "1" ? "0" : "1");
    applyCollapse();
  });
  $("collapseRight").addEventListener("click", () => {
    localStorage.setItem("gw-collapse-right",
      localStorage.getItem("gw-collapse-right") === "1" ? "0" : "1");
    applyCollapse();
  });
  applyCollapse();

  // ── Wave A: artifacts panel (Files / Preview / History) ──
  let activeTab = "files";
  let cwd = "";
  let currentTenantForArtifacts = () => currentTenantId;
  const artContent = $("artifactsContent");

  async function loadFilesTab() {
    const tenantId = currentTenantForArtifacts();
    if (!tenantId) {
      artContent.innerHTML = '<div class="hint">Select or start a session to browse its workspace.</div>';
      return;
    }
    const res = await fetch(`/tenants/${tenantId}/files/${cwd}`);
    if (res.status === 404) { artContent.innerHTML = '<div class="hint">No files yet.</div>'; return; }
    const { entries } = await res.json();
    artContent.innerHTML = "";
    if (cwd) {
      const up = document.createElement("div");
      up.className = "fileRow dir";
      up.textContent = "↩ ..";
      up.addEventListener("click", () => {
        cwd = cwd.split("/").slice(0, -1).join("/");
        loadFilesTab();
      });
      artContent.appendChild(up);
    }
    for (const e of entries) {
      const row = document.createElement("div");
      row.className = "fileRow " + e.type;
      row.innerHTML = `<span>${e.type === "dir" ? "📁" : "📄"} ${esc(e.name)}</span>` +
        `<span class="size">${e.type === "file" ? (e.size ?? 0) + "B" : ""}</span>`;
      row.addEventListener("click", async () => {
        if (e.type === "dir") {
          cwd = cwd ? `${cwd}/${e.name}` : e.name;
          loadFilesTab();
        } else {
          switchTab("preview");
        }
      });
      artContent.appendChild(row);
    }
  }

  async function loadPreviewTab(filePath) {
    const tenantId = currentTenantForArtifacts();
    if (!tenantId) { artContent.innerHTML = '<div class="hint">No session selected.</div>'; return; }
    if (!filePath) {
      // remember the last clicked file path in dataset
      filePath = artContent.dataset.lastFile ?? "";
    }
    if (!filePath) {
      artContent.innerHTML = '<div class="hint">Click a file in the Files tab to preview it here.</div>';
      return;
    }
    const res = await fetch(`/tenants/${tenantId}/file/${filePath}`);
    if (res.status === 413) { artContent.innerHTML = '<div class="hint">File exceeds the 256KB preview cap.</div>'; return; }
    if (res.status !== 200) { artContent.innerHTML = '<div class="hint">File not available.</div>'; return; }
    const { content } = await res.json();
    artContent.innerHTML = `<div class="hint" style="margin-bottom:6px;">${esc(filePath)}</div>` +
      `<pre class="preview">${content.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</pre>`;
  }

  const historyCache = new Map();
  async function loadHistoryTab() {
    const tenantId = currentTenantForArtifacts();
    if (!tenantId) { artContent.innerHTML = '<div class="hint">No session selected.</div>'; return; }
    const detail = await (await fetch(`/tenants/${tenantId}`)).json();
    const cached = historyCache.get(tenantId);
    if (cached && cached.sessions === detail.sessions) {
      renderHistory(cached.turns);
      return;
    }
    const { turns } = await (await fetch(`/tenants/${tenantId}/history`)).json();
    historyCache.set(tenantId, { sessions: detail.sessions, turns });
    renderHistory(turns);
  }

  function renderHistory(turns) {
    if (!turns.length) { artContent.innerHTML = '<div class="hint">No turns recorded yet.</div>'; return; }
    artContent.innerHTML = "";
    for (const t of turns) {
      const div = document.createElement("div");
      div.className = "turnRow";
      div.innerHTML = `<div class="meta">#${t.seq} · ${esc(t.at)} · exit ${t.exitCode} · ${t.inputTokens}→${t.outputTokens} tok</div>` +
        `<div class="txt">${esc((t.finalText || "(empty)").slice(0, 220))}</div>`;
      artContent.appendChild(div);
    }
  }

  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll("#artifacts .tabs button").forEach((b) =>
      b.classList.toggle("active", b.dataset.tab === tab));
    if (tab === "files") loadFilesTab();
    else if (tab === "preview") loadPreviewTab();
    else loadHistoryTab();
  }
  for (const btn of document.querySelectorAll("#artifacts .tabs button")) {
    btn.addEventListener("click", () => switchTab(btn.dataset.tab));
  }
  // file click → preview: patch the file-row handler by storing the path
  const origLoadFilesTab = loadFilesTab;
  loadFilesTab = async function () {
    const tenantId = currentTenantForArtifacts();
    if (!tenantId) {
      artContent.innerHTML = '<div class="hint">Select or start a session to browse its workspace.</div>';
      return;
    }
    const res = await fetch(`/tenants/${tenantId}/files/${cwd}`);
    if (res.status === 404) { artContent.innerHTML = '<div class="hint">No files yet.</div>'; return; }
    const { entries } = await res.json();
    artContent.innerHTML = "";
    if (cwd) {
      const up = document.createElement("div");
      up.className = "fileRow dir";
      up.textContent = "↩ ..";
      up.addEventListener("click", () => { cwd = cwd.split("/").slice(0, -1).join("/"); loadFilesTab(); });
      artContent.appendChild(up);
    }
    for (const e of entries) {
      const row = document.createElement("div");
      row.className = "fileRow " + e.type;
      row.innerHTML = `<span>${e.type === "dir" ? "📁" : "📄"} ${esc(e.name)}</span>` +
        `<span class="size">${e.type === "file" ? (e.size ?? 0) + "B" : ""}</span>`;
      const relPath = cwd ? `${cwd}/${e.name}` : e.name;
      row.addEventListener("click", () => {
        if (e.type === "dir") { cwd = relPath; loadFilesTab(); }
        else { artContent.dataset.lastFile = relPath; switchTab("preview"); }
      });
      artContent.appendChild(row);
    }
  };

  // ── theme toggle ──
  const savedTheme = localStorage.getItem("gw-theme") ?? "dark";
  document.documentElement.dataset.theme = savedTheme;
  $("themeBtn").addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
    document.documentElement.dataset.theme = next;
    localStorage.setItem("gw-theme", next);
  });

  // ── Wave B1/B3: auth state, login/signup UI, user info, admin panel ──
  const authCard = $("authCard");
  const adminMenu = $("adminMenu");
  const adminView = $("adminView");

  function renderAuthCard() {
    if (me) {
      authCard.innerHTML =
        `<div style="display:flex; align-items:center; justify-content:space-between; gap:6px;">` +
        `<span style="font-size:.78rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"><b>${esc(me.name)}</b>${me.role === "admin" ? " ·admin" : ""}</span>` +
        `<span><button id="profileBtn" class="collapsebtn" title="Profile" style="font-size:.75rem;">✎</button>` +
        `<button id="logoutBtn" class="collapsebtn" title="Sign out" style="font-size:.75rem;">⎋</button></span></div>`;
      $("logoutBtn").addEventListener("click", async () => {
        await fetch("/auth/logout", { method: "POST" });
        me = null;
        adminMenu.classList.add("gws-hidden");
        adminView.style.display = "none";
        $("log").style.display = "flex";
        renderAuthCard();
      });
      $("profileBtn").addEventListener("click", () => renderProfileForm());
    } else {
      authCard.innerHTML =
        `<div class="field"><b>Sign in</b></div>` +
        `<div class="field"><input id="li-id" placeholder="ID"></div>` +
        `<div class="field"><input id="li-pw" type="password" placeholder="Password"></div>` +
        `<button id="loginBtn">Sign in</button>` +
        `<div class="switch" id="toSignup">Create an account →</div>` +
        (googleConfiguredFlag
          ? `<button id="glogin" style="background:#5f6368;">Sign in with Google</button>`
          : "");
      $("loginBtn").addEventListener("click", () => doLogin($("li-id").value, $("li-pw").value));
      $("toSignup").addEventListener("click", renderSignupForm);
      const g = $("glogin");
      if (g) g.addEventListener("click", () => { location.href = "/auth/google/login"; });
    }
  }

  function renderSignupForm() {
    authCard.innerHTML =
      `<div class="field"><b>Sign up</b></div>` +
      `<div class="field"><input id="su-id" placeholder="ID (a-z, 0-9, -)"></div>` +
      `<div class="field"><input id="su-email" placeholder="Email (verification mail)"></div>` +
      `<div class="field"><input id="su-pw" type="password" placeholder="Password (8+)"></div>` +
      `<button id="signupBtn">Sign up</button>` +
      `<div class="switch" id="toLogin">← Back to sign in</div>` +
      `<div class="field" id="verifyRow" style="display:none;"><input id="verify-key" placeholder="Verification key from mail"><button id="verifyBtn">Activate</button></div>` +
      `<div class="hint">A verification mail is generated to the outbox; enter its key here to activate. Your email is discarded after verification (only a hash is kept).</div>`;
    $("signupBtn").addEventListener("click", async () => {
      const res = await fetch("/auth/signup", {
        method: "POST",
        headers: { "content-type": "application/json", "x-requested-with": "co-workspace" },
        body: JSON.stringify({ loginId: $("su-id").value, email: $("su-email").value, password: $("su-pw").value }),
      });
      const body = await res.json();
      if (res.status === 200) {
        $("verifyRow").style.display = "flex";
        $("signupBtn").disabled = true;
        bubble("assistant", "✉ " + body.message);
      } else {
        bubble("assistant", `⚠ ${body.error ?? "signup failed"}`);
      }
    });
    $("verifyBtn").addEventListener("click", async () => {
      const res = await fetch("/auth/verify", {
        method: "POST",
        headers: { "content-type": "application/json", "x-requested-with": "co-workspace" },
        body: JSON.stringify({ token: $("verify-key").value }),
      });
      const body = await res.json();
      bubble("assistant", res.status === 200 ? `✔ ${body.message}` : `⚠ ${body.error}`);
      if (res.status === 200) renderAuthCard();
    });
    $("toLogin").addEventListener("click", renderAuthCard);
  }

  function renderProfileForm() {
    adminView.style.display = "block";
    $("log").style.display = "none";
    adminView.innerHTML =
      `<div class="card"><h2>Profile — @${me?.loginId}</h2>` +
      `<div class="field" style="margin-bottom:6px;"><input id="pf-name" placeholder="Display name" value="${esc(me?.name ?? "")}"></div>` +
      `<div class="field" style="margin-bottom:6px;"><input id="pf-pw" type="password" placeholder="New password (optional)"></div>` +
      `<button id="pf-save">Save</button> <button id="pf-back">Back</button></div>`;
    $("pf-save").addEventListener("click", async () => {
      const res = await fetch("/auth/me", {
        method: "PATCH",
        headers: { "content-type": "application/json", "x-requested-with": "co-workspace" },
        body: JSON.stringify({ name: $("pf-name").value, password: $("pf-pw").value || undefined }),
      });
      if (res.status === 200) {
        me = (await res.json()).user;
        renderAuthCard();
        adminView.style.display = "none";
        $("log").style.display = "flex";
      }
    });
    $("pf-back").addEventListener("click", () => {
      adminView.style.display = "none";
      $("log").style.display = "flex";
    });
  }

  async function doLogin(id, pw) {
    const res = await fetch("/auth/login", {
      method: "POST",
      headers: { "content-type": "application/json", "x-requested-with": "co-workspace" },
      body: JSON.stringify({ loginId: id, password: pw }),
    });
    const body = await res.json();
    if (res.status === 200) {
      me = body.user;
      renderAuthCard();
      applyAdminVisibility();
      loadSessions();
    } else {
      bubble("assistant", `⚠ ${body.error ?? "login failed"}`);
    }
  }

  function applyAdminVisibility() {
    adminMenu.classList.toggle("gws-hidden", me?.role !== "admin");
  }

  // ── admin panel with stats + graphs ──
  function barChart(rows, unit) {
    const max = Math.max(1, ...rows.map((r) => r[1]));
    return rows
      .map(
        ([label, val]) =>
          `<div class="barRow"><div class="barLabel" title="${esc(label)}">${esc(label)}</div>` +
          `<div class="barTrack"><div class="barFill" style="width:${(val / max) * 100}%"></div></div>` +
          `<div class="barVal">${val}${unit}</div></div>`,
      )
      .join("");
  }

  adminMenu.addEventListener("click", async () => {
    const on = adminView.style.display === "block";
    if (on) {
      adminView.style.display = "none";
      $("log").style.display = "flex";
      return;
    }
    adminView.style.display = "block";
    $("log").style.display = "none";
    adminView.innerHTML = "<div class='hint'>loading…</div>";
    const stats = await (await fetch("/admin/stats")).json();
    const users = (await (await fetch("/admin/users")).json()).users;
    const fmt = (b) => (b > 1e9 ? (b / 1e9).toFixed(1) + "GB" : b > 1e6 ? (b / 1e6).toFixed(1) + "MB" : b > 1e3 ? (b / 1e3).toFixed(0) + "KB" : b + "B");
    adminView.innerHTML =
      `<div class="statGrid">` +
      `<div class="statBox"><div class="n">${stats.users.active}</div><div class="l">active users</div></div>` +
      `<div class="statBox"><div class="n">${Object.values(stats.tenants).reduce((a, b) => a + b, 0)}</div><div class="l">tenants</div></div>` +
      `<div class="statBox"><div class="n">${fmt(stats.diskBytes)}</div><div class="l">disk usage</div></div>` +
      `</div>` +
      `<h2 style="font-size:.85rem;">Tenants per user</h2>${barChart(stats.perUser.map((u) => [u.principal, u.tenantCount]), "")}` +
      `<h2 style="font-size:.85rem; margin-top:14px;">Disk usage per user</h2>${barChart(stats.perUser.map((u) => [u.principal, u.diskBytes]), "B")}` +
      `<h2 style="font-size:.85rem; margin-top:14px;">Tenants per variant</h2>${barChart(stats.tenantsPerVariant.map((r) => [r.variant, r.count]), "")}` +
      `<h2 style="font-size:.85rem; margin-top:14px;">Users</h2>` +
      `<table class="admin"><thead><tr><th>ID</th><th>Status</th><th>Tenants</th><th>Usage</th><th>Actions</th></tr></thead><tbody>` +
      users
        .map((u) => {
          const pu = stats.perUser.find((p) => p.principal === u.principal);
          return `<tr><td>${esc(u.loginId ?? u.principal)}${u.role === "admin" ? " ·admin" : ""}</td>` +
            `<td>${esc(u.status)}</td><td>${pu?.tenantCount ?? 0}</td><td>${fmt(pu?.diskBytes ?? 0)}</td>` +
            `<td><button class="collapsebtn" data-reset="${u.id}">reset pw</button> ` +
            `<button class="collapsebtn" data-del="${u.id}" style="color:#f85149;">delete</button></td></tr>`;
        })
        .join("") +
      `</tbody></table>`;
    for (const btn of adminView.querySelectorAll("[data-reset]")) {
      btn.addEventListener("click", async () => {
        const res = await fetch(`/admin/users/${btn.getAttribute("data-reset")}/reset-password`, { method: "POST" });
        const body = await res.json();
        alert(`One-time reset token (15 min):
${body.resetToken}`);
      });
    }
    for (const btn of adminView.querySelectorAll("[data-del]")) {
      btn.addEventListener("click", async () => {
        const disposition = prompt(`Delete user — tenant disposition?\n'delete' = remove tenant files, 'archive' = keep (default)`, "archive");
        if (disposition === null) return;
        const res = await fetch(`/admin/users/${btn.getAttribute("data-del")}?tenants=${disposition === "delete" ? "delete" : "archive"}`, { method: "DELETE" });
        const body = await res.json();
        alert(`User deleted · tenants handled: ${body.tenantsHandled} (${body.disposition})`);
        adminMenu.click();
        adminMenu.click();
      });
    }
  });

  // auth state on load
  let googleConfiguredFlag = false;
  (async () => {
    const health = await (await fetch("/health")).json();
    googleConfiguredFlag = Boolean(health.googleSso);
    const res = await fetch("/auth/me");
    if (res.status === 200) {
      me = (await res.json()).user;
      applyAdminVisibility();
    }
    renderAuthCard();
  })();

  for (const chip of document.querySelectorAll(".chip")) {
    chip.addEventListener("click", () => {
      input.value = chip.dataset.fill;
      input.focus();
    });
  }

  betaBox.addEventListener("change", loadModels);
  send.disabled = false;
  loadModels();
  loadSessions();
</script>
</body>
</html>
