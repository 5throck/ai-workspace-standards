# Override enabling CO_WORKSPACE_ISOLATION=docker.
# Usage: docker compose -f docker-compose.yml -f docker-compose.isolation.yml up -d
#   or set COMPOSE_FILE=docker-compose.yml:docker-compose.isolation.yml in .env.
#
# The gateway never mounts the raw Docker socket. Since T-20260930-008 the socket is held
# by OUR create-body-validating broker (src/docker-broker.ts, same gateway image, command
# override) — not the endpoint-only tecnativa/docker-socket-proxy. Three controls the
# endpoint filter cannot express:
#   1. create-body validation: image allowlist, no Privileged, CapDrop ALL,
#      no-new-privileges, user 10000:10000, binds only under CO_WORKSPACE_DATA_DIR_HOST,
#      no host Pid/Network mode, no devices, Memory/PidsLimit caps required.
#   2. name scoping: create/start/wait/kill/attach/inspect/remove resolve only
#      co-workspace-turn-* containers, and the container LIST is filtered to that fleet —
#      other daemons' containers (and their env, seen via inspect) are invisible.
#   3. endpoint allowlist: version probe, container create/start/wait/attach/kill, list,
#      inspect, delete. Exec/images/volumes/networks/info/build/swarm are 403.
# Residual risk (accepted, single-operator): a compromised gateway can still manage the
# turn containers it legitimately owns; rootless Docker removes the remaining host-root
# equivalence and stays the long-term direction.
# Single-operator deployments only. The runtime image must be pre-built (IMAGES=0 makes a
# missing image fail fast instead of pulling).
services:
  docker-broker:
    # Same gateway image (ships src/docker-broker.ts); command override starts the broker.
    image: ${CO_WORKSPACE_GATEWAY_IMAGE:-co-workspace-gateway:latest}
    build:
      # compose resolves relative paths against THIS FILE's directory (three levels up
      # = the repo root), same as the gateway build in docker-compose.yml.
      context: ../../../
      dockerfile: services/co-workspace/docker/Dockerfile
    command: ["bun", "src/docker-broker.ts"]
    restart: unless-stopped
    # Root is required to read the host socket (root:root 660, DAC bypass); every
    # capability is still dropped and the filesystem is read-only.
    user: "0:0"
    read_only: true
    tmpfs: [/run]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CO_WORKSPACE_BROKER_PORT: 2375
      CO_WORKSPACE_BROKER_SOCKET: /var/run/docker.sock
      CO_WORKSPACE_BROKER_NAME_PREFIX: co-workspace-turn-
      # Policy inputs mirroring the gateway's own config (both sides must agree).
      CO_WORKSPACE_RUNTIME_IMAGE: ${CO_WORKSPACE_RUNTIME_IMAGE:-co-workspace-runtime:latest}
      CO_WORKSPACE_DATA_DIR_HOST: ${CO_WORKSPACE_DATA_DIR_HOST:?set to the absolute host path of the data dir}
    networks: [dockerapi]

  co-workspace:
    environment:
      DOCKER_HOST: tcp://docker-broker:2375
    depends_on: [docker-broker]
    networks: [default, dockerapi]

networks:
  dockerapi:
    internal: true
