# Team Gateway compose (ADR-0092 + Phase 2 hardening). Build context is the workspace root.
#
# The gateway runs NON-ROOT (uid:gid 10000:10000, no-new-privileges, all caps dropped).
# On LINUX the operator must once `chown -R 10000:10000` CO_WORKSPACE_DATA_DIR_HOST and the
# shared auth dir, and the workspace clone must be writable by uid 10000. macOS Docker
# Desktop maps ownership, so no chown is needed there. Override with
# CO_WORKSPACE_GATEWAY_UID / CO_WORKSPACE_GATEWAY_GID.
#
# Required environment:
#   CO_WORKSPACE_DATA_DIR_HOST     ABSOLUTE host path for the gateway data dir — bind-mounted
#                                  at /data here AND used as the sibling-mount source, so
#                                  docker-isolation turns can reach tenant dirs (the gateway
#                                  passes CO_WORKSPACE_DATA_DIR_HOST down for exactly this).
# Optional environment (see volumes below):
#   CO_WORKSPACE_HERMES_SEED_HOME    Legacy OAuth mode only: add docker-compose.seed.yml to
#                                    COMPOSE_FILE to mount it read-only at /seed-home. Without
#                                    the override no Hermes home is mounted. When set, the
#                                    .env.keys / shared-store host defaults stay under it.
#   CO_WORKSPACE_WORKSPACE_DIR_HOST  Host path of a dedicated workspace CLONE for scaffolding
#                                    (defaults to this repo's checkout). Keep it off /tmp.
#
# Phase 0 note: the workspace clone is mounted at /workspace (provisioning writes Projects/
# there); Phase 2 bakes a pinned workspace image instead.

name: co-workspace

services:
  co-workspace:
    build:
      # NOTE: compose resolves relative paths against THIS FILE's directory
      # (services/co-workspace/docker/), so three levels up = the repo root.
      context: ../../../
      dockerfile: services/co-workspace/docker/Dockerfile
    image: co-workspace-gateway:latest
    entrypoint: [] # bypass the base image's s6 init — the server runs as PID 1
    command: ["bun", "src/server.ts"]
    init: true
    user: "${CO_WORKSPACE_GATEWAY_UID:-10000}:${CO_WORKSPACE_GATEWAY_GID:-10000}"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    ports:
      # D6 loopback default; set CO_WORKSPACE_PUBLISH=0.0.0.0 in .env to expose on all
      # interfaces — turn on auth first (CO_WORKSPACE_LOGIN_REQUIRED / CO_WORKSPACE_API_KEYS).
      - "${CO_WORKSPACE_PUBLISH:-127.0.0.1}:9030:9030"
    environment:
      CO_WORKSPACE_HOST: 0.0.0.0 # inside the container; the publish above binds every host interface
      CO_WORKSPACE_DATA_DIR: /data
      CO_WORKSPACE_DATA_DIR_HOST: ${CO_WORKSPACE_DATA_DIR_HOST:?set to the absolute host path of the data dir}
      CO_WORKSPACE_WORKSPACE_DIR: /workspace
      # "all" auto-discovers templates/co-* — stable only by default; INCLUDE_BETA adds beta
      CO_WORKSPACE_VARIANTS: ${CO_WORKSPACE_VARIANTS:-all}
      CO_WORKSPACE_VARIANTS_INCLUDE_BETA: ${CO_WORKSPACE_VARIANTS_INCLUDE_BETA:-true}
      CO_WORKSPACE_TEMPLATE_VERSION: ${CO_WORKSPACE_TEMPLATE_VERSION:-}
      CO_WORKSPACE_API_KEYS: ${CO_WORKSPACE_API_KEYS:-}
      CO_WORKSPACE_API_KEYS_FILE: /seed/.env.keys
      CO_WORKSPACE_QUOTA_WINDOW: ${CO_WORKSPACE_QUOTA_WINDOW:-lifetime}
      CO_WORKSPACE_TENANT_MAX_TURNS: ${CO_WORKSPACE_TENANT_MAX_TURNS:-0}
      CO_WORKSPACE_TENANT_MAX_TOKENS: ${CO_WORKSPACE_TENANT_MAX_TOKENS:-0}
      CO_WORKSPACE_HERMES_TOOLSETS: ${CO_WORKSPACE_HERMES_TOOLSETS:-}
      CO_WORKSPACE_HERMES_EXTRA_ARGS: ${CO_WORKSPACE_HERMES_EXTRA_ARGS:-}
      CO_WORKSPACE_RUNTIME: ${CO_WORKSPACE_RUNTIME:-hermes}
      CO_WORKSPACE_ISOLATION: ${CO_WORKSPACE_ISOLATION:-process}
      CO_WORKSPACE_RUNTIME_IMAGE: ${CO_WORKSPACE_RUNTIME_IMAGE:-co-workspace-runtime:latest}
      CO_WORKSPACE_RUN_BUDGET_SECONDS: ${CO_WORKSPACE_RUN_BUDGET_SECONDS:-300}
      CO_WORKSPACE_MAX_TURNS: ${CO_WORKSPACE_MAX_TURNS:-100}
      # T-20260930-011: per-stage turn timing logs (set 0 to silence)
      CO_WORKSPACE_TURN_TIMING: ${CO_WORKSPACE_TURN_TIMING:-1}
      HERMES_BIN: ${HERMES_BIN:-hermes}
      HERMES_INFERENCE_MODEL: ${HERMES_INFERENCE_MODEL:-}
      HERMES_INFERENCE_PROVIDER: ${HERMES_INFERENCE_PROVIDER:-}
      CO_WORKSPACE_HERMES_MODEL: ${CO_WORKSPACE_HERMES_MODEL:-}
      # Provider key+base-url mode (design 2026-09-29-co-workspace-provider-key-config):
      # set BOTH to have isolated turns authenticate with a static provider key
      # (injected as OPENAI_API_KEY) against an OpenAI-compatible base_url — instead of
      # the per-turn auth.json re-seed (OAuth refresh-token reuse revoked the Nous
      # session, 2026-09-29). Leave empty to keep the legacy shared-store path.
      CO_WORKSPACE_LLM_PROVIDER: ${CO_WORKSPACE_LLM_PROVIDER:-}
      CO_WORKSPACE_LLM_BASE_URL: ${CO_WORKSPACE_LLM_BASE_URL:-}
      CO_WORKSPACE_LLM_API_KEY: ${CO_WORKSPACE_LLM_API_KEY:-}
      # Default reasoning effort stamped into team config.yaml (agent.reasoning_effort).
      # glm-5.3-flash rejects effort-less requests — the default "low" lets turns run
      # with zero operator flags; set low|high|max. No colon in `-low`: unset -> low, but
      # an explicitly EMPTY value stays empty and omits the stamp (server.ts keeps "" as-is).
      CO_WORKSPACE_HERMES_REASONING_EFFORT: ${CO_WORKSPACE_HERMES_REASONING_EFFORT-low}
      CO_WORKSPACE_LOGIN_REQUIRED: ${CO_WORKSPACE_LOGIN_REQUIRED:-true}
      CO_WORKSPACE_CSRF_REQUIRED: ${CO_WORKSPACE_CSRF_REQUIRED:-true}
      CO_WORKSPACE_TRUST_PROXY: ${CO_WORKSPACE_TRUST_PROXY:-false}
      CO_WORKSPACE_TENANT_MAX_PER_PRINCIPAL: ${CO_WORKSPACE_TENANT_MAX_PER_PRINCIPAL:-10}
      # false = provisioning needs a credential even in open mode (2026-10-02 gate design).
      # true = anonymous visitors may spawn new teams (bounded by TENANT_MAX_PER_PRINCIPAL).
      CO_WORKSPACE_ALLOW_ANON_PROVISIONING: ${CO_WORKSPACE_ALLOW_ANON_PROVISIONING:-false}
      # true only when served over TLS (reverse proxy) — adds the Secure attribute to session cookies
      CO_WORKSPACE_COOKIE_SECURE: ${CO_WORKSPACE_COOKIE_SECURE:-auto}
      CO_WORKSPACE_PRINCIPAL_MAX_TOKENS: ${CO_WORKSPACE_PRINCIPAL_MAX_TOKENS:-0}
      CO_WORKSPACE_SCAFFOLD_TIMEOUT_MS: ${CO_WORKSPACE_SCAFFOLD_TIMEOUT_MS:-600000}
      CO_WORKSPACE_DOCKER_BIN: ${CO_WORKSPACE_DOCKER_BIN:-docker}
      CO_WORKSPACE_INSTANCE_ID: ${CO_WORKSPACE_INSTANCE_ID:-default}
      CO_WORKSPACE_CONTAINER_MEMORY: ${CO_WORKSPACE_CONTAINER_MEMORY:-2g}
      CO_WORKSPACE_CONTAINER_CPUS: ${CO_WORKSPACE_CONTAINER_CPUS:-2}
      CO_WORKSPACE_CONTAINER_PIDS_LIMIT: ${CO_WORKSPACE_CONTAINER_PIDS_LIMIT:-256}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      CO_WORKSPACE_ADMIN_EMAIL: ${CO_WORKSPACE_ADMIN_EMAIL:-}
      # Empty by default: the seed-home mount is optional. docker-compose.seed.yml sets
      # /seed-home. Never interpolate the host-side CO_WORKSPACE_HERMES_SEED_HOME here.
      CO_WORKSPACE_HERMES_SEED_HOME: ${CO_WORKSPACE_HERMES_SEED_HOME_IN_CONTAINER:-}
      CO_WORKSPACE_HERMES_AUTH_DIR: ${CO_WORKSPACE_HERMES_AUTH_DIR:-/seed/shared}
      # host path of the shared store — sibling containers mount THIS (resolved on the host)
      CO_WORKSPACE_HERMES_AUTH_DIR_HOST: ${CO_WORKSPACE_HERMES_AUTH_DIR_HOST:-${CO_WORKSPACE_HERMES_SEED_HOME:-${CO_WORKSPACE_DATA_DIR_HOST}/seed}/shared}
    volumes:
      - ${CO_WORKSPACE_DATA_DIR_HOST:?set to the absolute host path of the data dir}:/data
      # Workspace clone used for scaffolding. Default: the repo checkout three levels up.
      # For durable deployments set CO_WORKSPACE_WORKSPACE_DIR_HOST to a dedicated clone
      # (e.g. /srv/co-workspace-workspace) — /tmp clones vanish on reboot.
      - ${CO_WORKSPACE_WORKSPACE_DIR_HOST:-../../../}:/workspace
      # The Hermes seed home is NOT mounted here (optional, M6): see docker-compose.seed.yml.
      # CO_WORKSPACE_API_KEYS_FILE points here; without the mount readKeysFile() silently
      # returns [] and file-based keys never work in the container.
      - ${CO_WORKSPACE_API_KEYS_FILE_HOST:-${CO_WORKSPACE_HERMES_SEED_HOME:-${CO_WORKSPACE_DATA_DIR_HOST}/seed}/.env.keys}:/seed/.env.keys:ro
      - ${CO_WORKSPACE_HERMES_AUTH_DIR_HOST:-${CO_WORKSPACE_HERMES_SEED_HOME:-${CO_WORKSPACE_DATA_DIR_HOST}/seed}/shared}:/seed/shared
      # NOTE: the Docker socket is intentionally NOT mounted here.
      # For CO_WORKSPACE_ISOLATION=docker, also include docker-compose.isolation.yml.
