<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Team Gateway — demo chat</title>
<style>
  :root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { margin: 0; background: #101418; color: #e8eaed; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 96px; }
  h1 { font-size: 1.2rem; }
  h1 span { color: #8ab4f8; }
  #log { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  .msg { padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; line-height: 1.5; }
  .user { background: #1f2937; align-self: flex-end; max-width: 85%; }
  .assistant { background: #17202a; border: 1px solid #2c3644; max-width: 100%; }
  .assistant.pending::after { content: "…"; }
  form { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
         width: min(760px, 100%); box-sizing: border-box; padding: 12px 16px;
         background: #101418; display: flex; gap: 8px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: #9aa0a6; }
  #model { background: #1a2129; color: #e8eaed; border: 1px solid #2c3644; border-radius: 8px; padding: 8px; }
  #message { flex: 1; background: #1a2129; color: #e8eaed; border: 1px solid #2c3644;
             border-radius: 8px; padding: 10px; resize: vertical; min-height: 44px; font: inherit; }
  button { background: #8ab4f8; color: #101418; border: 0; border-radius: 8px;
           padding: 10px 18px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .note { color: #9aa0a6; font-size: .8rem; }
  .card { background: #12181f; border: 1px solid #2c3644; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .card h2 { font-size: .8rem; color: #8b949e; margin: 0 0 8px; font-weight: 600; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: .75rem; color: #9aa0a6; flex: 1; min-width: 130px; }
  .card input, .card select { background: #101418; color: #e8eaed; border: 1px solid #2c3644; border-radius: 8px; padding: 7px 9px; font: inherit; }
  .card button { background: #238636; }
  .tag { display: inline-block; font-size: .65rem; padding: 1px 6px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }
  .tag.stable { background: #1a4731; color: #56d364; }
  .tag.beta { background: #4a3a12; color: #e3b341; }
  ol.progress { list-style: none; margin: 0; padding: 0; font-size: .82rem; }
  ol.progress li { padding: 3px 0; color: #6e7681; }
  ol.progress li.done { color: #7ee787; }
  ol.progress li.active { color: #e3b341; }
</style>
</head>
<body>
<main>
  <h1>Team Gateway <span>demo chat</span></h1>
  <p class="note">Dev aid for the OpenAI-compatible API. For a full UI, point Open WebUI at
    <code>/v1</code> — see the README runbook.</p>

  <div class="card">
    <h2>① 세션 설정</h2>
    <div class="row">
      <label class="field">사용자 <input id="user" value="default" placeholder="alice"></label>
      <label class="field">프로젝트 이름 (비우면 자동) <input id="pname" placeholder="자동 생성"></label>
      <label class="field">Variant <select id="variant"></select></label>
      <label class="field" style="flex:0 0 auto; flex-direction:row; align-items:center; gap:6px; padding-bottom:8px;">
        <input type="checkbox" id="beta" style="width:auto"> beta 포함
      </label>
      <button id="create" type="button">세션 만들기</button>
    </div>
  </div>

  <div class="card" id="progCard" style="display:none">
    <h2>② 프로비저닝 진행 <button id="deleteBtn" type="button" style="float:right; background:#8b1f1f; font-size:.7rem; padding:4px 10px;">Delete session</button></h2>
    <ol class="progress" id="progress"></ol>
  </div>

  <section id="log" aria-live="polite"></section>
</main>
<form id="composer">
  <div class="field">
    <label for="model">Model (variant)</label>
    <select id="model" aria-label="Model (variant)"></select>
  </div>
  <label class="field" style="flex:1">
    Message
    <textarea id="message" rows="1" required placeholder="Ask the team…"></textarea>
  </label>
  <button type="submit" id="send">Send</button>
</form>
<script type="module">
  const modelSel = document.getElementById("model");
  const variantSel = document.getElementById("variant");
  const betaBox = document.getElementById("beta");
  const log = document.getElementById("log");
  const form = document.getElementById("composer");
  const input = document.getElementById("message");
  const send = document.getElementById("send");
  const createBtn = document.getElementById("create");
  const progCard = document.getElementById("progCard");
  const progressList = document.getElementById("progress");
  const userIn = document.getElementById("user");
  const pnameIn = document.getElementById("pname");
  let sessionReady = true; // direct /v1 mode works without explicit session
  let projectName = "";

  const esc = (t) => { const d = document.createElement("span"); d.textContent = t; return d.innerHTML; };

  async function loadModels() {
    const res = await fetch("/v1/models");
    const body = await res.json();
    const stable = body.data.filter((m) => (m.meta?.status ?? "stable") !== "beta");
    const beta = body.data.filter((m) => m.meta?.status === "beta");
    for (const [arr, isBeta] of [[stable, false], [beta, true]]) {
      for (const m of arr) {
        const opt = document.createElement("option");
        opt.value = m.id;
        opt.innerHTML = m.id + (isBeta ? ' <span class="tag beta">beta</span>' : "");
        if (!isBeta) opt.innerHTML += ' <span class="tag stable">' + (m.meta?.status ?? "stable") + "</span>";
        variantSel.appendChild(opt.cloneNode(true));
        modelSel.appendChild(Object.assign(opt, { innerText: m.id + (isBeta ? " ·beta" : "") }));
      }
    }
  }

  function autoName() {
    const u = (userIn.value || "user").replace(/[^a-z0-9]/gi, "").toLowerCase().slice(0, 10);
    const v = (variantSel.value || "team").replace(/^co-/, "");
    return `${v}-${u}-${new Date().toISOString().slice(5, 10).replace("-", "")}`;
  }
  userIn.addEventListener("input", () => { pnameIn.placeholder = autoName(); });
  variantSel.addEventListener("change", () => { pnameIn.placeholder = autoName(); });

  function renderProgress(trail, status) {
    progCard.style.display = "block";
    progressList.innerHTML = trail
      .map((p) => `<li class="${p.stage === "ready" ? "done" : "active"}">${esc(p.label)} — ${p.stage}</li>`)
      .join("");
    if (status === "ready") {
      setTimeout(() => { progCard.style.display = "none"; }, 1500);
    }
  }

  let currentTenantId = "";
  document.getElementById("deleteBtn").addEventListener("click", async () => {
    if (!currentTenantId) return;
    if (!confirm(`Delete this session? Project files will be removed as well.\n${projectName || currentTenantId}`)) return;
    const res = await fetch(`/tenants/${currentTenantId}`, { method: "DELETE" });
    if (res.status === 200) {
      bubble("assistant", `🗑 Session deleted — "${projectName || currentTenantId}"`);
      progCard.style.display = "none";
      currentTenantId = "";
      sessionReady = false;
      send.disabled = true;
    } else {
      const err = await res.json().catch(() => ({ error: res.statusText }));
      bubble("assistant", `⚠ Delete failed (${res.status}): ${err.error ?? ""}`);
    }
  });

  createBtn.addEventListener("click", async () => {
    createBtn.disabled = true;
    const variant = variantSel.value;
    const user = userIn.value.trim() || "default";
    const name = pnameIn.value.trim();
    const res = await fetch("/sessions", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ variant, user, ...(name ? { name } : {}) }),
    });
    const { tenantId, name: finalName } = await res.json();
    currentTenantId = tenantId;
    projectName = finalName || tenantId;
    // poll progress
    const timer = setInterval(async () => {
      const d = await (await fetch(`/tenants/${tenantId}`)).json();
      renderProgress(d.progress ?? [], d.status);
      if (d.status === "ready" || d.status === "failed") {
        clearInterval(timer);
        createBtn.disabled = false;
        if (d.status === "ready") {
          bubble("assistant", `✔ 세션 준비 완료 — 프로젝트 "${projectName}" (${variant}) · ${user} 전용 테넌트`);
        } else {
          bubble("assistant", `⚠ 프로비저닝 실패: ${d.error ?? "unknown"}`);
        }
      }
    }, 1500);
  });

  function bubble(role, text = "") {
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.textContent = text;
    log.appendChild(div);
    window.scrollTo(0, document.body.scrollHeight);
    return div;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    send.disabled = true;
    bubble("user", message);
    const reply = bubble("assistant");
    reply.classList.add("pending");
    try {
      const res = await fetch("/v1/chat/completions", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          model: modelSel.value,
          user: userIn.value.trim() || "default",
          stream: true,
          messages: [{ role: "user", content: message }],
        }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: res.statusText }));
        throw new Error(err.error ?? `HTTP ${res.status}`);
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buffer.indexOf("\n\n")) >= 0) {
          const frame = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 2);
          for (const line of frame.split("\n")) {
            if (line.startsWith(": provisioning:")) {
              bubble("assistant", "⏳ " + line.replace(": provisioning: ", ""));
              continue;
            }
          }
          if (!frame.startsWith("data: ") || frame === "data: [DONE]") continue;
          const payload = JSON.parse(frame.slice(6));
          if (payload.error) throw new Error(payload.error.message ?? "stream error");
          const delta = payload.choices?.[0]?.delta?.content;
          if (delta) {
            reply.textContent += delta;
            window.scrollTo(0, document.body.scrollHeight);
          }
        }
      }
    } catch (err) {
      reply.textContent += (reply.textContent ? "\n\n" : "") + `⚠ ${err.message}`;
    } finally {
      reply.classList.remove("pending");
      send.disabled = false;
    }
  });

  send.disabled = false;
  loadModels();
</script>
</body>
</html>
