<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Gateway</title>
<style>
  :root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0d1117; color: #e6edf3; height: 100vh; display: flex; }
  .hint { color: #7d8590; }
  /* ── sidebar ── */
  aside { width: 260px; min-width: 220px; background: #10161d; border-right: 1px solid #21262d;
          display: flex; flex-direction: column; padding: 12px; gap: 10px; }
  .brand { font-weight: 700; font-size: .95rem; padding: 2px 4px 8px; }
  .brand span { color: #58a6ff; }
  .newbtn { background: #238636; color: #fff; border: 0; border-radius: 8px; padding: 9px; font: inherit; font-weight: 600; cursor: pointer; width: 100%; }
  .userbox { display: flex; flex-direction: column; gap: 4px; font-size: .74rem; color: #8b949e; }
  .userbox input { background: #0d1117; color: #e6edf3; border: 1px solid #30363d; border-radius: 7px; padding: 7px 9px; font: inherit; }
  .userbox label.check { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .userbox input[type=checkbox] { width: auto; }
  #sessions { flex: 1; overflow-y: auto; border-top: 1px solid #21262d; padding-top: 8px; }
  .sess { padding: 8px 9px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .sess:hover { background: #161b22; }
  .sess.active { background: #1c2a3a; outline: 1px solid #1f6feb; }
  .sess .nm { font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess .meta { color: #6e7681; font-size: .68rem; }
  .sess .del { background: transparent; color: #f85149; border: 0; cursor: pointer; font-size: .75rem; padding: 2px 4px; visibility: hidden; }
  .sess:hover .del { visibility: visible; }
  .sess .del:hover { text-decoration: underline; }
  .sidetitle { font-size: .7rem; color: #8b949e; letter-spacing: .05em; }
  /* ── main column ── */
  section { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid #21262d; }
  header select { background: #0d1117; color: #e6edf3; border: 1px solid #30363d; border-radius: 8px; padding: 6px 9px; font: inherit; font-size: .85rem; }
  header .pname { color: #8b949e; font-size: .78rem; overflow: hidden; text-overflow: ellipsis; }
  header .pname b { color: #c9d1d9; }
  #log { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
  .msg { padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; line-height: 1.6; font-size: .92rem; max-width: 82%; }
  .user { background: #1f6feb22; border: 1px solid #1f6feb55; align-self: flex-end; }
  .assistant { background: #12181f; border: 1px solid #30363d; align-self: stretch; max-width: 100%; }
  .assistant.pending::after { content: "▌"; color: #58a6ff; }
  .progress-inline { color: #e3b341; font-size: .8rem; }
  .composer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #21262d; align-items: flex-end; }
  textarea { flex: 1; background: #0d1117; color: #e6edf3; border: 1px solid #30363d; border-radius: 10px; padding: 10px 12px; font: inherit; min-height: 44px; resize: none; }
  .composer button { background: #1f6feb; color: #fff; border: 0; border-radius: 10px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  .composer button:disabled { opacity: .45; cursor: default; }
  .empty { margin: auto; text-align: center; color: #6e7681; }
  .empty b { color: #c9d1d9; font-size: 1.05rem; display: block; margin-bottom: 6px; }
</style>
</head>
<body>
<aside>
  <div class="brand">Team Gateway <span>teams</span></div>
  <button class="newbtn" id="newChat">＋ New chat</button>
  <div class="userbox">
    <label>User
      <input id="user" value="default" placeholder="alice">
    </label>
    <label class="check"><input type="checkbox" id="beta"> include beta variants</label>
  </div>
  <div class="sidetitle">SESSIONS</div>
  <div id="sessions"></div>
</aside>
<section>
  <header>
    <select id="model" aria-label="Variant"></select>
    <span class="pname" id="pnameLabel"></span>
  </header>
  <div id="log">
    <div class="empty"><b>Ask a variant team</b>
      Pick a team above, type a message — the team workspace is reused automatically
      (same user + same variant → same session, nothing new is created).
    </div>
  </div>
  <form class="composer" id="composer">
    <textarea id="message" rows="1" placeholder="Ask the team…"></textarea>
    <button type="submit" id="send">Send</button>
  </form>
</section>
<script type="module">
  const $ = (id) => document.getElementById(id);
  const modelSel = $("model"), sessionsEl = $("sessions"), log = $("log"),
        form = $("composer"), input = $("message"), send = $("send"),
        userIn = $("user"), betaBox = $("beta"), pnameLabel = $("pnameLabel");
  let currentTenantId = "";
  let currentModel = "";
  let currentUserName = () => (userIn.value.trim() || "default");

  function bubble(role, text = "") {
    document.querySelector(".empty")?.remove();
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  async function loadModels() {
    const body = await (await fetch("/v1/models")).json();
    modelSel.innerHTML = "";
    for (const m of body.data) {
      const o = document.createElement("option");
      o.value = m.id;
      o.textContent = m.meta?.status === "beta" ? `${m.id} · beta` : m.id;
      modelSel.appendChild(o);
    }
  }

  async function loadSessions() {
    const body = await (await fetch("/tenants?mine=1")).json();
    sessionsEl.innerHTML = "";
    const mine = (body.tenants ?? []).slice().reverse();
    for (const t of mine) {
      const row = document.createElement("div");
      row.className = "sess" + (t.tenantId === currentTenantId ? " active" : "");
      const name = t.name ?? t.tenantId;
      const tag = t.status === "failed" ? " ⚠" : t.status === "provisioning" ? " ⏳" : "";
      row.innerHTML = `<div><div class="nm">${name}${tag}</div>` +
        `<div class="meta">${t.variant} · ${t.sessions} turns</div></div>`;
      const del = document.createElement("button");
      del.className = "del"; del.textContent = "Delete"; del.title = "Delete session";
      del.addEventListener("click", async (e) => {
        e.stopPropagation();
        if (!confirm(`Delete "${name}"? Project files will be removed.`)) return;
        const res = await fetch(`/tenants/${t.tenantId}`, { method: "DELETE" });
        if (res.status === 200) {
          if (t.tenantId === currentTenantId) { currentTenantId = ""; pnameLabel.textContent = ""; }
          loadSessions();
        }
      });
      row.appendChild(del);
      row.addEventListener("click", () => selectSession(t));
      sessionsEl.appendChild(row);
    }
  }

  function selectSession(t) {
    currentTenantId = t.tenantId;
    currentModel = t.variant;
    modelSel.value = t.variant;
    userIn.value = t.ownerPrincipal ?? userIn.value;
    pnameLabel.innerHTML = `project: <b>${t.name ?? t.tenantId}</b> · ${t.sessions} turns`;
    log.innerHTML = "";
    bubble("assistant", `Resumed "${t.name ?? t.tenantId}" (${t.variant}) — ${t.sessions} earlier turns. Continue below.`);
    document.querySelectorAll(".sess").forEach((el) => el.classList.remove("active"));
    document.querySelectorAll(".sess").forEach((el) => {
      if (el.querySelector(".nm")?.textContent.startsWith(t.name ?? t.tenantId)) el.classList.add("active");
    });
  }

  $("newChat").addEventListener("click", () => {
    currentTenantId = ""; currentModel = "";
    pnameLabel.textContent = "";
    log.innerHTML = "";
    bubble("assistant", "New chat — pick a variant and send a message. The team workspace is reused per (variant, user); a new project is created only if none exists yet.");
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = ""; send.disabled = true;
    bubble("user", message);
    const reply = bubble("assistant");
    reply.classList.add("pending");
    try {
      const res = await fetch("/v1/chat/completions", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          model: modelSel.value,
          user: currentUserName(),
          stream: true,
          messages: [{ role: "user", content: message }],
        }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: res.statusText }));
        throw new Error(err.error ?? `HTTP ${res.status}`);
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "", first = true;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buffer.indexOf("\n\n")) >= 0) {
          const frame = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 2);
          for (const line of frame.split("\n")) {
            if (line.startsWith(": provisioning:")) {
              const note = document.createElement("div");
              note.className = "progress-inline";
              note.textContent = "⏳ " + line.replace(": provisioning: ", "");
              if (first) { log.appendChild(note); first = false; log.scrollTop = log.scrollHeight; }
              continue;
            }
          }
          if (!frame.startsWith("data: ") || frame === "data: [DONE]") continue;
          const payload = JSON.parse(frame.slice(6));
          if (payload.error) throw new Error(payload.error.message ?? "stream error");
          const delta = payload.choices?.[0]?.delta?.content;
          if (delta) {
            if (first) { reply.remove(); first = false; reply.remove(); }
            reply.textContent += delta;
            log.scrollTop = log.scrollHeight;
          }
        }
      }
      loadSessions();
    } catch (err) {
      reply.textContent += (reply.textContent ? "\n\n" : "") + `⚠ ${err.message}`;
    } finally {
      reply.classList.remove("pending");
      send.disabled = false;
    }
  });

  betaBox.addEventListener("change", loadModels);
  userIn.addEventListener("change", loadSessions);
  send.disabled = false;
  loadModels();
  loadSessions();
</script>
</body>
</html>
