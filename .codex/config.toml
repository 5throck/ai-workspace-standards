# Codex CLI workspace config — see docs/adr/0074-graft-fleet-integration.md and
# docs/adr/0075-codex-platform-support.md.
# Graft MCP is registered project-side; `graft mcp` resolves the repo root from the
# working directory (nearest ancestor with a graft/ index). Machine-global fallbacks
# (~/.codex/config.toml) follow the ADR-0074 per-host matrix.

[mcp_servers.graft]
command = "bunx"
args = ["@nanonets/graft", "mcp"]
